<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>STAND-HF Registry Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a5fb4">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="../assets/STAND-HF-logo.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/icon-512.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="../assets/fonts/material-symbols-rounded.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/base.css?v=20261015c">
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
  </script>
</head>
<body data-page="dashboard">
<div class="app">

  <!-- Side navigation -->
  <aside class="side" id="side" aria-label="Main navigation"></aside>

  <main class="main">

    <!-- Global App Header -->
    <div id="app-header" data-page="dashboard" data-timeline data-search="Search patients, sites, zones or investigators"></div>

    <!-- Role-Aware Dashboard Content Shell -->
    <div id="dashRoot"></div>

  </main>
</div>

<!-- Advanced Multi-Mode Export Dialog (for Central Team & Super Admin) -->
<dialog class="export-dialog" id="exportDlg" aria-labelledby="edTitle" aria-modal="true">
  <div class="ed-head">
    <h3 id="edTitle"><i class="ms" style="color:var(--primary)">download</i>Export Registry Data</h3>
    <button type="button" class="icon-btn" id="edClose" aria-label="Close export dialog"><i class="ms">close</i></button>
  </div>
  <form id="edForm" class="ed-form" onsubmit="return false">
    <div>
      <div class="ed-section-label">Export Scope</div>
      <div class="ed-grid">
        <label class="ed-option">
          <input type="radio" name="edScope" value="all" checked>
          <div><b>All Registry Data</b><div class="muted">All ~100 sites, all patient visits</div></div>
        </label>
        <label class="ed-option">
          <input type="radio" name="edScope" value="filtered">
          <div><b>Current Filter Selection</b><div class="muted" id="edScopeFilterLabel">Active zone/site filter</div></div>
        </label>
      </div>
    </div>

    <div>
      <div class="ed-section-label">Visit Stages</div>
      <div class="ed-grid">
        <label class="ed-option">
          <input type="checkbox" name="edVisits" value="b" checked>
          <div><b>Baseline (Day 0)</b><div class="muted">Demographics, vitals, echo</div></div>
        </label>
        <label class="ed-option">
          <input type="checkbox" name="edVisits" value="m3" checked>
          <div><b>Month 3 (Day 90±14)</b><div class="muted">First follow-up, events</div></div>
        </label>
        <label class="ed-option">
          <input type="checkbox" name="edVisits" value="m6" checked>
          <div><b>Month 6 (Day 180±21)</b><div class="muted">Final follow-up, LVEF, events</div></div>
        </label>
        <label class="ed-option">
          <input type="checkbox" name="edOnly4Pillars" value="1">
          <div><b>4/4 GDMT Only</b><div class="muted">Only fully optimized patients</div></div>
        </label>
      </div>
    </div>

    <div>
      <div class="ed-section-label">File Format</div>
      <div class="ed-grid">
        <label class="ed-option">
          <input type="radio" name="edFormat" value="csv" checked>
          <div><b>Research-Ready CSV</b><div class="muted">1 row per patient-visit, UTF-8 BOM</div></div>
        </label>
        <label class="ed-option">
          <input type="radio" name="edFormat" value="summary">
          <div><b>Site League Summary CSV</b><div class="muted">Aggregated performance by site</div></div>
        </label>
      </div>
    </div>

    <div class="ed-foot">
      <button type="button" class="btn" id="edCancel">Cancel</button>
      <button type="button" class="btn primary" id="edDownloadBtn"><i class="ms">file_download</i>Generate & Download</button>
    </div>
  </form>
</dialog>

<!-- Notification Snack / Toast -->
<div class="snack" id="snack" role="status" aria-live="polite"></div>

<!-- Required Shared Infrastructure Scripts in Strict Order -->
<script src="../assets/access.js?v=20261015b"></script>
<script src="../assets/notifications-data.js?v=20261015b"></script>
<script src="../assets/lookups.js?v=20261015b"></script>
<script src="../assets/file-card.js?v=20261015b"></script>
<script src="../assets/dialog.js?v=20261015b"></script>
<script src="../assets/header.js?v=20261015b" data-root="../"></script>
<script src="../assets/nav.js?v=20261015b"></script>
<script src="../assets/dash-charts.js?v=20261015c"></script>
<script src="../assets/dash-components.js?v=20261015c"></script>

<script>
(function(){
'use strict';

/* --- Core Configuration & Access Guard --- */
const ECRF = '../records/', LOGIN = '../login/', ADMIN = '../admin/';
const KEY = 'standhf_ecrf_v1';
const PL = [['arni','ARNI'],['bb','Beta-blocker'],['mra','MRA'],['sg','SGLT2i']];
const VK = [['b','Baseline'],['m3','3 Months'],['m6','6 Months']];
const DAY = 864e5;

/* Guard: user must be authenticated */
const auth = sessionVal('standhf_auth');
if (auth !== '1') { location.replace(LOGIN); return; }

const sess = session();
const ROLE = sess.role; // 'investigator' | 'central' | 'superadmin'
const USER_NAME = sess.name;
const USER_HANDLE = sess.username;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const G = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const day = s => new Date(s + 'T00:00:00');
const addD = (s, n) => { const d = day(s); d.setDate(d.getDate() + n); return d; };
const fmtD = d => d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
const fmtShortD = d => d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
const initials = s => String(s || '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
const pct = (a, b) => (b ? Math.round(100 * a / b) : null);
const mean = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
const signed = x => (x == null ? '–' : (x > 0 ? '+' : '') + x.toFixed(1));

function toast(m){
  const el = $('snack');
  if(!el) return;
  el.textContent = m;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2800);
}

/* --- Patient Data Loader --- */
function loadData(){
  try {
    const raw = localStorage.getItem(KEY);
    const d = JSON.parse(raw || 'null');
    if (Array.isArray(d?.pts)) return d.pts;
  } catch(e){}
  return [];
}

/* Clinical helpers */
function has(v){
  return Object.keys(v||{}).some(k => k !== 'done' && v[k] !== '' && v[k] != null && typeof v[k] !== 'object') ||
    (v.g && Object.values(v.g).some(x => x.status));
}

function act(v){
  return PL.filter(([q]) => G(v, 'g.' + q + '.status') === 'Active').length;
}

function window_(p, k){
  const b = p.v?.b?.date;
  if (k === 'b' || !b) return null;
  const t = k === 'm3' ? 90 : 180, w = k === 'm3' ? 14: 21;
  return [addD(b, t - w), addD(b, t + w), t, w];
}

function vstat(p, k){
  const v = p.v?.[k] || {};
  if (v.done) return 'Completed';
  const b = p.v?.b?.done ? p.v.b.date : null;
  let late = false, due = false, missed = false;
  if (k !== 'b' && b) {
    const t = k === 'm3' ? 90 : 180, w = k === 'm3' ? 14 : 21, T = new Date();
    late = T > addD(b, t + w);
    due = T >= addD(b, t - w);
    missed = T > addD(b, t + w + 30) && !has(v);
  }
  return missed ? 'Missed' : late ? 'Overdue' : has(v) ? 'In Progress' : due ? 'Due' : 'Not Started';
}

const chipCls = s => s === 'Missed' ? 'Overdue' : s === 'In Progress' ? 'In' : s === 'Not Started' ? 'Not' : s.split(' ')[0];
const nextVisit = p => VK.map(([k]) => k).find(k => !p.v?.[k]?.done) || null;
const visitName = k => VK.find(a => a[0] === k)?.[1] || '';

function onTime(p, k){
  if (k === 'b' || !p.v?.b?.date || !p.v?.[k]?.done || !p.v?.[k]?.date) return null;
  const t = k === 'm3' ? 90 : 180, w = k === 'm3' ? 14 : 21;
  const d = Math.round((day(p.v[k].date) - day(p.v.b.date)) / DAY);
  return Math.abs(d - t) <= w;
}

/* Statistics aggregator for any patient list */
function aggregateStats(list){
  const n = list.length;
  const b = list.filter(p => p.v?.b?.done).length;
  const m3 = list.filter(p => p.v?.m3?.done).length;
  const m6 = list.filter(p => p.v?.m6?.done).length;
  const all3 = list.filter(p => p.v?.b?.done && p.v?.m3?.done && p.v?.m6?.done).length;

  const fu = list.flatMap(p => ['m3','m6'].map(k => onTime(p, k))).filter(x => x !== null);
  const ontimeRate = fu.length ? Math.round(100 * fu.filter(Boolean).length / fu.length) : null;

  const overdueCount = list.reduce((c, p) => c + ['m3','m6'].filter(k => ['Overdue','Missed'].includes(vstat(p, k))).length, 0);
  const dueCount = list.reduce((c, p) => c + ['m3','m6'].filter(k => vstat(p, k) === 'Due').length, 0);

  // GDMT 4-pillar calculation at latest done visit
  const latestPillars = list.map(p => {
    const last = ['m6','m3','b'].find(k => p.v?.[k]?.done);
    return last ? act(p.v[last]) : null;
  }).filter(x => x !== null);
  const fourPillars = latestPillars.filter(x => x === 4).length;
  const gdmtRate = latestPillars.length ? Math.round(100 * fourPillars / latestPillars.length) : null;

  // Primary functional outcomes
  const dMsts = list.filter(p => p.v?.b?.msts !== '' && p.v?.b?.msts != null && p.v?.m6?.msts !== '' && p.v?.m6?.msts != null)
    .map(p => +p.v.m6.msts - +p.v.b.msts);
  const dEf = list.filter(p => p.v?.b?.lvef !== '' && p.v?.b?.lvef != null && p.v?.m6?.lvef !== '' && p.v?.m6?.lvef != null)
    .map(p => +p.v.m6.lvef - +p.v.b.lvef);

  // Adverse Clinical Events recorded at 3M and 6M
  const events = {
    hf: list.filter(p => ['m3','m6'].some(k => G(p.v?.[k], 'ev.hf'))).length,
    other: list.filter(p => ['m3','m6'].some(k => G(p.v?.[k], 'ev.all'))).length,
    death: list.filter(p => ['m3','m6'].some(k => G(p.v?.[k], 'ev.death'))).length
  };

  const pendingSync = list.filter(p => p.sync === 'Pending').length;

  return { n, b, m3, m6, all3, ontimeRate, overdueCount, dueCount, fourPillars, gdmtRate, dMsts, dEf, events, pendingSync };
}

/* Time period filter state: 1 = Today, 7 = Week, 30 = Month, 0 = All */
let periodDays = 7;
function matchesPeriod(p){
  if (periodDays === 0) return true;
  if (!p.consent) return false;
  const d = day(p.consent), now = new Date();
  now.setHours(0,0,0,0);
  return (now - d) / DAY < periodDays;
}

/* Global search query from top bar */
let searchQuery = '';

/* Filter states for Central & Super Admin */
let filterZone = 'all';
let filterSite = 'all';
let filterInv = 'all';
let filterGdmt = 'all'; // 'all', '4', 'incomplete'

/* Helper to map site code to zone */
function getSiteZone(code){
  const s = accessStore();
  const found = s.sites.find(x => x.code === code);
  return found?.zone || 'Central';
}

/* Active dashboard view tabs */
let currentInvTab = 'all';
let currentCentralTab = 'all';
let currentSuperTab = 'all';

/* ==========================================================================
   VIEW 1: SITE INVESTIGATOR DASHBOARD
   ========================================================================== */
function renderInvestigatorView(allPts){
  const mine = allPts.filter(p => p.owner === USER_HANDLE || p.inv === USER_NAME);
  const st = aggregateStats(mine);
  const newCount = mine.filter(matchesPeriod).length;
  const sites = [...new Set(mine.map(p => p.site).filter(Boolean))].sort();

  // Upcoming visits needing attention
  const upcoming = mine.map(p => {
    const k = nextVisit(p);
    if (!k) return null;
    return { p, k, s: vstat(p, k), win: window_(p, k) };
  }).filter(Boolean);
  const rank = { Missed: 0, Overdue: 0, Due: 1, 'In Progress': 2, 'Not Started': 3, Completed: 4 };
  upcoming.sort((a,b) => (rank[a.s] - rank[b.s]) || ((a.win ? a.win[0] : 0) - (b.win ? b.win[0] : 0)));

  const tabs = [
    { id: 'all', label: 'Overview', icon: 'dashboard' },
    { id: 'patients', label: 'My Patients', icon: 'group', badge: mine.length },
    { id: 'upcoming', label: 'Upcoming Visits', icon: 'event_upcoming', badge: upcoming.length },
    { id: 'clinical', label: 'Clinical Performance', icon: 'monitoring' },
    { id: 'sites', label: 'Assigned Sites', icon: 'local_hospital', badge: sites.length }
  ];

  const headerHtml = `
    <div class="hello">
      <div>
        <h1 id="welcome">Welcome, Dr. ${esc(USER_NAME.split(/\s+/)[0])}</h1>
        <p id="meta">Assigned Sites: ${sites.join(', ') || 'No site assigned'} · Clinical Outpatient HF Registry</p>
      </div>
      <div class="actions">
        <a class="btn" href="${ECRF}"><i class="ms">edit_note</i>Patient records</a>
        <a class="btn primary" href="${ECRF}?new=1"><i class="ms">person_add</i>Add patient</a>
      </div>
    </div>
    ${DashUI.viewTabs(tabs, currentInvTab)}
  `;

  let bodyHtml = '';
  if (currentInvTab === 'patients') {
    bodyHtml = `
      <section class="row two dash-fade-in" style="margin-top:16px">
        <div class="card">
          <div class="card-head"><h2>My patients</h2><small id="invPtCount">${mine.length} total</small></div>
          <div class="plist" id="invPlist">${renderInvestigatorList(upcoming)}</div>
        </div>
        <div class="card" id="invDetail">${renderInvestigatorDetail(upcoming[0])}</div>
      </section>
    `;
  } else if (currentInvTab === 'upcoming') {
    bodyHtml = `
      <div class="dash-fade-in" style="margin-top:16px">
        <div class="card" style="margin-bottom:16px">
          <div class="card-head"><h2>Phase progress</h2><small>Share of your patients with each visit complete</small></div>
          <div class="rings">${DashCharts.phaseDials(mine)}</div>
          <div class="legend"><span><i style="background:var(--success)"></i>Complete</span><span><i style="background:var(--primary)"></i>In progress</span><span><i style="background:var(--warning)"></i>Due</span><span><i style="background:var(--error)"></i>Overdue</span></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Upcoming Visits Schedule</h2><small>Next visit window per patient</small></div>
          <div class="upc" id="invUpcoming">${renderInvestigatorUpcoming(upcoming)}</div>
        </div>
      </div>
    `;
  } else if (currentInvTab === 'clinical') {
    bodyHtml = `
      <div class="dash-fade-in" style="margin-top:16px">
        <div class="dash-grid">
          <section class="card">
            <div class="card-head"><h2>Clinical Performance</h2><small>From your verified patient data</small></div>
            <div id="perfMetrics">
              <div class="metric"><span>Follow-up visits within protocol window</span><b class="${st.ontimeRate>=80?'good':'warn'}">${st.ontimeRate!=null?st.ontimeRate+'%':'–'}</b></div>
              <div class="metric"><span>Mean 1MSTS change (Baseline to 6 Months)</span><b class="${mean(st.dMsts)>0?'good':''}">${signed(mean(st.dMsts))} reps</b></div>
              <div class="metric"><span>Mean LVEF change (Baseline to 6 Months)</span><b class="${mean(st.dEf)>0?'good':''}">${signed(mean(st.dEf))}%</b></div>
              <div class="metric"><span>Patients at 4 of 4 GDMT pillars (latest visit)</span><b class="${st.gdmtRate>=70?'good':''}">${st.fourPillars} / ${st.n} (${st.gdmtRate??0}%)</b></div>
            </div>
          </section>
          <section class="card">
            <div class="card-head"><h2>Recruitment Trajectory</h2><small>New patients per month, last 6 months</small></div>
            <svg class="chart" id="enrolSvg" viewBox="0 0 600 200" role="img" aria-label="New patients per month">${renderEnrolmentSvg(mine)}</svg>
          </section>
        </div>
      </div>
    `;
  } else if (currentInvTab === 'sites') {
    bodyHtml = `
      <section class="card dash-fade-in" style="margin-top:16px">
        <div class="card-head"><h2>My Assigned Sites</h2><small>Cardiology centres assigned to you</small></div>
        <div class="table-wrap">
          <table>
            <tr><th>Site</th><th class="num">Patients</th><th class="num">Baseline</th><th class="num">3M</th><th class="num">6M</th><th class="num">All Complete</th></tr>
            ${sites.map(s => {
              const ps = mine.filter(p => p.site === s);
              return `<tr>
                <td><b>${esc(s)}</b><div class="muted">${esc(getSiteZone(s))} Zone</div></td>
                <td class="num">${ps.length}</td>
                <td class="num">${ps.filter(p=>p.v?.b?.done).length}</td>
                <td class="num">${ps.filter(p=>p.v?.m3?.done).length}</td>
                <td class="num">${ps.filter(p=>p.v?.m6?.done).length}</td>
                <td class="num">${ps.filter(p=>p.v?.b?.done && p.v?.m3?.done && p.v?.m6?.done).length}</td>
              </tr>`;
            }).join('') || '<tr><td colspan="6" class="muted">No sites assigned yet.</td></tr>'}
          </table>
        </div>
      </section>
    `;
  } else {
    // 'all'
    bodyHtml = `
      <div class="dash-fade-in">
        ${DashUI.kpiGrid([
          { icon: 'group', value: st.n, label: 'My patients', sub: 'All patients you entered', iconBg: 'brand' },
          { icon: 'person_add', value: newCount, label: 'New patients', sub: 'Consented in selected period', tag: 'New', tagType: 'info' },
          { icon: 'biotech', value: st.b, label: 'Baseline complete', sub: `${st.b} of ${st.n} enrolled`, tag: `${pct(st.b, st.n) ?? 0}%`, tagType: pct(st.b, st.n) >= 80 ? 'good' : '', iconBg: 'success' },
          { icon: 'event_upcoming', value: st.overdueCount + st.dueCount, label: 'Follow-ups due', sub: `${st.overdueCount} overdue/missed`, tag: st.overdueCount ? 'Action' : 'Clear', tagType: st.overdueCount ? 'warn' : 'good', alert: !!st.overdueCount, iconBg: st.overdueCount ? 'error' : 'warn' },
          { icon: 'cloud_sync', value: st.pendingSync, label: 'Pending sync', sub: st.pendingSync ? 'Saved on this device' : 'All synced', tag: st.pendingSync ? 'Pending' : 'Synced', tagType: st.pendingSync ? 'warn' : 'good' }
        ])}

        <section class="row two">
          <div class="card">
            <div class="card-head"><h2>Phase progress</h2><small>Share of your patients with each visit complete</small></div>
            <div class="rings">${DashCharts.phaseDials(mine)}</div>
            <div class="legend"><span><i style="background:var(--success)"></i>Complete</span><span><i style="background:var(--primary)"></i>In progress</span><span><i style="background:var(--warning)"></i>Due</span><span><i style="background:var(--error)"></i>Overdue</span></div>
          </div>
          <div class="card">
            <div class="card-head"><h2>Enrolment</h2><small>New patients per month, last 6 months</small></div>
            <svg class="chart" id="enrolSvg" viewBox="0 0 600 200" role="img" aria-label="New patients per month">${renderEnrolmentSvg(mine)}</svg>
          </div>
        </section>

        <section class="row three">
          <div class="card">
            <div class="card-head"><h2>My patients</h2><small id="invPtCount">${mine.length} total</small></div>
            <div class="plist" id="invPlist">${renderInvestigatorList(upcoming)}</div>
          </div>
          <div class="card" id="invDetail">${renderInvestigatorDetail(upcoming[0])}</div>
          <div class="card">
            <div class="card-head"><h2>Upcoming visits</h2><small>Next visit window per patient</small></div>
            <div class="upc" id="invUpcoming">${renderInvestigatorUpcoming(upcoming)}</div>
          </div>
        </section>

        <section class="row two-even">
          <div class="card">
            <div class="card-head"><h2>Clinical Performance</h2><small>From your verified patient data</small></div>
            <div id="perfMetrics">
              <div class="metric"><span>Follow-up visits within protocol window</span><b class="${st.ontimeRate>=80?'good':'warn'}">${st.ontimeRate!=null?st.ontimeRate+'%':'–'}</b></div>
              <div class="metric"><span>Mean 1MSTS change (Baseline to 6 Months)</span><b class="${mean(st.dMsts)>0?'good':''}">${signed(mean(st.dMsts))} reps</b></div>
              <div class="metric"><span>Mean LVEF change (Baseline to 6 Months)</span><b class="${mean(st.dEf)>0?'good':''}">${signed(mean(st.dEf))}%</b></div>
              <div class="metric"><span>Patients at 4 of 4 GDMT pillars (latest visit)</span><b class="${st.gdmtRate>=70?'good':''}">${st.fourPillars} / ${st.n} (${st.gdmtRate??0}%)</b></div>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h2>My Assigned Sites</h2><small>Cardiology centres assigned to you</small></div>
            <div class="table-wrap">
              <table>
                <tr><th>Site</th><th class="num">Patients</th><th class="num">Baseline</th><th class="num">3M</th><th class="num">6M</th><th class="num">All Complete</th></tr>
                ${sites.map(s => {
                  const ps = mine.filter(p => p.site === s);
                  return `<tr>
                    <td><b>${esc(s)}</b><div class="muted">${esc(getSiteZone(s))} Zone</div></td>
                    <td class="num">${ps.length}</td>
                    <td class="num">${ps.filter(p=>p.v?.b?.done).length}</td>
                    <td class="num">${ps.filter(p=>p.v?.m3?.done).length}</td>
                    <td class="num">${ps.filter(p=>p.v?.m6?.done).length}</td>
                    <td class="num">${ps.filter(p=>p.v?.b?.done && p.v?.m3?.done && p.v?.m6?.done).length}</td>
                  </tr>`;
                }).join('') || '<tr><td colspan="6" class="muted">No sites assigned yet.</td></tr>'}
              </table>
            </div>
          </div>
        </section>
      </div>
    `;
  }

  return headerHtml + bodyHtml;
}

function renderEnrolmentSvg(pts){
  const now = new Date(), months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ y: d.getFullYear(), m: d.getMonth(), lbl: d.toLocaleDateString('en-GB', { month: 'short' }), n: 0 });
  }
  pts.forEach(p => {
    if (!p.consent) return;
    const d = day(p.consent);
    const h = months.find(x => x.y === d.getFullYear() && x.m === d.getMonth());
    if (h) h.n++;
  });
  const max = Math.max(1, ...months.map(x => x.n)), W = 600, H = 200, pad = 28, bw = (W - pad * 2) / months.length;
  const bars = months.map((x, i) => {
    const h = (H - pad - 14) * x.n / max, xx = pad + i * bw + bw * 0.2, w = bw * 0.6;
    return `<rect x="${xx}" y="${H - pad - h}" width="${w}" height="${h}" rx="8" fill="${x.n ? 'var(--primary)' : 'var(--soft)'}"/>
      <text x="${xx + w/2}" y="${H - pad + 16}" text-anchor="middle" font-size="13" fill="var(--ink-3)">${x.lbl}</text>
      <text x="${xx + w/2}" y="${H - pad - h - 6}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">${x.n}</text>`;
  }).join('');
  const grid = [0, 0.5, 1].map(f => `<line x1="${pad}" x2="${W - pad}" y1="${H - pad - (H - pad - 14) * f}" y2="${H - pad - (H - pad - 14) * f}" stroke="var(--line)"/>`).join('');
  return grid + bars;
}

    if (filterInv !== 'all') targetPts = targetPts.filter(p => p.inv === filterInv);
    targetDesc = `Zone:${filterZone}, Site:${filterSite}, Inv:${filterInv}`;
  }

  if (only4Pillars) {
    targetPts = targetPts.filter(p => {
      const last = ['m6','m3','b'].find(k => p.v?.[k]?.done);
      return last && act(p.v[last]) === 4;
    });
    targetDesc += ' (4/4 GDMT Only)';
  }

  if (format === 'summary') {
    // Generate site league summary
    const s = accessStore();
    const rows = [['Site Code','Site Name','Zone','Enrolled Patients','Baseline Completed','3M Completed','6M Completed','On-Time Adherence %','Overdue Count','GDMT 4/4 Rate %']];
    s.sites.forEach(st => {
      const ps = targetPts.filter(p => p.site === st.code);
      const n = ps.length;
      const b = ps.filter(p => p.v?.b?.done).length;
      const m3 = ps.filter(p => p.v?.m3?.done).length;
      const m6 = ps.filter(p => p.v?.m6?.done).length;
      const fu = ps.flatMap(p => ['m3','m6'].map(k => onTime(p, k))).filter(x => x !== null);
      const ontime = fu.length ? Math.round(100 * fu.filter(Boolean).length / fu.length) : '';
      const overdue = ps.reduce((c, p) => c + ['m3','m6'].filter(k => ['Overdue','Missed'].includes(vstat(p, k))).length, 0);
      const gdmt4 = ps.filter(p => {
        const last = ['m6','m3','b'].find(k => p.v?.[k]?.done);
        return last && act(p.v[last]) === 4;
      }).length;
      const gdmtPct = n ? Math.round(100 * gdmt4 / n) : '';
      rows.push([st.code, st.name, st.zone||'', n, b, m3, m6, ontime, overdue, gdmtPct]);
    });
    downloadCsv(rows, 'stand-hf-site-league-summary', targetDesc);
    return;
  }

  // 1-Row-Per-Patient-Visit Research Dataset (Compliant with FSD & Brief)
  const header = [
    'Study_ID','Site_Code','Site_Zone','Investigator_Name','Patient_Name','Contact_Number','Consent_Date','Age','Sex','HF_Etiology',
    'Visit_Stage','Visit_Status','Visit_Date','Weight_kg','Heart_Rate_bpm','Systolic_BP_mmHg','Diastolic_BP_mmHg',
    'NYHA_Class','1MSTS_Reps_60s','LVEF_Percent','Echo_Date','Active_GDMT_Pillars_Count',
    'ARNI_Drug','ARNI_Dose','ARNI_Status',
    'BetaBlocker_Drug','BetaBlocker_Dose','BetaBlocker_Status',
    'MRA_Drug','MRA_Dose','MRA_Status',
    'SGLT2i_Drug','SGLT2i_Dose','SGLT2i_Status',
    'HF_Hospitalization','Other_Hospitalization','Death','Major_Intervention_Notes'
  ];

  const rows = [header];
  const visitLabels = { b: 'Baseline', m3: 'Month 3', m6: 'Month 6' };

  targetPts.forEach(p => {
    visits.forEach(k => {
      const v = p.v?.[k] || {};
      const g = q => (v.g && v.g[q]) || {};
      const ev = v.ev || {};
      const activeCount = act(v);

      rows.push([
        p.id, p.site, getSiteZone(p.site), p.inv || '', p.name || '', p.contact || '', p.consent || '', p.age || '', p.sex || '', p.etio || '',
        visitLabels[k], vstat(p, k), v.date || '', v.wt || '', v.hr || '', v.sbp || '', v.dbp || '',
        v.nyha || '', v.msts != null ? v.msts : '', v.lvef != null ? v.lvef : '', v.echoDate || '', activeCount,
        g('arni').drug || '', g('arni').dose || '', g('arni').status || '',
        g('bb').drug || '', g('bb').dose || '', g('bb').status || '',
        g('mra').drug || '', g('mra').dose || '', g('mra').status || '',
        g('sg').drug || '', g('sg').dose || '', g('sg').status || '',
        ev.hf ? 1 : 0, ev.all ? 1 : 0, ev.death ? 1 : 0, ev.notes || ''
      ]);
    });
  });

  downloadCsv(rows, 'stand-hf-research-dataset', targetDesc);
}

function downloadCsv(rows, filenamePrefix, targetDescription){
  const csvContent = rows.map(r => r.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${filenamePrefix}-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  // Record into Central Audit Log (accessible to Super Admin)
  logCentralAction('Export CSV', `${rows.length - 1} rows (${targetDescription})`, targetDescription);
  toast(`Export complete: ${rows.length - 1} rows downloaded & logged to central audit.`);
}


/* ==========================================================================
   INITIALIZATION & EVENT BINDINGS
   ========================================================================== */
function renderDashboard(){
  const allPts = loadData();
  const root = $('dashRoot');
  if (!root) return;

  if (ROLE === 'investigator') {
    root.innerHTML = renderInvestigatorView(allPts);
  } else if (ROLE === 'superadmin') {
    root.innerHTML = renderSuperAdminView(allPts);
  } else {
    // Default to Central Team Monitoring Dashboard
    root.innerHTML = renderCentralView(allPts);
  }

  attachEvents();
}

function attachEvents(){
  // Tab switcher clicks
  document.querySelectorAll('.dash-tab[data-dashtab]').forEach(btn => {
    btn.onclick = () => {
      const tabId = btn.dataset.dashtab;
      if (ROLE === 'investigator') currentInvTab = tabId;
      else if (ROLE === 'superadmin') currentSuperTab = tabId;
      else currentCentralTab = tabId;
      renderDashboard();
    };
  });

  // Breadcrumb navigation from investigator drill-down profile
  const btnBreadcrumb = $('btnBreadcrumbDash');
  if (btnBreadcrumb) {
    btnBreadcrumb.onclick = e => {
      e.preventDefault();
      adminProfileUsername = null;
      renderDashboard();
      window.scrollTo(0, 0);
    };
  }

  // Period filter clicks (Today, Week, Month from header.js)
  document.querySelectorAll('[data-period]').forEach(btn => {
    btn.onclick = () => {
      periodDays = +btn.dataset.period;
      document.querySelectorAll('[data-period]').forEach(b => b.classList.toggle('on', b === btn));
      renderDashboard();
    };
  });

  // Topbar global search input
  const searchInput = $('search');
  if (searchInput) {
    searchInput.oninput = () => {
      searchQuery = searchInput.value;
      renderDashboard();
    };
  }

  // Investigator patient selection
  document.querySelectorAll('[data-invid]').forEach(btn => {
    btn.onclick = () => {
      invSelectedId = btn.dataset.invid;
      const allPts = loadData();
      const mine = allPts.filter(p => p.owner === USER_HANDLE || p.inv === USER_NAME);
      const upcoming = mine.map(p => ({ p, k: nextVisit(p), s: vstat(p, nextVisit(p)||'b'), win: window_(p, nextVisit(p)||'b') })).filter(Boolean);
      const selU = upcoming.find(x => x.p.id === invSelectedId) || upcoming[0];
      const plistEl = $('invPlist');
      const detailEl = $('invDetail');
      if (plistEl) plistEl.innerHTML = renderInvestigatorList(upcoming);
      if (detailEl) detailEl.innerHTML = renderInvestigatorDetail(selU);
    };
  });

  // Central Team Hierarchy Filters
  const selZone = $('selZone');
  if (selZone) {
    selZone.onchange = () => {
      filterZone = selZone.value;
      filterSite = 'all'; // reset dependent site
      filterInv = 'all';  // reset dependent inv
      renderDashboard();
    };
  }

  const selSite = $('selSite');
  if (selSite) {
    selSite.onchange = () => {
      filterSite = selSite.value;
      filterInv = 'all';
      renderDashboard();
    };
  }

  const selInv = $('selInv');
  if (selInv) {
    selInv.onchange = () => {
      filterInv = selInv.value;
      renderDashboard();
    };
  }

  const selGdmt = $('selGdmt');
  if (selGdmt) {
    selGdmt.onchange = () => {
      filterGdmt = selGdmt.value;
      renderDashboard();
    };
  }

  const btnReset = $('btnResetFilters');
  if (btnReset) {
    btnReset.onclick = () => {
      filterZone = 'all';
      filterSite = 'all';
      filterInv = 'all';
      filterGdmt = 'all';
      renderDashboard();
    };
  }

  // Quick Site Export buttons
  document.querySelectorAll('[data-export-site]').forEach(btn => {
    btn.onclick = () => {
      const siteCode = btn.dataset.exportSite;
      const allPts = loadData().filter(p => p.site === siteCode);
      const header = ['Study_ID','Site','Consent_Date','Age','Sex','Etiology','Baseline_Status','3M_Status','6M_Status','GDMT_Pillars'];
      const rows = [header];
      allPts.forEach(p => {
        const last = ['m6','m3','b'].find(k => p.v?.[k]?.done);
        rows.push([p.id, p.site, p.consent||'', p.age||'', p.sex||'', p.etio||'', vstat(p,'b'), vstat(p,'m3'), vstat(p,'m6'), last ? act(p.v[last]) : 0]);
      });
      downloadCsv(rows, `stand-hf-site-${siteCode}`, `Site ${siteCode}`);
    };
  });

  // Export League CSV button
  const btnExportLeague = $('btnExportLeague');
  if (btnExportLeague) {
    btnExportLeague.onclick = () => {
      generateAndDownloadExport('all', ['b','m3','m6'], false, 'summary');
    };
  }

  // Export Modal trigger
  const btnExportModal = $('btnExportModal');
  const exportDlg = $('exportDlg');
  if (btnExportModal && exportDlg) {
    btnExportModal.onclick = () => {
      const lbl = $('edScopeFilterLabel');
      if (lbl) lbl.textContent = `Zone:${filterZone}, Site:${filterSite}, Inv:${filterInv}`;
      exportDlg.showModal();
    };
  }

  const edClose = $('edClose');
  const edCancel = $('edCancel');
  if (edClose && exportDlg) edClose.onclick = () => exportDlg.close();
  if (edCancel && exportDlg) edCancel.onclick = () => exportDlg.close();

  // Export download button inside modal
  const edDownloadBtn = $('edDownloadBtn');
  if (edDownloadBtn && exportDlg) {
    edDownloadBtn.onclick = () => {
      const scope = document.querySelector('input[name="edScope"]:checked')?.value || 'all';
      const visits = Array.from(document.querySelectorAll('input[name="edVisits"]:checked')).map(x => x.value);
      const only4 = !!document.querySelector('input[name="edOnly4Pillars"]:checked');
      const format = document.querySelector('input[name="edFormat"]:checked')?.value || 'csv';

      if (!visits.length && format === 'csv') {
        toast('Please select at least one visit stage.');
        return;
      }
      exportDlg.close();
      generateAndDownloadExport(scope, visits, only4, format);
    };
  }

  // Super Admin: Investigator profile drill-down
  document.querySelectorAll('[data-admin-profile]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      adminProfileUsername = el.dataset.adminProfile;
      renderDashboard();
      window.scrollTo(0, 0);
    };
  });

  // Super Admin: Back to overview button from investigator profile
  const btnBack = $('btnAdminProfileBack');
  if (btnBack) {
    btnBack.onclick = () => {
      adminProfileUsername = null;
      renderDashboard();
      window.scrollTo(0, 0);
    };
  }

  // Super Admin: Export single investigator
  document.querySelectorAll('[data-export-inv]').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      exportSingleInvestigator(btn.dataset.exportInv);
    };
  });

  // Super Admin: Export all investigators summary
  const btnExportAllInvs = $('btnExportAllInvs');
  if (btnExportAllInvs) {
    btnExportAllInvs.onclick = () => {
      exportAllInvestigatorsSummary();
    };
  }
}

// Initial Render
renderDashboard();

})();
</script>
