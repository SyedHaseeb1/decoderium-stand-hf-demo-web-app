/* Clinical helpers */
function has(v){
  return Object.keys(v||{}).some(k => k !== 'done' && v[k] !== '' && v[k] != null && typeof v[k] !== 'object') ||
    (v.g && Object.values(v.g).some(x => x.status));
}

function act(v){
  return PL.filter(([q]) => G(v, 'g.' + q + '.status') === 'Active').length;
}

function window_(p, k){
  const b = p.v?.b?.date;
  if (k === 'b' || !b) return null;
  const t = k === 'm3' ? 90 : 180, w = (typeof followupAlertThresholdDays === 'function') ? followupAlertThresholdDays() : 14;
  return [addD(b, t - w), addD(b, t + w), t, w];
}

function vstat(p, k){
  const v = p.v?.[k] || {};
  if (v.done) return 'Completed';
  const b = p.v?.b?.done ? p.v.b.date : null;
  let late = false, due = false, missed = false;
  if (k !== 'b' && b) {
    const t = k === 'm3' ? 90 : 180, w = (typeof followupAlertThresholdDays === 'function') ? followupAlertThresholdDays() : 14, T = new Date();
    const threshold = w;
    late = T > addD(b, t + w);
    due = T >= addD(b, t - threshold);
    missed = T > addD(b, t + w + 30) && !has(v);
  }
  return missed ? 'Missed' : late ? 'Overdue' : has(v) ? 'In Progress' : due ? 'Due' : 'Not Started';
}

const chipCls = s => s === 'Missed' ? 'Overdue' : s === 'In Progress' ? 'In' : s === 'Not Started' ? 'Not' : s.split(' ')[0];
const nextVisit = p => VK.map(([k]) => k).find(k => !p.v?.[k]?.done) || null;
const visitName = k => VK.find(a => a[0] === k)?.[1] || '';

function onTime(p, k){
  if (k === 'b' || !p.v?.b?.date || !p.v?.[k]?.done || !p.v?.[k]?.date) return null;
  const t = k === 'm3' ? 90 : 180, w = (typeof followupAlertThresholdDays === 'function') ? followupAlertThresholdDays() : 14;
  const d = Math.round((day(p.v[k].date) - day(p.v.b.date)) / DAY);
  return Math.abs(d - t) <= w;
}

/* Statistics aggregator for any patient list */
function aggregateStats(list){
  const n = list.length;
  const b = list.filter(p => p.v?.b?.done).length;
  const m3 = list.filter(p => p.v?.m3?.done).length;
  const m6 = list.filter(p => p.v?.m6?.done).length;
  const all3 = list.filter(p => p.v?.b?.done && p.v?.m3?.done && p.v?.m6?.done).length;

  const fu = list.flatMap(p => ['m3','m6'].map(k => onTime(p, k))).filter(x => x !== null);
  const ontimeRate = fu.length ? Math.round(100 * fu.filter(Boolean).length / fu.length) : null;

  const overdueCount = list.reduce((c, p) => c + ['m3','m6'].filter(k => ['Overdue','Missed'].includes(vstat(p, k))).length, 0);
  const dueCount = list.reduce((c, p) => c + ['m3','m6'].filter(k => vstat(p, k) === 'Due').length, 0);

  // GDMT 4-pillar calculation at latest done visit
  const latestPillars = list.map(p => {
    const last = ['m6','m3','b'].find(k => p.v?.[k]?.done);
    return last ? act(p.v[last]) : null;
  }).filter(x => x !== null);
  const fourPillars = latestPillars.filter(x => x === 4).length;
  const gdmtRate = latestPillars.length ? Math.round(100 * fourPillars / latestPillars.length) : null;

  // Primary functional outcomes
  const dMsts = list.filter(p => p.v?.b?.msts !== '' && p.v?.b?.msts != null && p.v?.m6?.msts !== '' && p.v?.m6?.msts != null)
    .map(p => +p.v.m6.msts - +p.v.b.msts);
  const dEf = list.filter(p => p.v?.b?.lvef !== '' && p.v?.b?.lvef != null && p.v?.m6?.lvef !== '' && p.v?.m6?.lvef != null)
    .map(p => +p.v.m6.lvef - +p.v.b.lvef);

  // Adverse Clinical Events recorded at 3M and 6M
  const events = {
    hf: list.filter(p => ['m3','m6'].some(k => G(p.v?.[k], 'ev.hf'))).length,
    other: list.filter(p => ['m3','m6'].some(k => G(p.v?.[k], 'ev.all'))).length,
    death: list.filter(p => ['m3','m6'].some(k => G(p.v?.[k], 'ev.death'))).length
  };

  const pendingSync = list.filter(p => p.sync === 'Pending').length;

  return { n, b, m3, m6, all3, ontimeRate, overdueCount, dueCount, fourPillars, gdmtRate, dMsts, dEf, events, pendingSync };
}

/* Time period filter state: 0 = All (default), 1 = Today, 7 = Week, 30 = Month */
// let periodDays = 7; /* Formerly defaulted to Week */
let periodDays = 0; /* Default: all time data */
function matchesPeriod(p){
  if (periodDays === 0) return true;
  if (!p.consent) return false;
  const d = day(p.consent), now = new Date();
  now.setHours(0,0,0,0);
  return (now - d) / DAY < periodDays;
}

function applyHash(h){
  const clean = (h || location.hash || '').replace(/^#/, '').toLowerCase();
  if (!clean) return false;
  let changed = false;

  if (ROLE === 'investigator') {
    if (['performance', 'clinical', 'gdmt', 'report', 'reports', 'analytics'].includes(clean)) {
      if (currentInvTab !== 'clinical') { currentInvTab = 'clinical'; changed = true; }
    } else if (['sites', 'league'].includes(clean)) {
      if (currentInvTab !== 'sites') { currentInvTab = 'sites'; changed = true; }
    } else if (['patients', 'patient'].includes(clean)) {
      if (currentInvTab !== 'all') { currentInvTab = 'all'; changed = true; }
    } else if (['upcoming', 'queue', 'visits'].includes(clean)) {
      if (currentInvTab !== 'upcoming') { currentInvTab = 'upcoming'; changed = true; }
    } else if (['export', 'exports', 'download', 'downloads'].includes(clean)) {
      if (typeof can === 'function' && can('export_data')) {
        if (currentInvTab !== 'export') { currentInvTab = 'export'; changed = true; }
      } else {
        if (currentInvTab !== 'all') { currentInvTab = 'all'; changed = true; }
      }
    } else if (clean === 'all' || clean === 'overview') {
      if (currentInvTab !== 'all') { currentInvTab = 'all'; changed = true; }
    }
  } else {
    // Both Super Admin and Central Team share the Executive Dashboard
    if (['performance', 'analytics', 'gdmt', 'report', 'reports'].includes(clean)) {
      if (currentSuperTab !== 'analytics') { currentSuperTab = 'analytics'; changed = true; }
    } else if (['sites', 'league'].includes(clean)) {
      if (currentSuperTab !== 'league') { currentSuperTab = 'league'; changed = true; }
    } else if (['teams', 'team', 'oversight', 'users', 'investigators', 'invs'].includes(clean)) {
      if (currentSuperTab !== 'teams') { currentSuperTab = 'teams'; changed = true; }
    } else if (['queue', 'overdue', 'alerts'].includes(clean)) {
      if (currentSuperTab !== 'queue') { currentSuperTab = 'queue'; changed = true; }
    } else if (['export', 'exports', 'download', 'downloads'].includes(clean)) {
      if (currentSuperTab !== 'export') { currentSuperTab = 'export'; changed = true; }
    } else if (clean === 'all' || clean === 'overview') {
      if (currentSuperTab !== 'all') { currentSuperTab = 'all'; changed = true; }
    }
  }

  // Smooth scroll and flash highlight to target report card if present
  if (['gdmt', 'performance', 'sites', 'league'].includes(clean)) {
    setTimeout(() => {
      const targetId = clean === 'gdmt' ? 'cardGdmtReport' : (clean === 'sites' || clean === 'league') ? 'cardSitesReport' : 'cardPerfReport';

        el.classList.add('fld-flash');
        setTimeout(() => el.classList.remove('fld-flash'), 1500);
      }
    }, 120);
  }

  return changed;
}

function renderEnrolmentSvg(pts){
  const now = new Date(), months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ y: d.getFullYear(), m: d.getMonth(), lbl: d.toLocaleDateString('en-GB', { month: 'short' }), n: 0 });
  }
  pts.forEach(p => {
    if (!p.consent) return;
    const d = day(p.consent);
    const h = months.find(x => x.y === d.getFullYear() && x.m === d.getMonth());
    if (h) h.n++;
  });
  const max = Math.max(1, ...months.map(x => x.n)), W = 600, H = 200, pad = 28, bw = (W - pad * 2) / months.length;
  const bars = months.map((x, i) => {
    const h = (H - pad - 30) * x.n / max, xx = pad + i * bw + bw * 0.2, w = bw * 0.6;
    return `<rect x="${xx}" y="${H - pad - h}" width="${w}" height="${h}" rx="8" fill="${x.n ? 'var(--primary)' : 'var(--soft)'}"/>
      <text x="${xx + w/2}" y="${H - pad + 16}" text-anchor="middle" font-size="13" fill="var(--ink-3)">${x.lbl}</text>
      <text x="${xx + w/2}" y="${H - pad - h - 6}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">${x.n}</text>`;
  }).join('');
  const grid = [0, 0.5, 1].map(f => `<line x1="${pad}" x2="${W - pad}" y1="${H - pad - (H - pad - 30) * f}" y2="${H - pad - (H - pad - 30) * f}" stroke="var(--line)"/>`).join('');
  return grid + bars;
}

let invSelectedId = null;
// Shared row builder for the investigator patient list, detail pane and click handler
function invPatientRows(allPts){
  const mine = allPts.filter(inScope);
  const rows = mine.map(p => {
    const k = nextVisit(p);
    if (!k) return { p, k: null, s: 'Completed', win: null };
    return { p, k, s: vstat(p, k), win: window_(p, k) };
  });
  const rank = { Missed: 0, Overdue: 0, Due: 1, 'In Progress': 2, 'Not Started': 3, Completed: 4 };
  return rows.sort((a,b) => (rank[a.s] - rank[b.s]) || ((a.win ? a.win[0] : 0) - (b.win ? b.win[0] : 0)));
}

/* ==========================================================================
   RESEARCH-READY EXPORT MODULE & CUSTOM FILTER STUDIO (CSV / TSV / JSON)
   ========================================================================== */
let exportFilterState = {
  zone: 'all',
  site: 'all',
  inv: 'all',
  visits: ['b', 'm3', 'm6'],
  vstat: 'all',          // 'all' | 'completed' | 'in_progress' | 'overdue'
  gdmt: 'all',           // 'all' | '4' | 'suboptimal'
  pillar: 'all',         // 'all' | 'arni' | 'bb' | 'mra' | 'sg'
  etio: 'all',           // 'all' or one of the HF etiologies in clinical-options.json
  period: 'all',         // 'all' | '30' | '90' | '180'
  deidentify: true,      // true: mask names & contacts
  format: 'csv'          // 'csv' | 'tsv' | 'json'
};

function getExportFilteredCohort(ptsPool) {
  let list = ptsPool.slice();
  const f = exportFilterState;

  // Zone filter
  if (f.zone !== 'all') {
    list = list.filter(p => getSiteZone(p.site) === f.zone);
  }
  // Site filter
  if (f.site !== 'all') {
    list = list.filter(p => p.site === f.site);
  }
  // Investigator filter
  if (f.inv !== 'all') {
    list = list.filter(p => p.inv === f.inv || p.owner === f.inv);
  }
  // Enrollment period
  if (f.period !== 'all') {
    const daysLimit = parseInt(f.period, 10);
    const now = new Date();
    list = list.filter(p => {
      if (!p.consent) return false;
      const d = day(p.consent);
      return (now - d) / DAY <= daysLimit;
    });
  }
  // HF Etiology
  if (f.etio !== 'all') {
    list = list.filter(p => p.etio === f.etio);
  }
  // GDMT 4/4 or sub-optimal
  if (f.gdmt === '4') {
    list = list.filter(p => {
      const last = ['m6','m3','b'].find(k => p.v?.[k]?.done);
      return last && act(p.v[last]) === 4;
    });
  } else if (f.gdmt === 'suboptimal') {
    list = list.filter(p => {
      const last = ['m6','m3','b'].find(k => p.v?.[k]?.done);
      return last && act(p.v[last]) < 4;
    });
  }
  // Specific medication pillar
  if (f.pillar !== 'all') {
    list = list.filter(p => {
      const last = ['m6','m3','b'].find(k => p.v?.[k]?.done);
      if (!last || !p.v[last].g) return false;
      const st = p.v[last].g[f.pillar]?.status;
      return st === 'Active';
    });
  }
  // Visit status
  if (f.vstat !== 'all') {
    list = list.filter(p => {
      if (f.vstat === 'completed') {
        return f.visits.some(k => p.v?.[k]?.done);
      }
      if (f.vstat === 'in_progress') {
        return f.visits.some(k => vstat(p, k) === 'In Progress');
      }
      if (f.vstat === 'overdue') {
        return f.visits.some(k => ['Overdue', 'Missed'].includes(vstat(p, k)));
      }
      return true;
    });
  }

  return list;
}

function maskPatientName(name, id) {
  if (!name) return `Patient ${id}`;
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0][0] + '***';
  return parts[0][0] + '*** ' + parts[parts.length - 1][0] + '***';
}

function maskContact(contact) {
  if (!contact) return '';
  const str = String(contact).replace(/\D/g, '');
  if (str.length <= 4) return '****';
  return str.slice(0, 4) + ' **** ' + str.slice(-2);
}

function triggerBlobDownload(blob, filename, recordCount, targetDescription, formatName){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  logCentralAction(`Export ${formatName}`, `${recordCount} items (${targetDescription})`, targetDescription);
  toast(`Export complete: ${recordCount} records downloaded as ${formatName} & logged.`);
}

function downloadCsv(rows, filenamePrefix, targetDescription){
  const csvContent = rows.map(r => r.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8' });
  triggerBlobDownload(blob, `${filenamePrefix}-${new Date().toISOString().slice(0, 10)}.csv`, rows.length - 1, targetDescription, 'CSV');
}

function downloadTsv(rows, filenamePrefix, targetDescription){
  const tsvContent = rows.map(r => r.map(cell => String(cell ?? '').replace(/[\t\r\n]/g, ' ')).join('\t')).join('\r\n');
  const blob = new Blob(['\ufeff' + tsvContent], { type: 'text/tab-separated-values;charset=utf-8' });
  triggerBlobDownload(blob, `${filenamePrefix}-${new Date().toISOString().slice(0, 10)}.tsv`, rows.length - 1, targetDescription, 'TSV');
}

function downloadJson(dataObj, filenamePrefix, targetDescription, recordCount){
  const jsonContent = JSON.stringify(dataObj, null, 2);
  const blob = new Blob([jsonContent], { type: 'application/json;charset=utf-8' });
  triggerBlobDownload(blob, `${filenamePrefix}-${new Date().toISOString().slice(0, 10)}.json`, recordCount, targetDescription, 'JSON');
}

// Backward compatibility handler
function generateAndDownloadExport(scope, visits, only4Pillars, format){
  if (typeof can === 'function' && !can('export_data')) { toast('Permission denied: you do not have data export permissions.'); return; }
  const allPts = loadData();
  let targetPts = allPts.slice();
  let targetDesc = 'All Registry Patients';
  if (scope === 'filtered') {
    if (filterZone !== 'all') targetPts = targetPts.filter(p => getSiteZone(p.site) === filterZone);
    if (filterSite !== 'all') targetPts = targetPts.filter(p => p.site === filterSite);
    if (filterInv !== 'all') targetPts = targetPts.filter(p => p.inv === filterInv);
    targetDesc = `Zone:${filterZone}, Site:${filterSite}, Inv:${filterInv}`;
  }
  if (only4Pillars) {
    targetPts = targetPts.filter(p => {
      const last = ['m6','m3','b'].find(k => p.v?.[k]?.done);
      return last && act(p.v[last]) === 4;
    });
    targetDesc += ' (4/4 GDMT Only)';
  }
  if (format === 'summary') {
    downloadPresetLeague(targetPts);
    return;
  }
  downloadPresetEcrf(targetPts, visits);
}

function downloadPresetEcrf(cohort, overrideVisits){
  const visits = overrideVisits || exportFilterState.visits;
  if (!visits.length) {
    toast('Please select at least one visit stage (Baseline, 3M, or 6M).');
    return;
  }
  const deid = exportFilterState.deidentify;
  const header = [
    'Study_ID','Site_Code','Site_Zone','Investigator_Name','Patient_Name','Contact_Number','Consent_Date','Age','Sex','HF_Etiology',
    'Visit_Stage','Visit_Status','Visit_Date','Weight_kg','Heart_Rate_bpm','Systolic_BP_mmHg','Diastolic_BP_mmHg',
    'NYHA_Class','1MSTS_Reps_60s','LVEF_Percent','Echo_Date','Active_GDMT_Pillars_Count',
    'ARNI_Drug','ARNI_Dose','ARNI_Status',
    'BetaBlocker_Drug','BetaBlocker_Dose','BetaBlocker_Status',
    'MRA_Drug','MRA_Dose','MRA_Status',
    'SGLT2i_Drug','SGLT2i_Dose','SGLT2i_Status',
    'HF_Hospitalization','Other_Hospitalization','Death','Major_Intervention_Notes'
  ];
  const rows = [header];
  const visitLabels = { b: 'Baseline', m3: 'Month 3', m6: 'Month 6' };

  cohort.forEach(p => {
    visits.forEach(k => {
      const v = p.v?.[k] || {};
      const g = q => (v.g && v.g[q]) || {};
      const ev = v.ev || {};
      const activeCount = act(v);
      const pName = deid ? maskPatientName(p.name, p.id) : (p.name || '');
      const pPhone = deid ? maskContact(p.contact) : (p.contact || '');

      rows.push([
        p.id, p.site, getSiteZone(p.site), p.inv || '', pName, pPhone, p.consent || '', p.age || '', p.sex || '', p.etio || '',
        visitLabels[k], vstat(p, k), v.date || '', v.wt || '', v.hr || '', v.sbp || '', v.dbp || '',
        v.nyha || '', v.msts != null ? v.msts : '', v.lvef != null ? v.lvef : '', v.echoDate || '', activeCount,
        g('arni').drug || '', g('arni').dose || '', g('arni').status || '',
        g('bb').drug || '', g('bb').dose || '', g('bb').status || '',
        g('mra').drug || '', g('mra').dose || '', g('mra').status || '',
        g('sg').drug || '', g('sg').dose || '', g('sg').status || '',
        ev.hf ? 1 : 0, ev.all ? 1 : 0, ev.death ? 1 : 0, ev.notes || ''
      ]);
    });
  });

  if (exportFilterState.format === 'tsv') {
    downloadTsv(rows, 'stand-hf-longitudinal-ecrf', `Longitudinal eCRF Dataset (${cohort.length} Patients)`);
  } else {
    downloadCsv(rows, 'stand-hf-longitudinal-ecrf', `Longitudinal eCRF Dataset (${cohort.length} Patients)`);
  }
}

// Preset 3: Multi-Site League Table Summary
function downloadPresetLeague(cohort){
  const s = accessStore();
  const rows = [
    ['Site_Code','Site_Name','Zone','Enrolled_Patients','Baseline_Completed','3M_Completed','6M_Completed','All_Visits_Completed','OnTime_Adherence_Pct','Overdue_Followups_Count','GDMT_4_of_4_Rate_Pct']
  ];
  const sitesToInclude = exportFilterState.site !== 'all' ? s.sites.filter(x => x.code === exportFilterState.site) : (exportFilterState.zone !== 'all' ? s.sites.filter(x => x.zone === exportFilterState.zone) : s.sites);

  sitesToInclude.forEach(st => {
    const ps = cohort.filter(p => p.site === st.code);
    const n = ps.length;
    const b = ps.filter(p => p.v?.b?.done).length;
    const m3 = ps.filter(p => p.v?.m3?.done).length;
    const m6 = ps.filter(p => p.v?.m6?.done).length;
    const allDone = ps.filter(p => p.v?.b?.done && p.v?.m3?.done && p.v?.m6?.done).length;
    const fu = ps.flatMap(p => ['m3','m6'].map(k => onTime(p, k))).filter(x => x !== null);
    const ontime = fu.length ? Math.round(100 * fu.filter(Boolean).length / fu.length) : '';
    const overdue = ps.reduce((c, p) => c + ['m3','m6'].filter(k => ['Overdue','Missed'].includes(vstat(p, k))).length, 0);
    const gdmt4 = ps.filter(p => {
      const last = ['m6','m3','b'].find(k => p.v?.[k]?.done);
      return last && act(p.v[last]) === 4;
    }).length;
    const gdmtPct = n ? Math.round(100 * gdmt4 / n) : '';
    rows.push([st.code, st.name, st.zone || '', n, b, m3, m6, allDone, ontime, overdue, gdmtPct]);
  });

  downloadCsv(rows, 'stand-hf-site-league-summary', 'Multi-Site League Table Summary');
}

// --- Custom Combobox Component (Matches STAND-HF .cb Design System) ---
function renderFilterCombobox({ id, label, value, options, disabled }) {
  const curOpt = options.find(o => String(o.val) === String(value)) || options[0] || { val: '', label: '' };
  return `
    <div class="export-filter-row">
      <label>${label}</label>
      <div class="cb custom-cb" data-cb-id="${id}" ${disabled ? 'data-disabled="true"' : ''}>
        <input type="text" id="${id}_display" class="cb-input" readonly
          value="${esc(curOpt.label)}" data-cb-input role="combobox" aria-expanded="false" ${disabled ? 'disabled' : ''}>
        <span class="ms cb-ico">expand_more</span>
        <input type="hidden" id="${id}" value="${esc(curOpt.val)}">
        <ul class="cb-list" role="listbox" hidden>
          ${options.map(o => `
            <li role="option" data-val="${esc(o.val)}" class="${String(o.val) === String(curOpt.val) ? 'act' : ''}">
              <span>${esc(o.label)}</span>
            </li>
          `).join('')}
        </ul>
      </div>
    </div>
  `;
}

function updateComboboxOptions(id, options, defaultVal = 'all') {
  const wrap = document.querySelector(`.custom-cb[data-cb-id="${id}"]`);
  if (!wrap) return;
  const hidden = wrap.querySelector('input[type="hidden"]');
  const display = wrap.querySelector('[data-cb-input]');
  const ul = wrap.querySelector('.cb-list');
  const curOpt = options.find(o => String(o.val) === String(defaultVal)) || options[0] || { val: '', label: '' };
  
  if (hidden) hidden.value = curOpt.val;
  if (display) display.value = curOpt.label;
  if (ul) {
    ul.innerHTML = options.map(o => `
      <li role="option" data-val="${esc(o.val)}" class="${String(o.val) === String(curOpt.val) ? 'act' : ''}">
        <span>${esc(o.label)}</span>
      </li>
    `).join('');
  }
}

function initCustomComboboxes(container = document) {
  container.querySelectorAll('.custom-cb').forEach(cb => {
    if (cb._cbInited) return;
    cb._cbInited = true;
    const inp = cb.querySelector('[data-cb-input]');
    const ul = cb.querySelector('.cb-list');
    const hidden = cb.querySelector('input[type="hidden"]');
    if (!inp || !ul || !hidden) return;

    cb.onclick = (e) => {
      if (inp.disabled || cb.dataset.disabled === 'true') return;
      const li = e.target.closest('li[data-val]');
      if (li) {
        const newVal = li.dataset.val;
        const newText = li.querySelector('span')?.textContent || li.textContent.trim();
        hidden.value = newVal;
        inp.value = newText;
        ul.querySelectorAll('li').forEach(l => l.classList.toggle('act', l === li));
        ul.hidden = true;
        cb.classList.remove('is-open');
        inp.setAttribute('aria-expanded', 'false');
        if (typeof hidden.onchange === 'function') hidden.onchange();
        hidden.dispatchEvent(new Event('change', { bubbles: true }));
        return;
      }

      const isOpen = !ul.hidden;
      document.querySelectorAll('.custom-cb.is-open').forEach(other => {
        if (other !== cb) {
          other.classList.remove('is-open');
          const oUl = other.querySelector('.cb-list');
          if (oUl) oUl.hidden = true;
          const oInp = other.querySelector('[data-cb-input]');
          if (oInp) oInp.setAttribute('aria-expanded', 'false');
        }
      });

      ul.hidden = isOpen;
      cb.classList.toggle('is-open', !isOpen);
      inp.setAttribute('aria-expanded', String(!isOpen));
    };
  });
}

if (!window._cbGlobalClickBound) {
  window._cbGlobalClickBound = true;
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.custom-cb')) {
      document.querySelectorAll('.custom-cb.is-open').forEach(cb => {
        cb.classList.remove('is-open');
        const ul = cb.querySelector('.cb-list');
        if (ul) ul.hidden = true;
        const inp = cb.querySelector('[data-cb-input]');
        if (inp) inp.setAttribute('aria-expanded', 'false');
      });
    }
  });
  window.addEventListener('scroll', () => {
    document.querySelectorAll('.custom-cb.is-open').forEach(cb => {
      cb.classList.remove('is-open');
      const ul = cb.querySelector('.cb-list');
      if (ul) ul.hidden = true;
      const inp = cb.querySelector('[data-cb-input]');
      if (inp) inp.setAttribute('aria-expanded', 'false');
    });
  }, { passive: true });
}

/* Sidebar item that matches each tab, per role (tabs with no sidebar item fall back to Dashboard) */
const NAV_KEY_BY_TAB = {
  investigator: { all: 'dashboard', upcoming: 'dashboard', clinical: 'performance', sites: 'sites', export: 'export' },
  central:      { all: 'dashboard', teams: 'dashboard', queue: 'dashboard', analytics: 'performance', league: 'sites', export: 'export' },
  superadmin:   { all: 'dashboard', teams: 'dashboard', queue: 'dashboard', analytics: 'performance', league: 'sites', export: 'export' }
};

/* Keeps the sidebar highlight and the URL hash on the open tab */
function syncNavToTab(){
  const tab = ROLE === 'investigator' ? currentInvTab : currentSuperTab;
  const key = (NAV_KEY_BY_TAB[ROLE] || {})[tab] || 'dashboard';
  window.standhfDashNavKey = key;
  const want = location.pathname + location.search + (key === 'dashboard' ? '' : '#' + key);
  if (location.pathname + location.search + location.hash !== want) history.replaceState(null, '', want);
  if (typeof window.standhfUpdateNav === 'function') window.standhfUpdateNav();
}

function renderDashboard(){
  const allPts = loadData();
  const root = $('dashRoot');
  if (!root) return;

  if (ROLE === 'investigator') {
    root.innerHTML = renderInvestigatorView(allPts);
  } else {
    // Both Super Admin and Central Directorate share the exact same Executive Dashboard
    root.innerHTML = renderSuperAdminView(allPts);
  }

  attachEvents();
  syncNavToTab();
}

// Initial Render with Hash Routing
applyHash();

// Auto-seed from verified dataset if local storage is fresh/empty, then draw once with the data
// (drawing before the seed finished showed empty stats first)
(async function ensurePreloadedData(){
  if (!localStorage.getItem(KEY)) {
    try {
      await apiWait(900);
      const res = await fetch('../data/dummy_data.json');
      if (res.ok) {
        const d = await res.json();
        if (Array.isArray(d?.pts) && d.pts.length) {
          localStorage.setItem(KEY, JSON.stringify(d));
        }
      }
    } catch(e){}
  }
  renderDashboard();
})();

// Listen to hash changes (from sidebar or links anywhere)
window.addEventListener('hashchange', () => {
  applyHash();
  renderDashboard();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

window.addEventListener('standhf_threshold_changed', () => {
  renderDashboard();
});
window.addEventListener('storage', e => {
  if (e.key === 'standhf_followup_threshold_days' || e.key === 'standhf_access_v1') {
    renderDashboard();
  }
});

})();
