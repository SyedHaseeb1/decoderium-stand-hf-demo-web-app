<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>STAND-HF Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
  <link rel="stylesheet" href="../assets/base.css">
</head>
<body class="auth-page">
<main class="auth-wrap">
  <div class="brand-center">
    <div class="logo"><span class="ms">monitor_heart</span></div>
    <h1>STAND-HF Registry</h1>
    <p>E-CRF Prototype</p>
  </div>

  <form class="auth" id="form" novalidate>
    <h2>Sign in</h2>
    <p>Select your role, then enter your username and password.</p>

    <div class="error" id="err" role="alert">
      <span class="ms">error</span>
      <span id="errMsg"></span>
    </div>

    <label class="field">
      <span>Role</span>
      <select id="role" name="role">
        <option value="superadmin">Super Admin</option>
        <option value="investigator" selected>Site Investigator</option>
        <option value="central">Central</option>
      </select>
    </label>

    <label class="field">
      <span>Username</span>
      <input id="user" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false">
    </label>

    <label class="field">
      <span>Password</span>
      <div class="input-wrap">
        <input id="pass" name="password" type="password" autocomplete="current-password" class="has-toggle">
        <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password" title="Show password">
          <span class="ms">visibility</span>
        </button>
      </div>
      <small class="hint">Prototype: any non-empty password is accepted.</small>
    </label>

    <button class="btn primary" id="signin" type="submit">
      <span class="ms">login</span>
      <span id="btnText">Sign in</span>
    </button>
  </form>

  <p class="footer">Authorised study staff only. Activity is recorded in the audit trail.</p>
</main>

<script src="../assets/access.js"></script>
<script>
const APP='../records/', DASH='../dashboard/', ADMIN='../admin/', AUTH_KEY='standhf_auth', USER_KEY='standhf_user', ROLE_KEY='standhf_role';
const ACCOUNTS=accessStore().users.filter(u=>u.active).map(u=>({user:u.username,name:u.name,role:u.role}));

const $=id=>document.getElementById(id);

function fail(msg,focusId){
  $('errMsg').textContent=msg;
  $('err').classList.add('show');
  $(focusId).focus();
}

function accountFor(role){return ACCOUNTS.find(a=>a.role===role)}

$('role').onchange=()=>{
  $('user').value=accountFor($('role').value).user;
  $('pass').value='';
  $('err').classList.remove('show');
  $('pass').focus();
};
$('user').value=accountFor($('role').value).user;

$('togglePw').onclick=()=>{
  const show=$('pass').type==='password';
  $('pass').type=show?'text':'password';
  $('togglePw').setAttribute('aria-label',show?'Hide password':'Show password');
  $('togglePw').title=show?'Hide password':'Show password';
  $('togglePw').firstElementChild.textContent=show?'visibility_off':'visibility';
};

$('form').addEventListener('submit',e=>{
  e.preventDefault();
  const u=$('user').value.trim().toLowerCase(),p=$('pass').value,role=$('role').value;
  if(!u)return fail('Enter your username.','user');
  if(!p)return fail('Enter your password.','pass');
  const acc=ACCOUNTS.find(a=>a.user===u);
  if(!acc)return fail('Unknown username.','user');
  if(acc.role!==role)return fail('This username does not belong to the selected role.','role');
  try{sessionStorage.setItem(AUTH_KEY,'1');sessionStorage.setItem(USER_KEY,acc.name);sessionStorage.setItem(ROLE_KEY,acc.role);sessionStorage.setItem('standhf_username',acc.user)}
  catch(err){return fail('Browser storage is blocked, so sign-in cannot be kept. Allow site data and try again.','signin')}
  location.replace(acc.role==='investigator'?DASH:acc.role==='superadmin'?ADMIN:APP);
});
</script>
</body>
</html>
