<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>STAND-HF Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
  <style>
    /* Material 3 (light) - sign-in screen */

    :root {
      --surface: #ffffff;
      --surface-low: #f5f7fb;
      --surface-high: #e9edf4;
      --outline: #747a86;
      --outline-variant: #dde1ea;
      --on-surface: #1b1d22;
      --on-surface-variant: #5b616d;
      --primary: #1a5fb4;
      --on-primary: #ffffff;
      --primary-container: #d8e5fb;
      --error: #b3261e;
      --error-container: #f9dedc;
      --on-error-container: #740f0b;
      --shadow-1: 0 1px 2px rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
      --shadow-2: 0 1px 2px rgba(60, 64, 67, 0.3), 0 2px 6px 2px rgba(60, 64, 67, 0.15);

      font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--surface-low);
      color: var(--on-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    main {
      width: 100%;
      max-width: 420px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--primary-container);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 500;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--on-surface-variant);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 28px;
      box-shadow: var(--shadow-1);
      padding: 32px 28px 28px;
    }

    .card h2 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 500;
    }

    .card > p {
      margin: 0 0 24px;
      font-size: 14px;
      color: var(--on-surface-variant);
    }

    /* Outlined text fields */
    .field {
      display: block;
      margin-bottom: 16px;
    }

    .field > span {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--on-surface-variant);
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .field input {
      display: block;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--outline);
      border-radius: 8px;
      background: var(--surface);
      color: var(--on-surface);
      font: inherit;
      font-size: 15px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field input.has-toggle {
      padding-right: 48px;
    }

    .field input:hover {
      border-color: var(--on-surface);
    }

    .field input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: inset 0 0 0 1px var(--primary);
    }

    .field input[aria-invalid="true"] {
      border-color: var(--error);
      box-shadow: inset 0 0 0 1px var(--error);
    }

    .toggle-pw {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--on-surface-variant);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .toggle-pw:hover {
      background: var(--surface-high);
    }

    .toggle-pw:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .ms {
      font-family: 'Material Symbols Rounded';
      font-weight: normal;
      font-style: normal;
      font-size: 22px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }

    .error {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--error-container);
      color: var(--on-error-container);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .error.show {
      display: flex;
    }

    /* Filled button */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 20px;
      background: var(--primary);
      color: var(--on-primary);
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.1px;
      cursor: pointer;
      box-shadow: var(--shadow-1);
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      background: #17539f;
      box-shadow: var(--shadow-2);
    }

    .btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--on-surface-variant);
    }

    /* Role select and prototype hint */
    .field select {
      display: block;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--outline);
      border-radius: 8px;
      background: var(--surface);
      color: var(--on-surface);
      font: inherit;
      font-size: 15px;
    }

    .field select:hover {
      border-color: var(--on-surface);
    }

    .field select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: inset 0 0 0 1px var(--primary);
    }

    .hint {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      color: var(--on-surface-variant);
    }

    @media (max-width: 480px) {
      .card {
        padding: 24px 20px 20px;
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
<main>
  <div class="brand">
    <div class="logo"><span class="ms" style="font-size:30px">monitor_heart</span></div>
    <h1>STAND-HF Registry</h1>
    <p>E-CRF Prototype</p>
  </div>

  <form class="card" id="form" novalidate>
    <h2>Sign in</h2>
    <p>Select your role, then enter your username and password.</p>

    <div class="error" id="err" role="alert">
      <span class="ms">error</span>
      <span id="errMsg"></span>
    </div>

    <label class="field">
      <span>Role</span>
      <select id="role" name="role">
        <option value="superadmin">Super Admin</option>
        <option value="investigator" selected>Site Investigator</option>
        <option value="central">Central</option>
      </select>
    </label>

    <label class="field">
      <span>Username</span>
      <input id="user" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false">
    </label>

    <label class="field">
      <span>Password</span>
      <div class="input-wrap">
        <input id="pass" name="password" type="password" autocomplete="current-password" class="has-toggle">
        <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password" title="Show password">
          <span class="ms">visibility</span>
        </button>
      </div>
      <small class="hint">Prototype: any non-empty password is accepted.</small>
    </label>

    <button class="btn" id="signin" type="submit">
      <span class="ms">login</span>
      <span id="btnText">Sign in</span>
    </button>
  </form>

  <p class="footer">Authorised study staff only. Activity is recorded in the audit trail.</p>
</main>

<script>
const APP='STAND-HF E-CRF prototype ENHANCED.html', DASH='STAND-HF Investigator Dashboard.html', AUTH_KEY='standhf_auth', USER_KEY='standhf_user', ROLE_KEY='standhf_role';
const ACCOUNTS=[
  {user:'michael.johnson',name:'Michael Johnson',role:'superadmin'},
  {user:'emily.carter',name:'Emily Carter',role:'investigator'},
  {user:'robert.wilson',name:'Robert Wilson',role:'central'}
];

const $=id=>document.getElementById(id);

function fail(msg,focusId){
  $('errMsg').textContent=msg;
  $('err').classList.add('show');
  $(focusId).focus();
}

function accountFor(role){return ACCOUNTS.find(a=>a.role===role)}

$('role').onchange=()=>{
  $('user').value=accountFor($('role').value).user;
  $('pass').value='';
  $('err').classList.remove('show');
  $('pass').focus();
};
$('user').value=accountFor($('role').value).user;

$('togglePw').onclick=()=>{
  const show=$('pass').type==='password';
  $('pass').type=show?'text':'password';
  $('togglePw').setAttribute('aria-label',show?'Hide password':'Show password');
  $('togglePw').title=show?'Hide password':'Show password';
  $('togglePw').firstElementChild.textContent=show?'visibility_off':'visibility';
};

$('form').addEventListener('submit',e=>{
  e.preventDefault();
  const u=$('user').value.trim().toLowerCase(),p=$('pass').value,role=$('role').value;
  if(!u)return fail('Enter your username.','user');
  if(!p)return fail('Enter your password.','pass');
  const acc=ACCOUNTS.find(a=>a.user===u);
  if(!acc)return fail('Unknown username.','user');
  if(acc.role!==role)return fail('This username does not belong to the selected role.','role');
  try{sessionStorage.setItem(AUTH_KEY,'1');sessionStorage.setItem(USER_KEY,acc.name);sessionStorage.setItem(ROLE_KEY,acc.role)}
  catch(err){return fail('Browser storage is blocked, so sign-in cannot be kept. Allow site data and try again.','signin')}
  location.replace(acc.role==='investigator'?DASH:APP);
});
</script>
</body>
</html>
