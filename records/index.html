<script type="text/plain">

let DB={pts:[],off:false},sel=null,tab='info',newMode=false,listOpen=getInitialListOpen(),ptSearchQuery='';

    listEl.classList.toggle('collapsed', !listOpen);

    try{localStorage.setItem(LIST_COLLAPSED_KEY, listOpen ? '0' : '1')}catch(e){}
  }

/* Phones open only the first section by default; tablets and desktops keep everything open.
   A section the user opened or closed keeps that choice. */
const FIRST_SECS=['info-pt','rx'];
const phoneQuery=window.matchMedia('(max-width: 640px)');
const secCollapsed=secId=>collapsedSecs[secId]!==undefined?!!collapsedSecs[secId]:(phoneQuery.matches&&!FIRST_SECS.includes(secId));

function secHeader(secId, titleHtml, rightHtml='', extraClass=''){
  const isCol = secCollapsed(secId);
  return `<div class="sec sec-collapsible${isCol?' collapsed':''}${extraClass?' '+extraClass:''}" data-sec="${secId}" role="button" tabindex="0" aria-expanded="${!isCol}"><span>${titleHtml}</span><div style="display:inline-flex;align-items:center;gap:8px">${rightHtml}<i class="ms sec-chev">${isCol?'expand_more':'expand_less'}</i></div></div>`;
}

function secBodyAttrs(secId, extraStyle=''){
  const isCol = secCollapsed(secId);
  return `data-sec-body="${secId}"${isCol?' hidden':''}${extraStyle?` style="${extraStyle}"`:''}`;
}

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const G=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o),S=(o,p,v)=>{const k=p.split('.');let a=o;k.slice(0,-1).forEach(x=>a=a[x]=a[x]||{});a[k.pop()]=v};
const VK=[['b','Baseline'],['m3','3 Months'],['m6','6 Months']],PL=STANDHF_DATA.gdmt.pillars.map(p=>[p.key,p.formLabel]);
const RS=Object.entries(STANDHF_DATA.gdmt.notUsedReasons);
const STOP=['',...STANDHF_DATA.clinicalOptions.stopReasons];

const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
const cur=()=>DB.pts.find(p=>p.id===sel&&inScope(p));
// Canonical contactOk and contactClean are provided by access.js; provide fallback if access.js is absent
if(typeof window.contactOk !== 'function'){
  window.contactOk = s => { const d=String(s||'').replace(/\D/g,''); return d.length>=10&&d.length<=11; };
}
if(typeof window.contactClean !== 'function'){
  window.contactClean = s => String(s||'').replace(/\D/g,'').slice(0,11);
}
/* Typing filters: characters that are never valid for a field are dropped as they are typed */
const FILTER={contact:[/\D/g,v=>v.slice(0,11)],person:[/[^\p{L}\s.'-]/gu,v=>v],ini:[/[^A-Za-z]/g,v=>v.toUpperCase()],drug:[/[^\p{L}\d\s()\/.,+-]/gu,v=>v],site:[/[^A-Za-z]/g,v=>v.toUpperCase()]};
function filterKey(el){const d=el.dataset.p||'';
  if(el.id==='nContact'||d==='contact')return'contact';
  if(el.id==='nName'||d==='name'||d==='etioO')return'person';
  if(el.closest&&el.closest('[data-cb="inv"]'))return'person';
  if(el.closest&&el.closest('[data-cb="site"]'))return'site';
  if(/\.ini$/.test(d))return'ini';
  if(/\.drug$/.test(d))return'drug';
  return null}
document.addEventListener('input',e=>{const el=e.target;if(el.closest&&el.closest('#fNew')){const lb=el.closest('label');if(lb){lb.querySelectorAll('.np-msg').forEach(x=>x.remove());lb.querySelectorAll('.fld-e').forEach(x=>{x.classList.remove('fld-e');x.removeAttribute('aria-invalid')})}}
if(!el.matches||!el.matches('input'))return;const key=filterKey(el);if(!key)return;
  const [re,fn]=FILTER[key],c=fn(el.value.replace(re,''));if(c!==el.value)el.value=c});
document.addEventListener('keydown',e=>{const el=e.target;if(!el.matches||!el.matches('input'))return;
  const key=filterKey(el);
  if(key==='contact'){
    if(['Backspace','Delete','Tab','Enter','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','Escape'].includes(e.key))return;
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(!/^\d$/.test(e.key)){e.preventDefault();return;}
    const selLen=(el.selectionEnd??0)-(el.selectionStart??0);
    const digits=el.value.replace(/\D/g,'');
    if(digits.length>=11&&selLen===0){e.preventDefault();}
  }});
document.addEventListener('paste',e=>{const el=e.target;if(!el.matches||!el.matches('input'))return;
  const key=filterKey(el);
  if(key==='contact'){
    e.preventDefault();
    const txt=(e.clipboardData||window.clipboardData)?.getData('text')||'';
    const clean=txt.replace(/\D/g,'');
    const start=el.selectionStart??el.value.length,end=el.selectionEnd??el.value.length;
    const curVal=el.value;
    const combined=(curVal.slice(0,start)+clean+curVal.slice(end)).replace(/\D/g,'').slice(0,11);

    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.dispatchEvent(new Event('change',{bubbles:true}));
  }});
const num=x=>x===''||x==null?NaN:+x,day=s=>s?new Date(s+'T00:00:00'):null,addD=(s,n)=>{const d=day(s);d.setDate(d.getDate()+n);return d},fmt=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

function mk(site,inv,consent,age,sex,etio){const n=DB.pts.filter(p=>p.site===site).length+1;return{created:Date.now(),updated:Date.now(),owner:session().username,id:site+'-'+String(n).padStart(3,'0'),site,inv,consent,age,sex,etio,etioO:'',uid:Date.now().toString(36)+Math.random().toString(36).slice(2,8),name:'',contact:'',sync:'Pending',audit:[],files:{b:[],m3:[],m6:[]},v:{b:{date:consent},m3:{},m6:{}}}}
function has(v){return Object.keys(v).some(k=>k!=='done'&&v[k]!==''&&v[k]!=null&&typeof v[k]!=='object')||(v.g&&Object.values(v.g).some(x=>x.status))}
function vstat(p,k){const v=p.v[k];if(v.done)return'Completed';const b=p.v.b.done?(p.v.b.date||p.consent):null;let late=false,due=false,missed=false;
 if(k!=='b'&&b){const t=k==='m3'?90:180,w=k==='m3'?14:21,T=new Date(),tg=addD(b,t);late=T>addD(b,t+w);due=T>=addD(b,t-w);missed=T>addD(b,t+w+30)&&!has(v)}
 return missed?'Missed':late?'Overdue':has(v)?'In Progress':due?'Due':'Not Started'}
function act(v){return PL.filter(([k])=>G(v,'g.'+k+'.status')==='Active').length}
function warns(p,k){const v=p.v[k],b=p.v.b,w=[],x=n=>num(v[n]);
 if(v['hr']!==''&&v.hr!=null&&(x('hr')<30||x('hr')>220))w.push(['w','Heart rate outside 30 to 220 bpm: please check']);
 if(v.sbp&&v.dbp&&(+v.sbp<=+v.dbp))w.push(['e','Systolic BP must be higher than diastolic']);
 if(v.sbp&&(+v.sbp<50||+v.sbp>260))w.push(['w','Systolic BP looks unusual']);
 if(v.msts!==''&&v.msts!=null&&(x('msts')<0||x('msts')>60))w.push(['w','1MSTS repetitions outside 0 to 60: please check']);
 if(v.nyha==='IV')w.push(['w','NYHA IV: check exclusion criteria (IV at rest)']);
 if(k==='b'&&p.age&&+p.age<18)w.push(['e','Age must be 18 or more']);
 if(v.lvef&&(+v.lvef<5||+v.lvef>80))w.push(['w','LVEF outside 5 to 80%']);
 if(k==='b'&&v.lvef&&+v.lvef>40)w.push(['w','LVEF above 40%: outside registry inclusion (LVEF 40% or less)']);
 if(k!=='b'&&v.date&&b.date&&day(v.date)<day(b.date))w.push(['e','Visit date cannot be before the baseline date']);
 if(k!=='b'&&v.date&&b.date&&day(v.date).getTime()===day(b.date).getTime())w.push(['w','Visit date is on the same day as baseline (early submission)']);
 if(k!=='b'&&v.date&&b.date){const t=k==='m3'?90:180,wd=k==='m3'?14:21,d=(day(v.date)-day(b.date))/864e5;if(Math.abs(d-t)>wd)w.push(['w','Outside window (day '+t+' ±'+wd+'): this visit is on day '+Math.round(d)])}
 PL.forEach(([q,n])=>{const g=G(v,'g.'+q)||{};
   if(g.status==='Active'&&!g.strength&&!g.dose)w.push(['w',n+': strength missing']);
   if(g.status==='Active'&&!g.freq)w.push(['w',n+': frequency missing']);

    else if(!canAddPatient(site)) out.push({f:'site',msg:'You are not authorized to enroll patients at site '+site+'.'});
  }

  const nChk = window.STANDHF_VALIDATOR ? window.STANDHF_VALIDATOR.validate('name', nm, true) : null;
  if(nChk && !nChk.ok) out.push({f:'name',msg:nChk.msg});
  else if(!nm) out.push({f:'name',msg:'Enter the patient name.'});
  else if(nm.length<2) out.push({f:'name',msg:'Patient name: at least 2 characters.'});
  else if(!NAME_RE.test(nm)) out.push({f:'name',msg:"Patient name: letters, spaces, . ' - only."});

  const cChk = window.STANDHF_VALIDATOR ? window.STANDHF_VALIDATOR.validate('contact', ct, true) : null;
  if(cChk && !cChk.ok) out.push({f:'contact',msg:cChk.msg});
  else if(!ct) out.push({f:'contact',msg:'Enter the contact number.'});
  else if(!contactOk(ct)) out.push({f:'contact',msg:contactError(ct, true)});

  const iChk = window.STANDHF_VALIDATOR ? window.STANDHF_VALIDATOR.validate('inv', inv, true) : null;
  if(iChk && !iChk.ok) out.push({f:'inv',msg:iChk.msg});
  else if(!inv) out.push({f:'inv',msg:'Enter the investigator name.'});
  else if(inv.length<2) out.push({f:'inv',msg:'Investigator name: at least 2 characters.'});
  else if(!NAME_RE.test(inv)) out.push({f:'inv',msg:"Investigator name: letters, spaces, . ' - only."});

  return out;
}
const NEW_FIELD={site:'[data-cb="site"] input',name:'#nName',contact:'#nContact',inv:'[data-cb="inv"] input',consent:'#nConsent',age:'#nAge',sex:'#nSex',etio:'#nEtio',etioO:'#nEtioO'};
/* Personal information checks, run when the patient is created */
function personalErrors(v){
  const out=[],add=(f,msg)=>out.push({f,msg});
  if(window.STANDHF_VALIDATOR){
    const cChk = window.STANDHF_VALIDATOR.validate('consent', v.consent, true);
    if(!cChk.ok) add('consent', cChk.msg);
    const aChk = window.STANDHF_VALIDATOR.validate('age', v.age, true);
    if(!aChk.ok) add('age', aChk.msg);
  } else {
    if(!v.consent)add('consent','Enter the consent date.');
    else if(day(v.consent)>todayStart())add('consent','Consent date cannot be in the future.');
    if(!v.age)add('age','Enter the age.');
    else if(!Number.isInteger(+v.age)||+v.age<18||+v.age>150)add('age','Please check age');
  }
  if(!v.sex)add('sex','Select the sex.');
  if(!v.etio)add('etio','Select the HF etiology.');
  else if(v.etio==='Other'&&(!v.etioO||v.etioO.length<2))add('etioO','Enter the other etiology.');
  return out;
}
function clearNewErrors(){
  document.querySelectorAll('#fNew .fld-e').forEach(x=>{x.classList.remove('fld-e');x.removeAttribute('aria-invalid')});
  document.querySelectorAll('#fNew .np-msg').forEach(x=>x.remove());
}
function showNewErrors(errs){
  clearNewErrors();
  errs.forEach(e=>{const el=document.querySelector(NEW_FIELD[e.f]);if(!el)return;
    el.classList.add('fld-e');el.setAttribute('aria-invalid','true');
    el.closest('label').insertAdjacentHTML('beforeend',`<span class="${fmsgCls('e')} np-msg">${esc(e.msg)}</span>`)});
  const box=$('newErr');box.className='dlg-err';box.hidden=false;
  box.innerHTML=errorBox(`Fix ${errs.length} issue${errs.length>1?'s':''} before creating the participant`,errs.map(e=>({msg:e.msg,sel:NEW_FIELD[e.f]})));
  if(errs[0])document.querySelector(NEW_FIELD[errs[0].f])?.focus();
}

{

/* Connection comes from the shared header: it announces each change; saves stay Pending while offline */
function setConnection(on,quiet){
  const wasOff=!!DB.off;
  DB.off=!on;
  if(on){
    let n=0;DB.pts.forEach(q=>{if(q.sync==='Pending'){q.sync='Synced';n++}});persist();
    if(!quiet&&wasOff)toast(n?`Back online: ${n} record${n>1?'s':''} synced`:'Back online');
  } else {
    persist();
    if(!quiet&&!wasOff)toast('Offline: changes are saved on this device');
  }
  dash();
}
window.addEventListener('standhf:connection',e=>setConnection(e.detail.online,e.detail.quiet));
if(typeof window.isStandhfOnline==='function') DB.off=!window.isStandhfOnline();

{

/* Patient list: show or hide with localStorage persistence */

/* Collapsible form section headers: toggles .collapsed and persists to localStorage */
document.addEventListener('click', e => {
  const sec = e.target.closest && e.target.closest('.sec-collapsible');
  if(!sec) return;
  if(e.target.closest('button, input, select, a, label, [data-a]')) return;
  const secId = sec.dataset.sec;
  if(!secId) return;
  const isCol = !sec.classList.contains('collapsed');
  sec.classList.toggle('collapsed', isCol);
  sec.setAttribute('aria-expanded', String(!isCol));
  const chev = sec.querySelector('.sec-chev');
  if(chev) chev.textContent = isCol ? 'expand_more' : 'expand_less';
  document.querySelectorAll(`[data-sec-body="${secId}"]`).forEach(body => {
    body.hidden = isCol;
  });
  collapsedSecs[secId] = isCol;  // explicit choice, so the phone default does not override it
  try {
    localStorage.setItem(SEC_COLLAPSED_KEY, JSON.stringify(collapsedSecs));
  } catch(err){}
});

document.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('sec-collapsible')){
    e.preventDefault();
    e.target.click();
  }
});

/* Auto-collapse patient list in tablet/mobile mode when editing the form */
function autoCollapsePatientListOnEdit(e){
  if(!isTabletOrMobile() || !listOpen) return;
  const t = e.target;
  if(!t) return;
  if(t.closest('.tabs') || t.closest('.sec-collapsible') || t.closest('.pane-head-sticky') || t.closest('.np-header-bar') || t.closest('#list') || t.closest('#listToggle')) return;
  if(t.matches('input, select, textarea, [data-p], .cb, .check-row, .rx-drop, [contenteditable], [data-cb-input], [data-a="upload"], [data-a="remove"], [data-a="next"]') || t.closest('.g, .tint, .wrap, .addform, .rx-wrap, .reasons, .upl, .np, .form, .field, .fld, .step-nav')){
    setListOpen(false, false);
  }
}
document.addEventListener('focusin', e => {

});
document.addEventListener('input', e => {
  if(e.target && e.target.closest('#pane')) autoCollapsePatientListOnEdit(e);
});
document.addEventListener('change', e => {

});

});

/* Search filters the patient list: synchronized between in-section search and topbar search */
function filterPatientList(q){
  ptSearchQuery = q || '';
  const lo = ptSearchQuery.trim().toLowerCase();
  let visible = 0;
  const P = DB.pts.filter(inScope);
  document.querySelectorAll('#list .pt').forEach(el => {
    const hit = !lo || el.textContent.toLowerCase().includes(lo);
    el.hidden = !hit;
    if(hit) visible++;
  });
  const cnt = document.querySelector('#list .list-count');
  if(cnt) cnt.textContent = lo ? `${visible} / ${P.length}` : P.length;
  const noMatch = $('plNoMatch');
  if(noMatch) noMatch.hidden = (visible > 0 || !lo);
  const ptInp = $('ptSearchInput');
  if(ptInp && ptInp.value !== ptSearchQuery) ptInp.value = ptSearchQuery;
}

document.addEventListener('input', e => {
  if(e.target && e.target.id === 'ptSearchInput'){
    filterPatientList(e.target.value);
  } else if(e.target && e.target.id === 'auditSearchInput'){
    const q = e.target.value.toLowerCase().trim();
    document.querySelectorAll('#auditTable tbody tr.audit-row').forEach(tr => {
      tr.style.display = (!q || tr.textContent.toLowerCase().includes(q)) ? '' : 'none';
    });
  }
});
