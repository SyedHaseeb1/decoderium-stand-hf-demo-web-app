<html lang="en">
<head>
  <meta charset="utf-8">
  <title>STAND-HF E-CRF</title>
  <script>
    // Session gate: send anyone without a sign-in back to the login page.
    try{if(sessionStorage.getItem('standhf_auth')!=='1')location.replace('../login/')}catch(e){location.replace('../login/')}

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
  <link rel="stylesheet" href="../assets/base.css">

    .upl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0}

  </div>
</div>

<script>
const KEY='standhf_ecrf_v1';
let DB={pts:[],off:false},sel=null,tab='info',newMode=false,listOpen=!window.matchMedia('(max-width: 1000px)').matches;
try{const s=localStorage.getItem(KEY);if(s)DB=JSON.parse(s)}catch(e){}

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const G=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o),S=(o,p,v)=>{const k=p.split('.');let a=o;k.slice(0,-1).forEach(x=>a=a[x]=a[x]||{});a[k.pop()]=v};
const VK=[['b','Baseline'],['m3','3 Months'],['m6','6 Months']],PL=[['arni','ARNI (sacubitril/valsartan)'],['bb','Evidence-based beta-blocker'],['mra','MRA'],['sg','SGLT2 inhibitor']];
const RS=[['hypo','Hypotension'],['brady','Bradycardia'],['renal','Renal dysfunction'],['k','Hyperkalemia'],['intol','Intolerance'],['cost','Cost / access'],['pref','Patient preference'],['phys','Physician decision']];
const STOP=['','Chest pain','Presyncope / syncope','Intolerable dyspnea','Severe dizziness','Loss of balance','Marked pallor / diaphoresis','Participant request','Investigator safety concern'];

const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
const cur=()=>DB.pts.find(p=>p.id===sel);
const contactOk=s=>/^\+?\d{7,15}$/.test(String(s||'').replace(/[\s-]/g,''));
/* Contact number: digits, spaces, hyphens and a leading + only. Letters are dropped as they are typed */
const contactClean=s=>String(s||'').replace(/[^0-9+\s-]/g,'');
/* Typing filters: characters that are never valid for a field are dropped as they are typed */
const FILTER={contact:[/[^0-9+\s-]/g,v=>v],person:[/[^\p{L}\s.'-]/gu,v=>v],ini:[/[^A-Za-z]/g,v=>v.toUpperCase()],drug:[/[^\p{L}\d\s()\/.,+-]/gu,v=>v],site:[/[^A-Za-z]/g,v=>v.toUpperCase()]};
function filterKey(el){const d=el.dataset.p||'';
  if(el.id==='nContact'||d==='contact')return'contact';
  if(el.id==='nName'||d==='name'||d==='etioO')return'person';
  if(el.closest&&el.closest('[data-cb="inv"]'))return'person';
  if(el.closest&&el.closest('[data-cb="site"]'))return'site';
  if(/\.ini$/.test(d))return'ini';
  if(/\.drug$/.test(d))return'drug';
  return null}
document.addEventListener('input',e=>{const el=e.target;if(el.closest&&el.closest('#fNew')){const lb=el.closest('label');if(lb){lb.querySelectorAll('.np-msg').forEach(x=>x.remove());lb.querySelectorAll('.fld-e').forEach(x=>{x.classList.remove('fld-e');x.removeAttribute('aria-invalid')})}}
if(!el.matches||!el.matches('input'))return;const key=filterKey(el);if(!key)return;
  const [re,fn]=FILTER[key],c=fn(el.value.replace(re,''));if(c!==el.value)el.value=c});
const num=x=>x===''||x==null?NaN:+x,day=s=>s?new Date(s+'T00:00:00'):null,addD=(s,n)=>{const d=day(s);d.setDate(d.getDate()+n);return d},fmt=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

function mk(site,inv,consent,age,sex,etio){const n=DB.pts.filter(p=>p.site===site).length+1;return{id:site+'-'+String(n).padStart(3,'0'),site,inv,consent,age,sex,etio,etioO:'',uid:Date.now().toString(36)+Math.random().toString(36).slice(2,8),name:'',contact:'',sync:'Pending',audit:[],files:{b:[],m3:[],m6:[]},v:{b:{},m3:{},m6:{}}}}
function has(v){return Object.keys(v).some(k=>k!=='done'&&v[k]!==''&&v[k]!=null&&typeof v[k]!=='object')||(v.g&&Object.values(v.g).some(x=>x.status))}
function vstat(p,k){const v=p.v[k];if(v.done)return'Completed';const b=p.v.b.done?p.v.b.date:null;let late=false,due=false,missed=false;
 if(k!=='b'&&b){const t=k==='m3'?90:180,w=k==='m3'?14:21,T=new Date(),tg=addD(b,t);late=T>addD(b,t+w);due=T>=addD(b,t-w);missed=T>addD(b,t+w+30)&&!has(v)}
 return missed?'Missed':late?'Overdue':has(v)?'In Progress':due?'Due':'Not Started'}
function act(v){return PL.filter(([k])=>G(v,'g.'+k+'.status')==='Active').length}
function warns(p,k){const v=p.v[k],b=p.v.b,w=[],x=n=>num(v[n]);
 if(v['hr']!==''&&v.hr!=null&&(x('hr')<30||x('hr')>220))w.push(['w','Heart rate outside 30 to 220 bpm: please check']);
 if(v.sbp&&v.dbp&&(+v.sbp<=+v.dbp))w.push(['e','Systolic BP must be higher than diastolic']);
 if(v.sbp&&(+v.sbp<50||+v.sbp>260))w.push(['w','Systolic BP looks unusual']);
 if(v.msts!==''&&v.msts!=null&&(x('msts')<0||x('msts')>60))w.push(['w','1MSTS repetitions outside 0 to 60: please check']);
 if(v.nyha==='IV')w.push(['w','NYHA IV: check exclusion criteria (IV at rest)']);
 if(k==='b'&&p.age&&+p.age<18)w.push(['e','Age must be 18 or more']);
 if(v.lvef&&(+v.lvef<5||+v.lvef>80))w.push(['w','LVEF outside 5 to 80%']);
 if(k==='b'&&v.lvef&&+v.lvef>40)w.push(['w','LVEF above 40%: outside registry inclusion (LVEF 40% or less)']);
 if(k==='b'&&v.echoDate&&v.date&&(day(v.echoDate)>day(v.date)||(day(v.date)-day(v.echoDate))/864e5>30))w.push(['w','Baseline echo should be within 30 days before enrollment']);
 if(k==='b'&&p.consent&&v.date&&day(p.consent)>day(v.date))w.push(['e','Consent date is after the baseline visit date']);
 if(k!=='b'&&v.date&&b.date&&day(v.date)<=day(b.date))w.push(['e','Visit date must be after the baseline date']);
 if(k!=='b'&&v.date&&b.date){const t=k==='m3'?90:180,wd=k==='m3'?14:21,d=(day(v.date)-day(b.date))/864e5;if(Math.abs(d-t)>wd)w.push(['w','Outside window (day '+t+' ±'+wd+'): this visit is on day '+Math.round(d)])}
 PL.forEach(([q,n])=>{const g=G(v,'g.'+q)||{};if(g.status==='Active'&&!g.dose)w.push(['w',n+': daily dose missing']);if(g.status==='Active'&&!g.start)w.push(['w',n+': start date missing']);
  if(g.status&&g.status!=='Active'&&!Object.values(v.rs||{}).some(Boolean)&&!v.rsO)w.push(['w',n+' is '+g.status.toLowerCase()+': record a reason below'])});
 return w}
function missing(p,k){const v=p.v[k],m=[];['date','wt','hr','sbp','dbp','nyha','msts'].forEach(f=>{if(v[f]===''||v[f]==null)m.push(f)});
 if(k!=='m3'&&!v.lvef)m.push('lvef');PL.forEach(([q])=>{if(!G(v,'g.'+q+'.status'))m.push(q+' status')});
 if(k==='b'){if(!p.name)m.push('patient name');if(!p.contact)m.push('contact number');if(!p.consent)m.push('consent date');if(!p.age)m.push('age');if(!p.sex)m.push('sex');if(!p.etio)m.push('HF etiology')}return m}
function save(p){p.sync='Pending';persist();if(!DB.off)setTimeout(()=>{DB.pts.forEach(q=>{if(q.sync==='Pending')q.sync='Synced'});persist();dash()},700)}

/* Validation rules: fieldState gives the level ('e' error, 'w' warning or '') and message for one field */
const VREQ=['date','wt','hr','sbp','dbp','nyha','msts','lvef'], IREQ={name:1,contact:1,consent:1,age:1,sex:1,etio:1};
const LOCK_ORDER={m3:'b',m6:'m3'}, TRIED=new Set();
const tabLocked=(p,k)=>!!(p&&LOCK_ORDER[k]&&!p.v[LOCK_ORDER[k]].done);
const banner=m=>`<div class="lock-banner"><i class="ms">lock</i><span>${m}</span></div>`;
const okBanner=m=>`<div class="ok-banner"><i class="ms">check_circle</i><span>${m}</span></div>`;
/* Field rules. Every field is checked here, for both the visit tabs and the participant info */
const NAME_RE=/^\p{L}[\p{L}\s.'-]*$/u, DRUG_RE=/^[\p{L}\d][\p{L}\d\s()\/.,+-]*$/u, SITE_RE=/^[A-Z]{2,5}$/;
const todayStart=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const isDateField=f=>/^(date|echoDate)$/.test(f)||/\.start$/.test(f);
function fieldState(p,path){
  const isV=path.startsWith('v.'),k=isV?path.split('.')[1]:'b',f=isV?path.split('.').slice(2).join('.'):path;
  const v=isV?(G(p,'v.'+k)||{}):p,b=p.v.b,val=G(p,path),empty=val===''||val==null;
  const req=isV?(VREQ.includes(f)&&!(f==='lvef'&&k==='m3')):(f==='etioO'?p.etio==='Other':!!IREQ[f]);
  const tried=TRIED.has((p.uid||p.id)+'|'+k),st={req,filled:!empty,lvl:'',msg:''};
  const set=(l,m)=>{if(!st.lvl||(l==='e'&&st.lvl==='w')){st.lvl=l;st.msg=m}};
  if(empty){if(req&&tried)set('e','Required');return st}
  const txt=String(val),n=num(val),bd=b.date?day(b.date):null,t0=todayStart();
  if(!isV){
    if(f==='name'||f==='inv'){if(txt.trim().length<2)set('e','Enter at least 2 characters');else if(!NAME_RE.test(txt.trim()))set('e',"Letters, spaces, . ' - only")}
    if(f==='etioO'&&txt.trim().length<2)set('e','Enter at least 2 characters');
    if(f==='contact'&&!contactOk(val))set('e','Enter a valid phone number (7 to 15 digits)');
    if(f==='consent'){if(day(val)>t0)set('e','Consent date cannot be in the future');else if(day(val).getFullYear()<1990)set('e','Check the year');else if(bd&&day(val)>bd)set('e','After the baseline visit date')}
    if(f==='age'){if(!Number.isInteger(n))set('e','Whole years only');else if(n<18)set('e','Must be 18 or older');else if(n>150)set('e','Please check age');else if(n>110)set('w','Please check the age')}
    return st;
  }
  if(isDateField(f)&&day(val)>t0)set('e','Date cannot be in the future');
  if(/\.drug$/.test(f)){if(txt.trim().length<2)set('e','Enter at least 2 characters');else if(!DRUG_RE.test(txt.trim()))set('e','Letters, numbers and ( ) / - only')}
  if(/\.dose$/.test(f)&&!/\d/.test(txt))set('e','Include the number, e.g. 50 mg');
  if(['hr','sbp','dbp','msts','lvef'].includes(f)&&!Number.isInteger(n))set('e','Whole numbers only');
  if(f==='wt'&&!/^\d{1,3}(\.\d)?$/.test(txt))set('e','Up to 3 digits and 1 decimal');
  if(/\.ini$/.test(f)&&!/^[A-Z]{1,5}$/.test(txt))set('e','Capital letters only, up to 5');
  switch(f){
    case 'date': if(k!=='b'&&bd){const t=k==='m3'?90:180,w=k==='m3'?14:21,d=Math.round((day(val)-bd)/864e5);
      if(day(val)<=bd)set('e','Must be after the baseline date');else if(Math.abs(d-t)>w)set('w','Outside day '+t+' ±'+w+' window (day '+d+')')}break;
    case 'wt': if(n<30||n>250)set('w','Expected 30 to 250 kg');break;
    case 'hr': if(n<30||n>220)set('w','Expected 30 to 220 bpm');break;
    case 'sbp': if(v.dbp!==''&&v.dbp!=null&&n<=+v.dbp)set('e','Must be higher than diastolic BP');else if(n<50||n>260)set('w','Unusual value, please check');break;
    case 'dbp': if(v.sbp!==''&&v.sbp!=null&&n>=+v.sbp)set('e','Must be lower than systolic BP');else if(n<20||n>160)set('w','Unusual value, please check');break;
    case 'msts': if(n<0||n>60)set('w','Expected 0 to 60 repetitions');break;
    case 'nyha': if(val==='IV')set('w','NYHA IV: check exclusion criteria');break;
    case 'lvef': if(n<5||n>80)set('w','Expected 5 to 80%');else if(k==='b'&&n>40)set('w','Above 40%: outside inclusion (40% or less)');break;
    case 'echoDate': if(k==='b'&&bd){const d=Math.round((bd-day(val))/864e5);if(d<0||d>30)set('w','Should be within 30 days before baseline')}break;
  }
  return st;
}
/* Field-level errors for one visit, used by Mark complete */
function fieldErrs(p,k){
  const paths=['date','wt','hr','sbp','dbp','nyha','msts','lvef','echoDate'].map(f=>'v.'+k+'.'+f)
    .concat(PL.flatMap(([q])=>['drug','dose','start'].map(x=>`v.${k}.g.${q}.${x}`)))
    .concat([`v.${k}.rsO`,`v.${k}.ev.int`,`v.${k}.ini`]);
  if(k==='b')paths.push('name','contact','consent','age','etioO');
  return paths.map(x=>({x,st:fieldState(p,x)})).filter(o=>o.st.lvl==='e').map(o=>({msg:o.st.msg,sel:`[data-p="${o.x}"]`}));
}
const fcls=st=>st.lvl?'fld-'+st.lvl:(st.req&&st.filled?'fld-ok':'');
const freq=st=>st.req?'<span class="req" aria-hidden="true">*</span>':'';
const fmsgCls=lvl=>`fmsg ${lvl}`+(lvl?` tag ${lvl==='e'?'bad':'warn'}`:'');
const fmsg=st=>`<span class="${fmsgCls(st.lvl)}">${esc(st.msg)}</span>`;
function paintFields(){const p=cur();if(!p)return;
  document.querySelectorAll('#pane .pillar').forEach(card=>{const sel=card.querySelector('select');if(!sel)return;const s=sel.value;
    card.classList.toggle('active',s==='Active');card.classList.toggle('stopped',s==='Stopped');
    const chip=card.querySelector('.chip');if(chip){chip.textContent=s||'Not set';chip.className='chip '+(s==='Active'?'Completed':s==='Stopped'?'Overdue':'Not')}});
  document.querySelectorAll('#pane [data-p]').forEach(el=>{const st=fieldState(p,el.dataset.p);
    el.classList.remove('fld-e','fld-w','fld-ok');const c=fcls(st);if(c)el.classList.add(c);
    if(el.type!=='checkbox')el.setAttribute('aria-invalid',String(st.lvl==='e'));
    const m=el.closest('label')&&el.closest('label').querySelector('.fmsg');if(m){m.textContent=st.msg;m.className=fmsgCls(st.msg?st.lvl:'')}})}
const MAXLEN=[[/^name$/,100],[/^contact$/,20],[/^etioO$/,100],[/\.drug$/,80],[/\.dose$/,40],[/\.ev\.int$/,200],[/\.ini$/,5],[/\.rsO$/,100]];
const maxAttr=path=>{const r=MAXLEN.find(([re])=>re.test(path));return r?`maxlength="${r[1]}"`:''};
const inp=(p,path,l,t,x='')=>{const st=fieldState(p,path);return `<label>${l}${freq(st)}<input data-p="${path}" type="${t||'text'}" value="${esc(G(p,path))}" ${maxAttr(path)} ${x} class="${fcls(st)}" ${st.lvl==='e'?'aria-invalid="true"':''}>${fmsg(st)}</label>`};
const sel_=(p,path,l,o)=>{const st=fieldState(p,path);return `<label>${l}${freq(st)}<select data-p="${path}" class="${fcls(st)}" ${st.lvl==='e'?'aria-invalid="true"':''}>${o.map(a=>`<option ${G(p,path)===a?'selected':''}>${esc(a)}</option>`).join('')}</select>${fmsg(st)}</label>`};
const ck=(p,path,l)=>`<label class="ck"><input type="checkbox" data-p="${path}" ${G(p,path)?'checked':''}> ${l}</label>`;
const opt=(p,path,l)=>`<label class="check-row"><input type="checkbox" data-p="${path}" ${G(p,path)?'checked':''}><span>${l}</span></label>`;
const pillar=(p,k,q,n)=>{const s=G(p,`v.${k}.g.${q}.status`)||'';
  return `<div class="pillar ${s==='Active'?'active':s==='Stopped'?'stopped':''}">
    <div class="pillar-head"><b>${n}</b><span class="chip ${s==='Active'?'Completed':s==='Stopped'?'Overdue':'Not'}">${esc(s||'Not set')}</span></div>
    ${inp(p,`v.${k}.g.${q}.drug`,'Generic drug','text')}
    <div class="g2">${inp(p,`v.${k}.g.${q}.dose`,'Daily dose','text')}${inp(p,`v.${k}.g.${q}.start`,'Start date','date')}</div>
    ${sel_(p,`v.${k}.g.${q}.status`,'Status',['','Active','Not started','Stopped'])}
  </div>`};

 const mean=k=>{const a=P.filter(p=>p.v[k].msts!==''&&p.v[k].msts!=null).map(p=>+p.v[k].msts);return a.length?(a.reduce((x,y)=>x+y)/a.length).toFixed(1):'–'};

function summary(p){const r=(f)=>VK.map(([k])=>`<td>${f(p.v[k],k)||'–'}</td>`).join('');

 let sp='Need baseline date and 4 start dates';if(b&&st.every(Boolean)){const m=Math.max(...st.map(x=>(day(x)-day(b))/864e5));sp=m<=0?'Same-day (all four on or before baseline)':m<=7?'Rapid (within 7 days)':m<=30?'Early (within 30 days)':'Later than 30 days'}

 <tr><th>Visit date</th>${r(v=>v.date)}</tr><tr><th>1MSTS reps</th>${r(v=>v.msts)}</tr><tr><th>NYHA</th>${r(v=>v.nyha)}</tr><tr><th>LVEF (%)</th>${r(v=>v.lvef)}</tr><tr><th>Active pillars</th>${r((v)=>has(v)?act(v)+' / 4':'')}</tr><tr><th>Status</th>${VK.map(([k])=>`<td>${vstat(p,k)}</td>`).join('')}</tr></table></div>

/* Prescription files: bytes live in IndexedDB; the patient record keeps the metadata */
const FDB='standhf_files_v1',UPLOAD_MAX=10*1024*1024,UPLOAD_TYPES=['application/pdf','image/jpeg','image/png'];
function fileDb(){return new Promise((res,rej)=>{const r=indexedDB.open(FDB,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putFile(id,blob){const d=await fileDb();return new Promise((res,rej)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(blob,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function getFile(id){const d=await fileDb();return new Promise((res,rej)=>{const q=d.transaction('files').objectStore('files').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}
async function delFile(id){const d=await fileDb();return new Promise((res,rej)=>{const t=d.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
const sizeTxt=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function filesHtml(p,k){const fs=(p.files&&p.files[k])||[];if(!fs.length)return '<span class="mut">No files attached</span>';
  const canEdit=can('enter_data')&&!(p.v[k]&&p.v[k].done);
  return fs.map(f=>`<div class="file-row"><span class="rx-ico" data-thumb="${esc(f.id)}" data-ct="${esc(f.type)}" data-a="view" data-fid="${esc(f.id)}" data-name="${esc(f.name)}"><i class="ms">${f.type==='application/pdf'?'picture_as_pdf':'image'}</i></span><span class="rx-txt"><button type="button" class="link" data-a="view" data-fid="${esc(f.id)}" data-ct="${esc(f.type)}" data-name="${esc(f.name)}">${esc(f.name)}</button><span class="mut">${sizeTxt(f.size)} · ${esc(f.at)}</span></span>${canEdit?`<button type="button" class="icon-btn rx-del" data-a="remove" data-fid="${esc(f.id)}" aria-label="Remove ${esc(f.name)}" title="Remove file"><i class="ms">close</i></button>`:''}</div>`).join('')}
async function handleUpload(el){const f=el.files&&el.files[0];el.value='';if(!f)return;const p=cur();if(!p)return;
  if(!UPLOAD_TYPES.includes(f.type)){toast('Only PDF, JPG or PNG files can be uploaded');return}
  if(f.size>UPLOAD_MAX){toast('File is over 10 MB. Choose a smaller file.');return}
  if(p.v[tab].done){toast('Visit is locked. Reopen it to add files.');return}
  const id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),at=new Date().toLocaleString('en-GB');
  try{await putFile(id,f)}catch(e){toast('Could not save the file in this browser');return}
  p.files=p.files||{b:[],m3:[],m6:[]};p.files[tab]=p.files[tab]||[];
  p.files[tab].push({id,name:f.name,type:f.type,size:f.size,at});
  p.audit.push({t:at,f:tab+'.file',o:'',n:f.name});save(p);pane();dash();toast('Prescription uploaded: '+f.name)}
/* Small thumbnails for image files; PDFs keep their icon */
async function fillThumbs(){
  document.querySelectorAll('[data-thumb]').forEach(async el=>{
    if(el.dataset.ct==='application/pdf'||el.querySelector('img'))return;
    try{const b=await getFile(el.dataset.thumb);if(!b)return;el.innerHTML=`<img alt="" src="${URL.createObjectURL(b)}">`}catch(e){}
  })}
/* Remove a file from a visit that is not locked */
async function removeFile(fid){const p=cur();if(!p)return;let k=null,f=null;
  VK.forEach(([x])=>{const hit=((p.files&&p.files[x])||[]).find(y=>y.id===fid);if(hit){k=x;f=hit}});
  if(!f)return;
  if(p.v[k].done){toast('Visit is locked. Reopen it to remove files.');return}
  if(!confirm('Remove '+f.name+'?'))return;
  p.files[k]=p.files[k].filter(y=>y.id!==fid);
  try{await delFile(fid)}catch(e){}
  p.audit.push({t:new Date().toLocaleString('en-GB'),f:k+'.file',o:f.name,n:'removed'});save(p);pane();dash();toast('File removed: '+f.name)}
/* Open a stored file large in the viewer dialog */
async function openFile(fid,type,name){
  try{const b=await getFile(fid);if(!b){toast('File not found in this browser');return}
    const u=URL.createObjectURL(b);
    $('vTitle').textContent=name||'Prescription';
    $('vBody').innerHTML=type==='application/pdf'?`<iframe title="${esc(name)}" src="${u}"></iframe>`:`<img alt="${esc(name)}" src="${u}">`;
    $('viewer').showModal();
    setTimeout(()=>URL.revokeObjectURL(u),600000)}
  catch(e){toast('Could not open the file')}}
$('vClose').onclick=()=>$('viewer').close();
$('viewer').addEventListener('click',e=>{if(e.target===$('viewer'))$('viewer').close()});
$('viewer').addEventListener('close',()=>{$('vBody').innerHTML=''});

/* Searchable comboboxes (investigator, site) */
const INVESTIGATORS=['Emily Carter','John Miller','Michael Johnson','Sarah Thompson','David Lee','Jessica Brown','Robert Wilson'];   // add known investigator names here
function signedIn(){try{return sessionStorage.getItem('standhf_user')||''}catch(e){return ''}}
const ROLE_LABEL={superadmin:'Super Admin',investigator:'Site Investigator',central:'Central'};
function signedRole(){try{return sessionStorage.getItem('standhf_role')||''}catch(e){return ''}}
function names(){return [...new Set([...INVESTIGATORS,signedIn(),...DB.pts.map(p=>p.inv)].filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
/* Site choices come from the site list, limited to the sites this user is assigned to */
function sites(){return [...new Set(mySites())].sort()}
const OPTS={inv:names,site:sites};

function combo(path,key,label,value,ph){
  return `<label>${label}<div class="cb" data-cb="${key}"><input ${path?`data-p="${path}"`:''} ${key==='site'?'maxlength="5"':key==='inv'?'maxlength="100"':''} data-cb-input role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" value="${esc(value)}" placeholder="${ph||'Search or type a name'}"><span class="ms cb-ico">expand_more</span><ul class="cb-list" role="listbox" hidden></ul></div></label>`;
}
function cbItems(key,q){const all=OPTS[key](),t=q.trim(),lo=t.toLowerCase();
  const L=all.filter(o=>!lo||o.toLowerCase().includes(lo)).map(o=>({v:o}));
  if(t&&!all.some(o=>o.toLowerCase()===lo))L.push({v:t,add:1});return L}
function cbOpen(wrap,q){const ul=wrap.querySelector('.cb-list'),inp=wrap.querySelector('[data-cb-input]');
  const items=cbItems(wrap.dataset.cb,q||'');wrap._items=items;wrap._act=-1;
  ul.innerHTML=items.length?items.map((it,i)=>`<li role="option" data-i="${i}" class="${it.add?'new':''}">${it.add?'<span class="ms">add</span>Use "'+esc(it.v)+'"':esc(it.v)}</li>`).join(''):'<li class="none">No matches. Keep typing to add a new name.</li>';
  ul.hidden=false;inp.setAttribute('aria-expanded','true')}
function cbClose(wrap){const ul=wrap.querySelector('.cb-list'),inp=wrap.querySelector('[data-cb-input]');ul.hidden=true;wrap._act=-1;inp.setAttribute('aria-expanded','false')}
function cbOpenNow(wrap){return !wrap.querySelector('.cb-list').hidden}
function cbChoose(wrap,i){const it=wrap._items&&wrap._items[i];if(!it)return;const inp=wrap.querySelector('[data-cb-input]');
  inp.value=it.v;cbClose(wrap);if(inp.dataset.p)inp.dispatchEvent(new Event('change',{bubbles:true}))}
function cbMove(wrap,d){const lis=[...wrap.querySelectorAll('.cb-list li[data-i]')];if(!lis.length)return;
  wrap._act=(((wrap._act??-1)+d)+lis.length)%lis.length;lis.forEach((li,i)=>li.classList.toggle('act',i===wrap._act));lis[wrap._act].scrollIntoView({block:'nearest'})}

document.addEventListener('focusin',e=>{const i=e.target.closest&&e.target.closest('[data-cb-input]');if(i)cbOpen(i.closest('[data-cb]'),'')});
document.addEventListener('click',e=>{const i=e.target.closest&&e.target.closest('[data-cb-input]');if(i&&!cbOpenNow(i.closest('[data-cb]')))cbOpen(i.closest('[data-cb]'),i.value)},true);
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('[data-cb-input]'))cbOpen(e.target.closest('[data-cb]'),e.target.value)});
document.addEventListener('mousedown',e=>{const li=e.target.closest&&e.target.closest('.cb-list li[data-i]');if(li){e.preventDefault();cbChoose(li.closest('[data-cb]'),+li.dataset.i)}});
document.addEventListener('focusout',e=>{const i=e.target.closest&&e.target.closest('[data-cb-input]');if(i)cbClose(i.closest('[data-cb]'))});
document.addEventListener('keydown',e=>{const i=e.target.closest&&e.target.closest('[data-cb-input]');if(!i)return;const w=i.closest('[data-cb]');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!cbOpenNow(w))cbOpen(w,i.value);cbMove(w,e.key==='ArrowDown'?1:-1)}
  else if(e.key==='Enter'&&cbOpenNow(w)&&w._act>=0){e.preventDefault();cbChoose(w,w._act)}
  else if(e.key==='Escape'&&cbOpenNow(w)){e.preventDefault();e.stopPropagation();cbClose(w)}
  else if(e.key==='Tab')cbClose(w)});

/* What blocks moving on from a step: empty required fields and field errors */
function infoIssues(p){
  const m=[];if(!p.name)m.push('patient name');if(!p.contact)m.push('contact number');if(!p.consent)m.push('consent date');
  if(!p.age)m.push('age');if(!p.sex)m.push('sex');if(!p.etio)m.push('HF etiology');if(p.etio==='Other'&&!p.etioO)m.push('etiology (other)');
  const er=['name','contact','consent','age','etioO','inv'].map(x=>({x,st:fieldState(p,x)})).filter(o=>o.st.lvl==='e').map(o=>({msg:o.st.msg,sel:`[data-p="${o.x}"]`}));
  return {m,er}}
function visitIssues(p,k){
  return {m:missing(p,k),er:warns(p,k).filter(x=>x[0]==='e').map(x=>({msg:x[1]})).concat(fieldErrs(p,k))}}
/* Issue summary: one box listing what blocks the action; each line jumps to its field */
const errorBox=(title,items)=>`<b>${esc(title)}</b>${items.map(i=>`<div style="margin-top:6px">✖ Error: ${i.sel?`<button type="button" class="link" data-jump="${esc(i.sel)}">${esc(i.msg)}</button>`:esc(i.msg)}</div>`).join('')}`;
const MISS_INFO={'consent date':'consent','age':'age','sex':'sex','HF etiology':'etio','etiology (other)':'etioO','patient name':'name','contact number':'contact'};
function missingSel(name,k){if(MISS_INFO[name])return `[data-p="${MISS_INFO[name]}"]`;const q=name.match(/^(\w+) status$/);if(q)return `[data-p="v.${k}.g.${q[1]}.status"]`;return `[data-p="v.${k}.${name}"]`}
function showIssues(p,k,m,er,verb='Cannot mark complete'){
  pane();
  const seen=new Set(),items=[];
  const add=(msg,sel)=>{if(!seen.has(msg)){seen.add(msg);items.push({msg,sel})}};
  m.forEach(x=>add('Required: '+x,missingSel(x,k)));
  er.forEach(x=>add(x.msg,x.sel));
  const mi=$('miss');if(mi)mi.textContent=`${verb}: ${items.length} to fix`;
  const pt=document.querySelector('#pane .pane-title');
  if(pt)pt.insertAdjacentHTML('afterend',`<div class="dlg-err" role="alert">${errorBox(`${verb}: ${items.length} issue${items.length>1?'s':''}`,items)}</div>`);
}
function jumpTo(sel){const el=document.querySelector(sel);
  if(!el||el.disabled){toast('Open the related section first: this field is not on this screen');return}
  el.scrollIntoView({behavior:'smooth',block:'center'});el.focus({preventScroll:true});
  el.classList.add('fld-flash');setTimeout(()=>el.classList.remove('fld-flash'),1400)}

/* New participant: every field checked before the record is created */
function newErrors(site,nm,ct,inv){
  const out=[];
  if(!site)out.push({f:'site',msg:'Enter a site code.'});
  else if(!SITE_RE.test(site))out.push({f:'site',msg:'Site code: 2 to 5 capital letters, for example RIC.'});
  else if(!mySites().includes(site))out.push({f:'site',msg:'You are not assigned to site '+site+'.'});
  if(!nm)out.push({f:'name',msg:'Enter the patient name.'});
  else if(nm.length<2)out.push({f:'name',msg:'Patient name: at least 2 characters.'});
  else if(!NAME_RE.test(nm))out.push({f:'name',msg:"Patient name: letters, spaces, . ' - only."});
  if(!ct)out.push({f:'contact',msg:'Enter the contact number.'});
  else if(!contactOk(ct))out.push({f:'contact',msg:'Enter a valid phone number (7 to 15 digits).'});
  if(!inv)out.push({f:'inv',msg:'Enter the investigator name.'});
  else if(inv.length<2)out.push({f:'inv',msg:'Investigator name: at least 2 characters.'});
  else if(!NAME_RE.test(inv))out.push({f:'inv',msg:"Investigator name: letters, spaces, . ' - only."});
  return out}
const NEW_FIELD={site:'[data-cb="site"] input',name:'#nName',contact:'#nContact',inv:'[data-cb="inv"] input'};
function clearNewErrors(){
  document.querySelectorAll('#fNew .fld-e').forEach(x=>{x.classList.remove('fld-e');x.removeAttribute('aria-invalid')});
  document.querySelectorAll('#fNew .np-msg').forEach(x=>x.remove());
}
function showNewErrors(errs){
  clearNewErrors();
  errs.forEach(e=>{const el=document.querySelector(NEW_FIELD[e.f]);if(!el)return;
    el.classList.add('fld-e');el.setAttribute('aria-invalid','true');
    el.closest('label').insertAdjacentHTML('beforeend',`<span class="${fmsgCls('e')} np-msg">${esc(e.msg)}</span>`)});
  const box=$('newErr');box.className='dlg-err';box.hidden=false;
  box.innerHTML=errorBox(`Fix ${errs.length} issue${errs.length>1?'s':''} before creating the participant`,errs.map(e=>({msg:e.msg,sel:NEW_FIELD[e.f]})));
  if(errs[0])document.querySelector(NEW_FIELD[errs[0].f])?.focus();
}
/* New participant: opens inline in the main pane */
function paneNew(){
  $('pane').innerHTML=`<form id="fNew" class="np" novalidate>
    <div class="pane-title"><span>New participant</span></div>
    <p class="np-lead">The Study ID is generated from the site code. Patient name and contact number are required.</p>
    <div class="dlg-err" id="newErr" hidden></div>
    <div class="g"><label>Patient name<span class="req" aria-hidden="true">*</span><input id="nName" autocomplete="off" maxlength="100" required></label><label>Contact number<span class="req" aria-hidden="true">*</span><input id="nContact" type="tel" maxlength="20" placeholder="e.g. 0300 5550100" required></label>${combo(null,'site','Site code','','e.g. RIC')}${combo(null,'inv','Investigator name',signedIn())}</div>
    <div class="dlg-actions"><button type="button" id="cNew">Cancel</button><button type="submit" class="pri">Create participant</button></div>
  </form>`;
  $('fNew').querySelector('[data-cb="site"] input').focus();
}
$('bNew').onclick=()=>{newMode=true;paneNew()};
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#cNew')){newMode=false;pane();dash()}});
document.addEventListener('submit',e=>{if(e.target.id!=='fNew')return;e.preventDefault();const f=e.target;
  const site=f.querySelector('[data-cb="site"] input').value.toUpperCase().trim(),inv=f.querySelector('[data-cb="inv"] input').value.trim();
  const nm=f.querySelector('#nName').value.trim(),ct=f.querySelector('#nContact').value.trim();
  const errs=newErrors(site,nm,ct,inv);if(errs.length){showNewErrors(errs);return}
  const p=mk(site,inv,'','','','');p.name=nm;p.contact=ct;DB.pts.push(p);sel=p.id;tab='info';newMode=false;save(p);pane();dash()});

$('off').checked=!!DB.off;applyPerms();if(DB.pts.length)sel=DB.pts[0].id;
/* Deep links from the investigator dashboard: ?new=1 or ?patient=ID&tab=b|m3|m6 */
{const qp=new URLSearchParams(location.search);const pid=qp.get('patient');
 if(signedRole()==='investigator'&&signedIn()&&DB.pts.some(x=>x.inv==='Demo investigator')){DB.pts.forEach(x=>{if(x.inv==='Demo investigator')x.inv=signedIn()});persist()}
 if(pid&&DB.pts.some(x=>x.id===pid))sel=pid;
 if(['info','b','m3','m6','sum'].includes(qp.get('tab')))tab=qp.get('tab');
 if(qp.get('new')==='1')newMode=true}
pane();dash();

/* User chip: show who is signed in */
{const u=signedIn();$('userName').textContent=u||'Signed in';$('userRole').textContent=ROLE_LABEL[signedRole()]||'Study user';
 $('avatar').textContent=u.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?'}



/* Buttons and actions follow the signed-in role's permissions */
function applyPerms(){
  const gate={bNew:'add_patient',bCsv:'export_data',bDemo:'load_demo',bClr:'clear_all'};
  Object.entries(gate).forEach(([id,perm])=>{const el=$(id);if(el)el.hidden=!can(perm)});
}

/* Patient list: rail on desktop and tablet, folded bar on phones */
function listChevron(){
  const phone=window.matchMedia('(max-width: 720px)').matches;
  return phone?(listOpen?'expand_less':'expand_more'):(listOpen?'chevron_left':'chevron_right');
}
/* Patient list: show or hide */
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#listToggle')){listOpen=!listOpen;dash()}});

/* Search filters the patient list */
$('search').addEventListener('input',()=>{const q=$('search').value.trim().toLowerCase();
  document.querySelectorAll('#list .pt').forEach(el=>{el.hidden=!!q&&!el.textContent.toLowerCase().includes(q)})});
</script>
