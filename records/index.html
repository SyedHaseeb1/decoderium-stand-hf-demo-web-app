<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>STAND-HF E-CRF</title>
  <script>
    // Session gate: send anyone without a sign-in back to the login page.
    try{if(sessionStorage.getItem('standhf_auth')!=='1')location.replace('../login/')}catch(e){location.replace('../login/')}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
  <link rel="stylesheet" href="../assets/base.css">
</head>
<body data-page="records">
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Main navigation"></aside>

  <div class="main">
    <header class="topbar">
      <label class="search"><i class="ms">search</i><input id="search" type="search" placeholder="Search patients by ID, site or investigator" autocomplete="off"></label>
      <span class="pill" id="sync"></span>
      <label class="ck toggle"><input type="checkbox" id="off"><span>Offline mode</span></label>
      <div class="profile">
        <span class="avatar" id="avatar" aria-hidden="true">?</span>
        <span class="profile-meta"><b id="userName">Signed in</b><span id="userRole">Study user</span></span>
        <button type="button" class="icon-btn" id="bOut" title="Sign out" aria-label="Sign out"><i class="ms">logout</i></button>
      </div>
    </header>

    <div class="hello">
      <div><h1>Patient records</h1><p>Enter visit data, check it, and mark each visit complete.</p></div>
      <div class="actions">
        <button type="button" class="pri" id="bNew"><i class="ms">person_add</i>New participant</button>
        <button type="button" id="bCsv"><i class="ms">download</i>Export CSV</button>
        <button type="button" id="bDemo"><i class="ms">dataset</i>Load demo</button>
        <button type="button" class="danger" id="bClr"><i class="ms">delete_sweep</i>Clear all</button>
      </div>
    </div>

    <section class="kpis auto" id="tiles"></section>

    <div class="lay">
      <aside class="card pl" id="list"></aside>
      <section class="card" id="pane"></section>
    </div>
    <div class="snack" id="snack" role="status" aria-live="polite"></div>
  </div>
</div>
<script src="../assets/access.js"></script>
<script src="../assets/nav.js"></script>
<script>
const KEY='standhf_ecrf_v1';
let DB={pts:[],off:false},sel=null,tab='info',newMode=false,listOpen=!window.matchMedia('(max-width: 1000px)').matches;
try{const s=localStorage.getItem(KEY);if(s)DB=JSON.parse(s)}catch(e){}

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const G=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o),S=(o,p,v)=>{const k=p.split('.');let a=o;k.slice(0,-1).forEach(x=>a=a[x]=a[x]||{});a[k.pop()]=v};
const VK=[['b','Baseline'],['m3','3 Months'],['m6','6 Months']],PL=[['arni','ARNI (sacubitril/valsartan)'],['bb','Evidence-based beta-blocker'],['mra','MRA'],['sg','SGLT2 inhibitor']];
const RS=[['hypo','Hypotension'],['brady','Bradycardia'],['renal','Renal dysfunction'],['k','Hyperkalemia'],['intol','Intolerance'],['cost','Cost / access'],['pref','Patient preference'],['phys','Physician decision']];
const STOP=['','Chest pain','Presyncope / syncope','Intolerable dyspnea','Severe dizziness','Loss of balance','Marked pallor / diaphoresis','Participant request','Investigator safety concern'];

const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
const cur=()=>DB.pts.find(p=>p.id===sel);
const num=x=>x===''||x==null?NaN:+x,day=s=>s?new Date(s+'T00:00:00'):null,addD=(s,n)=>{const d=day(s);d.setDate(d.getDate()+n);return d},fmt=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

function mk(site,inv,consent,age,sex,etio){const n=DB.pts.filter(p=>p.site===site).length+1;return{id:site+'-'+String(n).padStart(3,'0'),site,inv,consent,age,sex,etio,etioO:'',sync:'Pending',audit:[],v:{b:{},m3:{},m6:{}}}}
function has(v){return Object.keys(v).some(k=>k!=='done'&&v[k]!==''&&v[k]!=null&&typeof v[k]!=='object')||(v.g&&Object.values(v.g).some(x=>x.status))}
function vstat(p,k){const v=p.v[k];if(v.done)return'Completed';const b=p.v.b.done?p.v.b.date:null;let late=false,due=false,missed=false;
 if(k!=='b'&&b){const t=k==='m3'?90:180,w=k==='m3'?14:21,T=new Date(),tg=addD(b,t);late=T>addD(b,t+w);due=T>=addD(b,t-w);missed=T>addD(b,t+w+30)&&!has(v)}
 return missed?'Missed':late?'Overdue':has(v)?'In Progress':due?'Due':'Not Started'}
function act(v){return PL.filter(([k])=>G(v,'g.'+k+'.status')==='Active').length}
function warns(p,k){const v=p.v[k],b=p.v.b,w=[],x=n=>num(v[n]);
 if(v['hr']!==''&&v.hr!=null&&(x('hr')<30||x('hr')>220))w.push(['w','Heart rate outside 30 to 220 bpm: please check']);
 if(v.sbp&&v.dbp&&(+v.sbp<=+v.dbp))w.push(['e','Systolic BP must be higher than diastolic']);
 if(v.sbp&&(+v.sbp<50||+v.sbp>260))w.push(['w','Systolic BP looks unusual']);
 if(v.msts!==''&&v.msts!=null&&(x('msts')<0||x('msts')>60))w.push(['w','1MSTS repetitions outside 0 to 60: please check']);
 if(v.nyha==='IV')w.push(['w','NYHA IV: check exclusion criteria (IV at rest)']);
 if(k==='b'&&p.age&&+p.age<18)w.push(['e','Age must be 18 or more']);
 if(v.lvef&&(+v.lvef<5||+v.lvef>80))w.push(['w','LVEF outside 5 to 80%']);
 if(k==='b'&&v.lvef&&+v.lvef>40)w.push(['w','LVEF above 40%: outside registry inclusion (LVEF 40% or less)']);
 if(k==='b'&&v.echoDate&&v.date&&(day(v.echoDate)>day(v.date)||(day(v.date)-day(v.echoDate))/864e5>30))w.push(['w','Baseline echo should be within 30 days before enrollment']);
 if(k==='b'&&p.consent&&v.date&&day(p.consent)>day(v.date))w.push(['e','Consent date is after the baseline visit date']);
 if(k!=='b'&&v.date&&b.date&&day(v.date)<=day(b.date))w.push(['e','Visit date must be after the baseline date']);
 if(k!=='b'&&v.date&&b.date){const t=k==='m3'?90:180,wd=k==='m3'?14:21,d=(day(v.date)-day(b.date))/864e5;if(Math.abs(d-t)>wd)w.push(['w','Outside window (day '+t+' ±'+wd+'): this visit is on day '+Math.round(d)])}
 PL.forEach(([q,n])=>{const g=G(v,'g.'+q)||{};if(g.status==='Active'&&!g.dose)w.push(['w',n+': daily dose missing']);if(g.status==='Active'&&!g.start)w.push(['w',n+': start date missing']);
  if(g.status&&g.status!=='Active'&&!Object.values(v.rs||{}).some(Boolean)&&!v.rsO)w.push(['w',n+' is '+g.status.toLowerCase()+': record a reason below'])});
 return w}
function missing(p,k){const v=p.v[k],m=[];['date','wt','hr','sbp','dbp','nyha','msts'].forEach(f=>{if(v[f]===''||v[f]==null)m.push(f)});
 if(k!=='m3'&&!v.lvef)m.push('lvef');PL.forEach(([q])=>{if(!G(v,'g.'+q+'.status'))m.push(q+' status')});
 if(k==='b'){if(!p.consent)m.push('consent date');if(!p.age)m.push('age');if(!p.sex)m.push('sex');if(!p.etio)m.push('HF etiology')}return m}
function save(p){p.sync='Pending';persist();if(!DB.off)setTimeout(()=>{DB.pts.forEach(q=>{if(q.sync==='Pending')q.sync='Synced'});persist();dash()},700)}

/* Validation rules: fieldState gives the level ('e' error, 'w' warning or '') and message for one field */
const VREQ=['date','wt','hr','sbp','dbp','nyha','msts','lvef'], IREQ={consent:1,age:1,sex:1,etio:1};
const LOCK_ORDER={m3:'b',m6:'m3'}, TRIED=new Set();
const tabLocked=(p,k)=>!!(p&&LOCK_ORDER[k]&&!p.v[LOCK_ORDER[k]].done);
const banner=m=>`<div class="lock-banner"><i class="ms">lock</i><span>${m}</span></div>`;
const okBanner=m=>`<div class="ok-banner"><i class="ms">check_circle</i><span>${m}</span></div>`;
function fieldState(p,path){
  const isV=path.startsWith('v.'),k=isV?path.split('.')[1]:'b',f=isV?path.split('.').slice(2).join('.'):path;
  const v=isV?(G(p,'v.'+k)||{}):p,b=p.v.b,val=G(p,path),empty=val===''||val==null;
  const req=isV?(VREQ.includes(f)&&!(f==='lvef'&&k==='m3')):!!IREQ[f];
  const tried=TRIED.has(p.id+'|'+k),st={req,filled:!empty,lvl:'',msg:''};
  const set=(l,m)=>{st.lvl=l;st.msg=m};
  if(empty){if(req&&tried)set('e','Required');return st}
  const n=num(val),bd=b.date?day(b.date):null;
  if(!isV){
    if(f==='consent'&&bd&&day(val)>bd)set('e','After the baseline visit date');
    if(f==='age'){if(n<18)set('e','Must be 18 or older');else if(n>110)set('w','Please check the age')}
    return st;
  }
  switch(f){
    case 'date': if(k!=='b'&&bd){const t=k==='m3'?90:180,w=k==='m3'?14:21,d=Math.round((day(val)-bd)/864e5);
      if(day(val)<=bd)set('e','Must be after the baseline date');else if(Math.abs(d-t)>w)set('w','Outside day '+t+' ±'+w+' window (day '+d+')')}break;
    case 'wt': if(n<30||n>250)set('w','Expected 30 to 250 kg');break;
    case 'hr': if(n<30||n>220)set('w','Expected 30 to 220 bpm');break;
    case 'sbp': if(v.dbp!==''&&v.dbp!=null&&n<=+v.dbp)set('e','Must be higher than diastolic BP');else if(n<50||n>260)set('w','Unusual value, please check');break;
    case 'dbp': if(v.sbp!==''&&v.sbp!=null&&n>=+v.sbp)set('e','Must be lower than systolic BP');else if(n<20||n>160)set('w','Unusual value, please check');break;
    case 'msts': if(n<0||n>60)set('w','Expected 0 to 60 repetitions');break;
    case 'nyha': if(val==='IV')set('w','NYHA IV: check exclusion criteria');break;
    case 'lvef': if(n<5||n>80)set('w','Expected 5 to 80%');else if(k==='b'&&n>40)set('w','Above 40%: outside inclusion (40% or less)');break;
    case 'echoDate': if(k==='b'&&bd){const d=Math.round((bd-day(val))/864e5);if(d<0||d>30)set('w','Should be within 30 days before baseline')}break;
  }
  return st;
}
const fcls=st=>st.lvl?'fld-'+st.lvl:(st.req&&st.filled?'fld-ok':'');
const freq=st=>st.req?'<span class="req" aria-hidden="true">*</span>':'';
const fmsg=st=>`<span class="fmsg ${st.lvl}">${esc(st.msg)}</span>`;
function paintFields(){const p=cur();if(!p)return;
  document.querySelectorAll('#pane .pillar').forEach(card=>{const sel=card.querySelector('select');if(!sel)return;const s=sel.value;
    card.classList.toggle('active',s==='Active');card.classList.toggle('stopped',s==='Stopped');
    const chip=card.querySelector('.chip');if(chip){chip.textContent=s||'Not set';chip.className='chip '+(s==='Active'?'Completed':s==='Stopped'?'Overdue':'Not')}});
  document.querySelectorAll('#pane [data-p]').forEach(el=>{const st=fieldState(p,el.dataset.p);
    el.classList.remove('fld-e','fld-w','fld-ok');const c=fcls(st);if(c)el.classList.add(c);
    if(el.type!=='checkbox')el.setAttribute('aria-invalid',String(st.lvl==='e'));
    const m=el.closest('label')&&el.closest('label').querySelector('.fmsg');if(m){m.textContent=st.msg;m.className='fmsg '+st.lvl}})}
const inp=(p,path,l,t,x='')=>{const st=fieldState(p,path);return `<label>${l}${freq(st)}<input data-p="${path}" type="${t||'text'}" value="${esc(G(p,path))}" ${x} class="${fcls(st)}" ${st.lvl==='e'?'aria-invalid="true"':''}>${fmsg(st)}</label>`};
const sel_=(p,path,l,o)=>{const st=fieldState(p,path);return `<label>${l}${freq(st)}<select data-p="${path}" class="${fcls(st)}" ${st.lvl==='e'?'aria-invalid="true"':''}>${o.map(a=>`<option ${G(p,path)===a?'selected':''}>${esc(a)}</option>`).join('')}</select>${fmsg(st)}</label>`};
const ck=(p,path,l)=>`<label class="ck"><input type="checkbox" data-p="${path}" ${G(p,path)?'checked':''}> ${l}</label>`;
const opt=(p,path,l)=>`<label class="check-row"><input type="checkbox" data-p="${path}" ${G(p,path)?'checked':''}><span>${l}</span></label>`;
const pillar=(p,k,q,n)=>{const s=G(p,`v.${k}.g.${q}.status`)||'';
  return `<div class="pillar ${s==='Active'?'active':s==='Stopped'?'stopped':''}">
    <div class="pillar-head"><b>${n}</b><span class="chip ${s==='Active'?'Completed':s==='Stopped'?'Overdue':'Not'}">${esc(s||'Not set')}</span></div>
    ${inp(p,`v.${k}.g.${q}.drug`,'Generic drug','text')}
    <div class="g2">${inp(p,`v.${k}.g.${q}.dose`,'Daily dose','text')}${inp(p,`v.${k}.g.${q}.start`,'Start date','date')}</div>
    ${sel_(p,`v.${k}.g.${q}.status`,'Status',['','Active','Not started','Stopped'])}
  </div>`};

function dash(){const P=DB.pts.filter(inScope),c=k=>P.filter(p=>p.v[k].done).length,od=k=>P.filter(p=>vstat(p,k)==='Overdue'||vstat(p,k)==='Missed').length;
 const mean=k=>{const a=P.filter(p=>p.v[k].msts!==''&&p.v[k].msts!=null).map(p=>+p.v[k].msts);return a.length?(a.reduce((x,y)=>x+y)/a.length).toFixed(1):'–'};
 const full=P.filter(p=>{const d=VK.filter(([k])=>p.v[k].done).pop();return d&&act(p.v[d[0]])===4}).length;
 const pend=P.filter(p=>p.sync==='Pending').length;
 $('tiles').innerHTML=[['Participants',P.length],['Baseline completed',c('b')],['3M done / overdue',c('m3')+' / '+od('m3')],['6M done / overdue',c('m6')+' / '+od('m6')],['4/4 pillars (latest visit)',full],['Mean 1MSTS',mean('b')+' → '+mean('m3')+' → '+mean('m6')],['Records pending sync',pend]].map(t=>`<div class="kpi"><b>${t[1]}</b><span>${t[0]}</span></div>`).join('');
 $('sync').textContent=(DB.off?'● Offline':'● Online')+' · '+(pend?pend+' pending':'all synced');
 $('sync').className='pill '+((DB.off||pend)?'pending':'synced');
 $('list').innerHTML=`<button type="button" class="list-head" id="listToggle" aria-expanded="${listOpen}" aria-controls="list"><span>Patient list</span><span class="list-count">${P.length}</span><i class="ms chev">${listChevron()}</i></button>`+(P.length?'':'<p class="mut">No participants yet. Add one or load demo data.</p>')+P.map(p=>`<div class="pt ${p.id===sel?'on':''}" data-id="${p.id}"><b>${p.id}</b><span>${esc(p.inv||'–')}</span><span class="mut">${p.sync}</span><div>${VK.map(([k,n])=>{const s=vstat(p,k);return`<span class="chip ${s.split(' ')[0]}">${n.replace(' Months','M')}: ${s}</span>`}).join('')}</div></div>`).join('');
 $('list').classList.toggle('collapsed',!listOpen);const p=cur();if(p){const w=$('warn');if(w&&tab!=='info'&&tab!=='sum')w.innerHTML=wHtml(p,tab);const pc=$('pc');if(pc&&tab in p.v)pc.textContent=act(p.v[tab])+' / 4';const st=$('vs');if(st&&tab in p.v)st.textContent=vstat(p,tab)}}

function wHtml(p,k){const w=warns(p,k);return w.length?'<div style="margin-bottom:16px">'+w.map(x=>`<div class="${x[0]==='e'?'err':'warn'}">${x[0]==='e'?'✖ Error':'⚠ Warning'}: ${x[1]}</div>`).join('')+'</div>':'<div class="ok">✔ All checks passed</div>'}

const ORDER=['info','b','m3','m6','sum'],ORDER_LABEL={info:'Participant info',b:'Baseline',m3:'3 Months',m6:'6 Months',sum:'Summary & audit'};
function navBar(k,acts=''){const i=ORDER.indexOf(k);if(i<0||i>=ORDER.length-1)return'';
 const nx=ORDER[i+1],lk=tabLocked(cur(),nx);
 return `<div class="step-nav">${acts}${lk?`<span class="lock-hint"><i class="ms">lock</i>${ORDER_LABEL[nx]} unlocks when ${ORDER_LABEL[LOCK_ORDER[nx]]} is complete</span>`:''}<button type="button" class="pri" data-a="next" data-k="${k}">Save draft & next: ${ORDER_LABEL[nx]}<span class="ms">arrow_forward</span></button></div>`}
function toast(msg){const el=$('snack');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2600)}

function pane(){if(newMode){paneNew();return}const p=cur(),el=$('pane');if(p&&!p.inv&&signedIn()){p.inv=signedIn();p.audit.push({t:new Date().toLocaleString('en-GB'),f:'inv',o:'',n:p.inv});persist()}
 if(!p){el.innerHTML='<p class="mut">Select a participant or create a new one to get started.</p>';return}
 if(tabLocked(p,tab))tab='b';
 const tabs=`<div class="tabs"><button class="${tab==='info'?'on':''}" data-t="info">Participant info</button>${VK.map(([k,n])=>{const lk=tabLocked(p,k);return `<button class="${tab===k?'on':''}${lk?' locked':''}${p.v[k].done?' done':''}" data-t="${k}" ${lk?'disabled title="Complete '+ORDER_LABEL[LOCK_ORDER[k]]+' first"':''}>${lk?'<i class="ms">lock</i>':p.v[k].done?'<i class="ms">check_circle</i>':''}${n}</button>`}).join('')}<button class="${tab==='sum'?'on':''}" data-t="sum">Summary & audit</button></div>`;
 let h=`<div class="pane-title"><span>Participant record</span><b>${p.id}</b></div>`+tabs;
 if(tab==='info')h+=`${p.v.b.done?banner('Baseline is complete. Consent, age, sex and etiology are locked. Reopen Baseline to edit them.'):''}<div class="sec">A. Patient & Site Identification</div><div class="g"><label>Study ID (auto-generated)<input value="${p.id}" disabled></label>${inp(p,'site','Site code','text','disabled')}${combo('inv','inv','Investigator name',G(p,'inv'))}${inp(p,'consent','Consent date','date')}${inp(p,'age','Age (years)','number','min=18 max=110')}${sel_(p,'sex','Sex',['','Male','Female'])}${sel_(p,'etio','HF etiology',['','Ischemic','Non-ischemic','Other'])}${inp(p,'etioO','If other, specify')}</div>${navBar('info')}`;
 else if(tab==='sum')h+=summary(p);
 else{const k=tab,v=p.v[k],name=VK.find(a=>a[0]===k)[1],b=p.v.b.date;
  let win='';if(k!=='b'){const t=k==='m3'?90:180,w=k==='m3'?14:21;win=b?`Target day ${t} ±${w}: ${fmt(addD(b,t-w))} to ${fmt(addD(b,t+w))}`:'Enter baseline date first'}
  h+=`${v.done?okBanner(name+' is complete and locked. Reopen the visit to make changes.'):''}<div class="visit-info">
    <strong>${name} visit</strong> — Status: <strong>${vstat(p,k)}</strong>${win?'<br>'+win:''}
  </div>
  <div class="sec">B. Clinical & Functional Assessment</div>
  <div class="g">${inp(p,'v.'+k+'.date','Visit date','date')}${inp(p,'v.'+k+'.wt','Weight (kg)','number','step=0.1')}${inp(p,'v.'+k+'.hr','Heart rate (bpm)','number')}${inp(p,'v.'+k+'.sbp','Systolic BP (mmHg)','number')}${inp(p,'v.'+k+'.dbp','Diastolic BP (mmHg)','number')}${sel_(p,'v.'+k+'.nyha','NYHA class',['','I','II','III','IV'])}${inp(p,'v.'+k+'.msts','1MSTS: repetitions in 60 sec','number','min=0')}${sel_(p,'v.'+k+'.stop','1MSTS stopped early? reason',STOP)}</div>
  <div class="g" style="margin-bottom:12px">${ck(p,'v.'+k+'.rep','1MSTS repeated (non-clinical reason)')}${k==='m3'?'<label>LVEF (%)<input value="N/A at 3 months" disabled></label>':inp(p,'v.'+k+'.lvef','LVEF (%)','number','min=5 max=80')}${k==='m3'?'':inp(p,'v.'+k+'.echoDate','Echo date','date')}</div>
  <div class="sec">C. Foundational GDMT <span style="float:right">Active: <b id="pc">${act(v)} / 4</b></span></div>
  <div class="pillars">${PL.map(([q,n])=>pillar(p,k,q,n)).join('')}</div>
  <div class="reasons"><div class="pillar-head"><b>Reason(s) GDMT not initiated or stopped</b></div><div class="checks">${RS.map(([r,l])=>opt(p,`v.${k}.rs.${r}`,l)).join('')}</div><div class="g2 reasons-other">${inp(p,'v.'+k+'.rsO','Other reason')}</div></div>
  <div class="sec">D. Clinical Events ${k==='b'?'(prior history)':'(since previous visit)'}</div>
  <div class="g">${ck(p,`v.${k}.ev.hf`,'HF hospitalization')}${ck(p,`v.${k}.ev.all`,'All-cause (other) hospitalization')}${k==='b'?'':ck(p,`v.${k}.ev.death`,'Death')}</div>
  <div class="g" style="margin-top:12px">${inp(p,`v.${k}.ev.int`,'Major intervention / event')}${inp(p,`v.${k}.ini`,'Investigator initials')}</div>
  <div class="sec">Data Checks</div><div id="warn">${wHtml(p,k)}</div>
  ${navBar(k,!can('mark_complete')?'':v.done?`<span class="lock-hint"><i class="ms">lock</i>Visit locked as complete</span><button data-a="reopen"><i class="ms">undo</i>Reopen visit</button>`:`<button data-a="done"><i class="ms">task_alt</i>Mark complete</button><span id="miss" class="e"></span>`)}`}
 el.innerHTML=h;if(tab!=='info'&&tab!=='sum'&&p.v[tab].done)el.querySelectorAll('[data-p]').forEach(i=>i.disabled=true);
 if(tab==='info'&&p.v.b.done)el.querySelectorAll('[data-p="consent"],[data-p="age"],[data-p="sex"],[data-p="etio"],[data-p="etioO"]').forEach(i=>i.disabled=true);
 if(!can('enter_data'))el.querySelectorAll('[data-p]').forEach(i=>i.disabled=true);
 paintFields()}

function summary(p){const r=(f)=>VK.map(([k])=>`<td>${f(p.v[k],k)||'–'}</td>`).join('');
 const d=(a,b)=>a!==''&&a!=null&&b!==''&&b!=null?((+b-+a>0?'+':'')+(+b-+a)):'–';
 const st=PL.map(([q])=>{let s=null;VK.forEach(([k])=>{const x=G(p.v[k],'g.'+q+'.start');if(x&&x>(s||''))s=x});return s}),b=p.v.b.date;
 let sp='Need baseline date and 4 start dates';if(b&&st.every(Boolean)){const m=Math.max(...st.map(x=>(day(x)-day(b))/864e5));sp=m<=0?'Same-day (all four on or before baseline)':m<=7?'Rapid (within 7 days)':m<=30?'Early (within 30 days)':'Later than 30 days'}
 return`<div class="sec">Summary (auto-calculated; entered values are never changed)</div><div class="wrap"><table><tr><th></th><th>Baseline</th><th>3 Months</th><th>6 Months</th></tr>
 <tr><th>Visit date</th>${r(v=>v.date)}</tr><tr><th>1MSTS reps</th>${r(v=>v.msts)}</tr><tr><th>NYHA</th>${r(v=>v.nyha)}</tr><tr><th>LVEF (%)</th>${r(v=>v.lvef)}</tr><tr><th>Active pillars</th>${r((v)=>has(v)?act(v)+' / 4':'')}</tr><tr><th>Status</th>${VK.map(([k])=>`<td>${vstat(p,k)}</td>`).join('')}</tr></table></div>
 <p style="margin-top:16px"><b>Primary outcomes:</b></p>
 <p>Δ 1MSTS baseline → 6M: <b>${d(p.v.b.msts,p.v.m6.msts)} reps</b><br>
 Δ LVEF baseline → 6M: <b>${d(p.v.b.lvef,p.v.m6.lvef)} points</b></p>
 <p><b>Onboarding speed:</b> ${sp}</p>
 <div class="sec" style="margin-top:20px">Audit Trail (last 10 changes)</div><div class="wrap"><table><tr><th>Time</th><th>Field</th><th>Old value</th><th>New value</th></tr>${p.audit.slice(-10).reverse().map(a=>`<tr><td style="font-size:12px">${a.t}</td><td style="font-size:12px">${esc(a.f)}</td><td style="font-size:12px">${esc(a.o)}</td><td style="font-size:12px">${esc(a.n)}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">No changes yet</td></tr>'}</table></div>`}

document.addEventListener('change',e=>{const el=e.target;if(el.id==='off'){DB.off=el.checked;persist();if(!DB.off)DB.pts.forEach(q=>{if(q.sync==='Pending')q.sync='Synced'});persist();dash();return}
 if(!el.dataset.p)return;const p=cur();if(!p)return;const old=G(p,el.dataset.p),nv=el.type==='checkbox'?el.checked:el.value;if(old===nv)return;
 S(p,el.dataset.p,nv);p.audit.push({t:new Date().toLocaleString('en-GB'),f:el.dataset.p,o:old??'',n:nv});save(p);paintFields();dash()});

document.addEventListener('click',e=>{const t=e.target.closest('[data-id],[data-t],[data-a]');if(!t)return;
 if(t.dataset.id){sel=t.dataset.id;newMode=false;if(window.matchMedia('(max-width: 1000px)').matches)listOpen=false;pane();dash()}
 else if(t.dataset.t){tab=t.dataset.t;newMode=false;pane();dash()}
 else if(t.dataset.a==='next'){const p=cur(),k=t.dataset.k,i=ORDER.indexOf(k);if(!p)return;save(p);if(tabLocked(p,ORDER[i+1])){toast('Draft saved · '+ORDER_LABEL[ORDER[i+1]]+' unlocks when '+ORDER_LABEL[LOCK_ORDER[ORDER[i+1]]]+' is complete');return}tab=ORDER[i+1];pane();dash();$('pane').scrollIntoView({behavior:'smooth',block:'start'});toast('Draft saved · '+ORDER_LABEL[tab]+' is next')}
 else{const p=cur(),v=p.v[tab];if(t.dataset.a==='done'){const m=missing(p,tab),er=warns(p,tab).filter(x=>x[0]==='e');TRIED.add(p.id+'|'+tab);if(m.length||er.length){pane();$('miss').textContent=(m.length?'Missing: '+m.join(', '):'')+(er.length?(m.length?' | ':'')+'Fix the errors highlighted above':'');return}v.done=true;p.audit.push({t:new Date().toLocaleString('en-GB'),f:tab+'.visit',o:'open',n:'completed'})}else{const later=VK.slice(VK.findIndex(([x])=>x===tab)+1).find(([x])=>p.v[x].done);if(later){toast('Reopen '+later[1]+' first');return}v.done=false;p.audit.push({t:new Date().toLocaleString('en-GB'),f:tab+'.visit',o:'completed',n:'reopened'})}save(p);pane();dash()}});

$('bClr').onclick=()=>{if(confirm('Delete all participants?')){DB.pts=[];sel=null;persist();pane();dash()}};
$('bCsv').onclick=()=>{const H=['study_id','site','investigator','consent','age','sex','etiology'];VK.forEach(([k])=>['status','date','wt','hr','sbp','dbp','nyha','msts','lvef','pillars','hf_hosp','all_hosp','death'].forEach(f=>H.push(k+'_'+f)));
 const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"',rows=DB.pts.map(p=>{const a=[p.id,p.site,p.inv,p.consent,p.age,p.sex,p.etio];VK.forEach(([k])=>{const v=p.v[k];a.push(vstat(p,k),v.date,v.wt,v.hr,v.sbp,v.dbp,v.nyha,v.msts,v.lvef,act(v),G(v,'ev.hf')?1:0,G(v,'ev.all')?1:0,G(v,'ev.death')?1:0)});return a.map(q).join(',')});
 const b=new Blob([[H.join(','),...rows].join('\n')],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='stand_hf_export.csv';a.click()};

$('bDemo').onclick=()=>{const T=new Date(),d=n=>{const x=new Date(T);x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};
 [[200,'RIC'],[185,'LHR'],[150,'KHI'],[120,'ISB'],[100,'RIC'],[60,'LHR'],[20,'KHI'],[6,'ISB']].forEach(([ago,site],i)=>{const p=mk(site,signedIn()||'Demo investigator',d(ago+3),45+i*3,i%3?'Male':'Female',i%2?'Ischemic':'Non-ischemic');
  [['b',ago,0],['m3',ago-90,1],['m6',ago-180,2]].forEach(([k,n,j])=>{if(n<0)return;const v=p.v[k];Object.assign(v,{date:d(n),wt:70+i-j,hr:84-j*5,sbp:108+j*4,dbp:68+j*2,nyha:['III','II','II'][j],msts:9+i%4+j*4+i%3,done:true,g:{}});
   if(k!=='m3'){v.lvef=28+i%5+j*3;v.echoDate=d(n+2)}const na=Math.min(4,2+j+i%2);PL.forEach(([q],x)=>{v.g[q]=x<na?{drug:'demo',dose:'demo dose',start:d(n),status:'Active'}:{status:'Not started'}});if(na<4)v.rs={phys:true};v.ev={}});DB.pts.push(p);p.sync='Synced'});persist();sel=DB.pts[0].id;tab='sum';pane();dash()};

$('bOut').onclick=()=>{try{sessionStorage.removeItem('standhf_auth')}catch(e){}location.href='../login/'};

/* Searchable comboboxes (investigator, site) */
const INVESTIGATORS=['Emily Carter','John Miller','Michael Johnson','Sarah Thompson','David Lee','Jessica Brown','Robert Wilson'];   // add known investigator names here
function signedIn(){try{return sessionStorage.getItem('standhf_user')||''}catch(e){return ''}}
const ROLE_LABEL={superadmin:'Super Admin',investigator:'Site Investigator',central:'Central'};
function signedRole(){try{return sessionStorage.getItem('standhf_role')||''}catch(e){return ''}}
function names(){return [...new Set([...INVESTIGATORS,signedIn(),...DB.pts.map(p=>p.inv)].filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
/* Site choices come from the site list, limited to the sites this user is assigned to */
function sites(){return [...new Set(mySites())].sort()}
const OPTS={inv:names,site:sites};

function combo(path,key,label,value,ph){
  return `<label>${label}<div class="cb" data-cb="${key}"><input ${path?`data-p="${path}"`:''} data-cb-input role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" value="${esc(value)}" placeholder="${ph||'Search or type a name'}"><span class="ms cb-ico">expand_more</span><ul class="cb-list" role="listbox" hidden></ul></div></label>`;
}
function cbItems(key,q){const all=OPTS[key](),t=q.trim(),lo=t.toLowerCase();
  const L=all.filter(o=>!lo||o.toLowerCase().includes(lo)).map(o=>({v:o}));
  if(t&&!all.some(o=>o.toLowerCase()===lo))L.push({v:t,add:1});return L}
function cbOpen(wrap,q){const ul=wrap.querySelector('.cb-list'),inp=wrap.querySelector('[data-cb-input]');
  const items=cbItems(wrap.dataset.cb,q||'');wrap._items=items;wrap._act=-1;
  ul.innerHTML=items.length?items.map((it,i)=>`<li role="option" data-i="${i}" class="${it.add?'new':''}">${it.add?'<span class="ms">add</span>Use "'+esc(it.v)+'"':esc(it.v)}</li>`).join(''):'<li class="none">No matches. Keep typing to add a new name.</li>';
  ul.hidden=false;inp.setAttribute('aria-expanded','true')}
function cbClose(wrap){const ul=wrap.querySelector('.cb-list'),inp=wrap.querySelector('[data-cb-input]');ul.hidden=true;wrap._act=-1;inp.setAttribute('aria-expanded','false')}
function cbOpenNow(wrap){return !wrap.querySelector('.cb-list').hidden}
function cbChoose(wrap,i){const it=wrap._items&&wrap._items[i];if(!it)return;const inp=wrap.querySelector('[data-cb-input]');
  inp.value=it.v;cbClose(wrap);if(inp.dataset.p)inp.dispatchEvent(new Event('change',{bubbles:true}))}
function cbMove(wrap,d){const lis=[...wrap.querySelectorAll('.cb-list li[data-i]')];if(!lis.length)return;
  wrap._act=(((wrap._act??-1)+d)+lis.length)%lis.length;lis.forEach((li,i)=>li.classList.toggle('act',i===wrap._act));lis[wrap._act].scrollIntoView({block:'nearest'})}

document.addEventListener('focusin',e=>{const i=e.target.closest&&e.target.closest('[data-cb-input]');if(i)cbOpen(i.closest('[data-cb]'),'')});
document.addEventListener('click',e=>{const i=e.target.closest&&e.target.closest('[data-cb-input]');if(i&&!cbOpenNow(i.closest('[data-cb]')))cbOpen(i.closest('[data-cb]'),i.value)},true);
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('[data-cb-input]'))cbOpen(e.target.closest('[data-cb]'),e.target.value)});
document.addEventListener('mousedown',e=>{const li=e.target.closest&&e.target.closest('.cb-list li[data-i]');if(li){e.preventDefault();cbChoose(li.closest('[data-cb]'),+li.dataset.i)}});
document.addEventListener('focusout',e=>{const i=e.target.closest&&e.target.closest('[data-cb-input]');if(i)cbClose(i.closest('[data-cb]'))});
document.addEventListener('keydown',e=>{const i=e.target.closest&&e.target.closest('[data-cb-input]');if(!i)return;const w=i.closest('[data-cb]');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!cbOpenNow(w))cbOpen(w,i.value);cbMove(w,e.key==='ArrowDown'?1:-1)}
  else if(e.key==='Enter'&&cbOpenNow(w)&&w._act>=0){e.preventDefault();cbChoose(w,w._act)}
  else if(e.key==='Escape'&&cbOpenNow(w)){e.preventDefault();e.stopPropagation();cbClose(w)}
  else if(e.key==='Tab')cbClose(w)});

/* New participant: opens inline in the main pane */
function paneNew(){
  $('pane').innerHTML=`<form id="fNew" class="np" novalidate>
    <div class="pane-title"><span>New participant</span></div>
    <p class="np-lead">The Study ID is generated from the site code. Pick a site and investigator, or type a new name.</p>
    <div class="dlg-err" id="newErr" hidden></div>
    <div class="g">${combo(null,'site','Site code','','e.g. RIC')}${combo(null,'inv','Investigator name',signedIn())}</div>
    <div class="dlg-actions"><button type="button" id="cNew">Cancel</button><button type="submit" class="pri">Create participant</button></div>
  </form>`;
  $('fNew').querySelector('[data-cb="site"] input').focus();
}
$('bNew').onclick=()=>{newMode=true;paneNew()};
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#cNew')){newMode=false;pane();dash()}});
document.addEventListener('submit',e=>{if(e.target.id!=='fNew')return;e.preventDefault();const f=e.target;
  const site=f.querySelector('[data-cb="site"] input').value.toUpperCase().trim(),inv=f.querySelector('[data-cb="inv"] input').value.trim();
  if(!site){$('newErr').textContent='Enter a site code to create a participant.';$('newErr').hidden=false;f.querySelector('[data-cb="site"] input').focus();return}
  if(!mySites().includes(site)){$('newErr').textContent='You are not assigned to site '+site+'. Ask an administrator.';$('newErr').hidden=false;return}
  const p=mk(site,inv,'','','','');DB.pts.push(p);sel=p.id;tab='info';newMode=false;save(p);pane();dash()});

$('off').checked=!!DB.off;applyPerms();if(DB.pts.length)sel=DB.pts[0].id;
/* Deep links from the investigator dashboard: ?new=1 or ?patient=ID&tab=b|m3|m6 */
{const qp=new URLSearchParams(location.search);const pid=qp.get('patient');
 if(signedRole()==='investigator'&&signedIn()&&DB.pts.some(x=>x.inv==='Demo investigator')){DB.pts.forEach(x=>{if(x.inv==='Demo investigator')x.inv=signedIn()});persist()}
 if(pid&&DB.pts.some(x=>x.id===pid))sel=pid;
 if(['info','b','m3','m6','sum'].includes(qp.get('tab')))tab=qp.get('tab');
 if(qp.get('new')==='1')newMode=true}
pane();dash();

/* User chip: show who is signed in */
{const u=signedIn();$('userName').textContent=u||'Signed in';$('userRole').textContent=ROLE_LABEL[signedRole()]||'Study user';
 $('avatar').textContent=u.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?'}



/* Buttons and actions follow the signed-in role's permissions */
function applyPerms(){
  const gate={bNew:'add_patient',bCsv:'export_data',bDemo:'load_demo',bClr:'clear_all'};
  Object.entries(gate).forEach(([id,perm])=>{const el=$(id);if(el)el.hidden=!can(perm)});
}

/* Patient list: rail on desktop and tablet, folded bar on phones */
function listChevron(){
  const phone=window.matchMedia('(max-width: 720px)').matches;
  return phone?(listOpen?'expand_less':'expand_more'):(listOpen?'chevron_left':'chevron_right');
}
/* Patient list: show or hide */
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#listToggle')){listOpen=!listOpen;dash()}});

/* Search filters the patient list */
$('search').addEventListener('input',()=>{const q=$('search').value.trim().toLowerCase();
  document.querySelectorAll('#list .pt').forEach(el=>{el.hidden=!!q&&!el.textContent.toLowerCase().includes(q)})});
</script>
