<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>STAND-HF Administration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a5fb4">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="../assets/STAND-HF-logo.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/icon-512.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="../assets/fonts/material-symbols-rounded.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/base.css?v=20261015m">
<script>
  /* Register the service worker so the browser can install the app (full-screen from the home screen) */
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
</script>
</head>
<body data-page="admin" class="compact">
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Main navigation"></aside>

  <div class="main">
    <div id="app-header" data-page="admin" data-search="Search patients, sites or users"></div>

    <div class="hello">
      <div>
        <h1 id="welcome">System Administration</h1>
        <p>Manage cardiology sites, user accounts, roles and system permissions.</p>
      </div>
      <div class="actions">
        <a class="btn primary" href="../dashboard/"><i class="ms">space_dashboard</i>View Live Dashboard</a>
        <a class="btn" href="../records/"><i class="ms">edit_note</i>Patient records</a>
      </div>
    </div>

    <div id="view"></div>
    <div class="snack" id="snack" role="status" aria-live="polite"></div>
  </div>
</div>

<script src="../assets/access.js?v=20261015b"></script>
<script src="../assets/notifications-data.js?v=20261015b"></script>
<script src="../assets/dialog.js?v=20261015b"></script>
<script src="../assets/header.js?v=20261015b" data-root="../"></script>
<script src="../assets/nav.js?v=20261015b"></script>
<script>
const LOGIN='../login/', ECRF='../records/', SUPER='superadmin';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=s=>String(s||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?';
const TABS=['users','sites','perms'];
const isCentral=()=>session().role==='central';
const CENTRAL_MSG='Central team can only manage site investigators';
/* Central team can only manage site investigators */
const centralMay=(user,newRole)=>!isCentral()||(user.role==='investigator'&&newRole==='investigator');
/* Dashboard "Edit user" links here with ?user=<username>: that row is highlighted */
const highlightUser=new URLSearchParams(location.search).get('user')||'';
const tabFromHash=()=>{
  const h=location.hash.slice(1);
  if(h==='dash'){location.replace('../dashboard/');return 'users'}
  return TABS.includes(h)?h:'users'
};
let tab=tabFromHash();

/* Only Super Admins may open this page */
if(sessionVal('standhf_auth')!=='1')location.replace(LOGIN);
else if(session().role!==SUPER&&!can('assign_investigators'))location.replace(ECRF);

function toast(m){const el=$('snack');el.textContent=m;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2600)}
function patients(){try{return JSON.parse(localStorage.getItem('standhf_ecrf_v1')||'null')?.pts||[]}catch(e){return []}}
const activeSupers=s=>s.users.filter(u=>u.role===SUPER&&u.active).length;

/* Apply a change to the stored access data; a returned message blocks the change */
function commit(mutate){
  const s=accessStore(),err=mutate(s);
  if(err){toast(err);render();return false}
  saveAccess(s);render();return true;
}

function roleOptions(current){
  return Object.entries(ROLE_NAMES).map(([k,v])=>`<option value="${k}" ${k===current?'selected':''}>${v}</option>`).join('');
}
function siteBoxes(s,user,attr){
  if(!s.sites.length)return '<span class="muted">Add a site first</span>';
  return `<div class="site-opts">${s.sites.map(x=>`<label class="check-row"><input type="checkbox" ${attr} value="${esc(x.code)}" ${user&&user.sites.includes(x.code)?'checked':''}><span>${esc(x.code)}</span></label>`).join('')}</div>`;
}

const ROLE_HINT={superadmin:'Oversees all sites and system configuration. Does not enter patient data.',investigator:'Enters patients and completes clinical visit forms at assigned sites.',central:'National oversight across all ~100 sites and zones. Monitors and exports data.'};
const ROLE_META={
  investigator:{
    icon:'clinical_notes',
    title:'Site Investigator',
    badge:'Clinical Care Lead',
    badgeCls:'inv',
    desc:'Enrolls patients and records Baseline (B), M3, and M6 clinical CRFs at assigned medical centres.',
    feats:[{t:'Patient intake & visits',ok:true},{t:'Scoped to assigned sites',ok:true},{t:'No admin oversight',lock:true}]
  },
  central:{
    icon:'travel_explore',
    title:'Central Directorate',
    badge:'National Oversight',
    badgeCls:'central',
    desc:'Oversees ~100 participating sites across Pakistan. Read-only patient data with full export power.',
    feats:[{t:'All sites & zones scope',ok:true},{t:'Audit-logged CSV export',ok:true},{t:'Read-only clinical forms',lock:true}]
  },
  superadmin:{
    icon:'admin_panel_settings',
    title:'Super Administrator',
    badge:'Global System Admin',
    badgeCls:'super',
    desc:'Configures medical centres, provisions user credentials, and maintains access permissions.',
    feats:[{t:'Manage users & sites',ok:true},{t:'Full security controls',ok:true},{t:'No clinical data tampering',lock:true}]
  }
};
function renderRoleCards(){
  return ['investigator','central','superadmin'].map(r=>{
    const m=ROLE_META[r];
    const locked=isCentral()&&r!=='investigator';
    return `<label class="role-card-pro ${locked?'is-locked':''}">
      <input type="radio" name="role" value="${r}" ${r==='investigator'?'checked':''} ${locked?'disabled':''}>
      <div class="rc-header">
        <div class="rc-icon-box"><i class="ms">${m.icon}</i></div>
        <div class="rc-check-circle"><i class="ms">check</i></div>
      </div>
      <div class="rc-title-row">
        <span class="rc-title-text">${esc(m.title)}</span>
        <span class="rc-scope-tag ${m.badgeCls}">${esc(m.badge)}</span>
      </div>
      <div class="rc-desc-text">${esc(m.desc)}</div>
      <div class="rc-pill-features">
        ${m.feats.map(f=>`<span class="rc-feat"><i class="ms ${f.ok?'ok':'lock'}">${f.ok?'check_circle':'lock'}</i>${esc(f.t)}</span>`).join('')}
      </div>
    </label>`;
  }).join('');
}
function renderSiteCards(sites){
  if(!sites.length)return '<div class="muted" style="padding:16px;text-align:center">No medical centres configured. Please add a site first.</div>';
  return sites.map(x=>{
    const zone=x.zone||'Central';
    const city=x.city||zone;
    return `<label class="site-card-item" data-zone="${esc(zone)}" data-code="${esc(x.code)}">
      <input type="checkbox" name="site" value="${esc(x.code)}">
      <div class="site-card-top">
        <span class="site-code-badge">${esc(x.code)}</span>
        <span class="site-zone-tag zone-${zone.toLowerCase()}">${esc(zone)}</span>
      </div>
      <div class="site-name-text">${esc(x.name)}</div>
      <div class="site-city-text"><i class="ms">location_on</i>${esc(city)}</div>
    </label>`;
  }).join('');
}

const slug=s=>String(s||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^\.+|\.+$/g,'');
let userTouched=false;
/* Field message: an error (red) or a hint (muted) under a form field */
function setMsg(id,msg,isErr){
  const el=document.querySelector(`[data-for="${id}"]`);
  if(el){el.textContent=msg||'';el.className='fmsg '+(isErr?'e':'hint-txt')}
  const input=document.getElementById(id);
  if(input)input.setAttribute('aria-invalid',String(!!isErr));
}
/* Usernames are checked against the existing user list (the same list the Users table shows).
   Keep this one function as the single check, so a server-side lookup can replace it later. */
function usernameTaken(username){
  return accessStore().users.some(u=>u.username===username);
}
function refreshUsernameMsg(){
  const raw=$('uUser').value,v=raw.trim().toLowerCase();
  const badChars=!/^[a-z0-9._]*$/.test(raw);
  const taken=!badChars&&!!v&&usernameTaken(v);
  const msg=badChars?'Use lowercase letters, numbers, dot or underscore':taken?'That username already exists. Choose another.':'Lowercase letters, numbers, dot or underscore';
  setMsg('uUser',msg,badChars||taken);
  const badge=$('uAvailBadge');
  if(badge){
    if(!v){badge.innerHTML='';badge.className='avail-badge'}
    else if(badChars||taken){badge.innerHTML='<i class="ms" style="color:var(--error);font-size:16px">cancel</i>';badge.className='avail-badge error'}
    else{badge.innerHTML='<i class="ms" style="color:var(--success);font-size:16px">check_circle</i>';badge.className='avail-badge ok'}
  }
}
function userPreview(){
  const el=$('userPreview');if(!el)return;
  const n=($('uName')?.value||'').trim();
  const u=($('uUser')?.value||'').trim();
  const r=document.querySelector('#fUser input[name="role"]:checked');
  const roleVal=r?r.value:'investigator';
  const sites=[...document.querySelectorAll('#fUser input[name="site"]:checked')].map(x=>x.value);
  
  el.innerHTML=`Will sign in as <code>${esc(u||'username')}</code>`;
  const set=(id,t)=>{const x=$(id);if(x)x.textContent=t};
  set('sumName',n||'New User Account');
  set('sumUser',u?`@${u}`:'@username');
  set('sumRole',ROLE_NAMES[roleVal]||'Site Investigator');

  // Avatar initials
  const av=$('sumAvatar');
  if(av) av.textContent=initials(n);

  // Role preview styling
  const wrapCard=$('userPreviewCard');
  if(wrapCard) wrapCard.className=`user-preview-card role-${roleVal}`;

  // Designation & Qualification meta preview
  const desig=($('uDesig')?.value||'').trim();
  const qual=($('uQual')?.value||'').trim();
  const metaParts=[desig,qual].filter(Boolean);
  const sm=$('sumMetaText');
  if(sm) sm.textContent=metaParts.length?metaParts.join(' · '):'Clinical Staff';

  // Contact chips
  const email=($('uEmail')?.value||'').trim();
  const phone=($('uPhone')?.value||'').trim();
  const ec=$('sumEmailChip'), pc=$('sumPhoneChip');
  if(ec){
    ec.innerHTML=email?`<i class="ms">mail</i>${esc(email)}`:'<i class="ms">mail</i>No email';
    ec.className=email?'chip':'chip muted';
  }
  if(pc){
    pc.innerHTML=phone?`<i class="ms">call</i>${esc(phone)}`:'<i class="ms">call</i>No mobile';
    pc.className=phone?'chip':'chip muted';
  }

  // Sites summary text, pills, and counter
  const sw=$('sumSites');
  const sp=$('sumSitesPills');
  const sc=$('sitesCount');
  if(roleVal===SUPER){
    if(sw)sw.textContent='All sites (Global System Access)';
    if(sp)sp.innerHTML='<span class="site-chip admin">Global System Scope</span>';
    if(sc)sc.textContent='Global administrative access';
  } else if(roleVal==='central'){
    if(sw)sw.textContent='All ~100 sites & zones (National Oversight)';
    if(sp)sp.innerHTML='<span class="site-chip central">All Pakistan Zones (~100 sites)</span>';
    if(sc)sc.textContent='Study-wide national access';
  } else {
    if(sw)sw.textContent=sites.length?`${sites.length} centre${sites.length>1?'s':''} assigned`:'None selected (Required)';
    if(sp){
      sp.innerHTML=sites.length?sites.map(c=>`<span class="site-chip">${esc(c)}</span>`).join(''):'<span class="muted" style="font-size:12px;font-style:italic">Assign at least 1 medical centre</span>';
    }
    if(sc)sc.textContent=`${sites.length} centre${sites.length!==1?'s':''} selected`;
  }

  // Readiness progress
  const hasName=!!n;
  const hasUser=!!u&&!usernameTaken(u);
  const hasSites=roleVal!=='investigator'||sites.length>0;
  const readyFill=$('readinessFill');
  const readyText=$('readinessText');
  let pctVal=25;
  if(hasName)pctVal+=25;
  if(hasUser)pctVal+=25;
  if(hasSites)pctVal+=25;
  if(readyFill&&readyFill.style)readyFill.style.width=`${pctVal}%`;
  if(readyText){
    if(pctVal===100){
      readyText.innerHTML='<i class="ms" style="color:var(--success)">check_circle</i> Account configuration complete';
      readyText.className='readiness-text ready';
    } else if(!hasName){
      readyText.innerHTML='<i class="ms">pending</i> Enter full name';
      readyText.className='readiness-text';
    } else if(!hasUser){
      readyText.innerHTML='<i class="ms">pending</i> Enter unique username';
      readyText.className='readiness-text';
    } else if(!hasSites){
      readyText.innerHTML='<i class="ms">pending</i> Select at least 1 medical centre';
      readyText.className='readiness-text';
    }
  }

  // Show/Hide site selection area vs Scope info banner
  const siteArea=$('siteSelectionArea');
  const scopeBanner=$('siteScopeBanner');
  const siteBlockTitle=$('siteBlockTitle');
  const siteBlockDesc=$('siteBlockDesc');
  if(roleVal==='investigator'){
    if(siteArea)siteArea.hidden=false;
    if(scopeBanner)scopeBanner.hidden=true;
    if(siteBlockTitle)siteBlockTitle.innerHTML='Assigned Medical Centres (Sites) <span class="req">*</span>';
    if(siteBlockDesc)siteBlockDesc.textContent='Site Investigators require at least one hospital centre to enroll patients and enter clinical CRFs.';
  } else if(roleVal==='central'){
    if(siteArea)siteArea.hidden=true;
    if(scopeBanner){
      scopeBanner.hidden=false;
      scopeBanner.className='site-scope-banner central-banner';
      scopeBanner.innerHTML=`<div class="banner-icon"><i class="ms">travel_explore</i></div>
        <div class="banner-content">
          <h4>Study-Wide National Monitoring Scope</h4>
          <p>Central Monitoring Directorate members have continuous oversight across <strong>all participating cardiology centres and zones</strong> in Pakistan (~100 sites). Centre-specific assignment is not required.</p>
          <div class="scope-tags">
            <span class="tag info"><i class="ms">public</i>All Pakistan Zones</span>
            <span class="tag info"><i class="ms">visibility</i>Read-Only Clinical Oversight</span>
            <span class="tag info"><i class="ms">download</i>Full Registry Export (Audit Logged)</span>
          </div>
        </div>`;
    }
    if(siteBlockTitle)siteBlockTitle.textContent='Medical Centres Scope';
    if(siteBlockDesc)siteBlockDesc.textContent='National oversight across all participating cardiology centres.';
  } else if(roleVal===SUPER){
    if(siteArea)siteArea.hidden=true;
    if(scopeBanner){
      scopeBanner.hidden=false;
      scopeBanner.className='site-scope-banner admin-banner';
      scopeBanner.innerHTML=`<div class="banner-icon"><i class="ms">admin_panel_settings</i></div>
        <div class="banner-content">
          <h4>Global System Administration Scope</h4>
          <p>Super Administrators configure cardiology centres, provision user accounts, and maintain system security across all sites. Centre-specific assignment is not required.</p>
          <div class="scope-tags">
            <span class="tag"><i class="ms">domain</i>Manage All Sites</span>
            <span class="tag"><i class="ms">manage_accounts</i>Manage All Users</span>
            <span class="tag"><i class="ms">shield</i>Role &amp; Permissions Governance</span>
          </div>
        </div>`;
    }
    if(siteBlockTitle)siteBlockTitle.textContent='Medical Centres Scope';
    if(siteBlockDesc)siteBlockDesc.textContent='Global system administrative oversight across all sites.';
  }
}
function sitePreview(){
  const el=$('sitePreview');if(!el)return;
  const c=($('sCode')?.value||'').trim().toUpperCase();
  el.innerHTML=c?`Patients will be numbered <code>${esc(c)}-001</code>`:'Enter a code, for example RIC';
}

function usersView(){
  const s=accessStore(),central=isCentral();
  const centralUsers=s.users.filter(u=>u.role==='central');
  const invUsers=s.users.filter(u=>u.role==='investigator');
  const adminUsers=s.users.filter(u=>u.role===SUPER);
  const auditLogs=typeof centralAuditLog==='function'?centralAuditLog():[];

  const userRow=(u,isInv)=>`<tr data-user-row="${esc(u.username)}" ${u.username===highlightUser?'style="background:var(--soft-2);outline:2px solid var(--primary);outline-offset:-2px"':''}>
    <td><b>${esc(u.name)}</b><div class="muted">${esc(u.username)}</div></td>
    <td><select data-role-of="${esc(u.username)}" aria-label="Role for ${esc(u.name)}">${roleOptions(u.role)}</select></td>
    <td>${u.role===SUPER?'<span class="muted">All sites (Global)</span>':u.role==='central'?'<span class="tag info" style="font-size:12px">All Sites & Zones (National Oversight)</span>':siteBoxes(s,u,`data-site-of="${esc(u.username)}"`)}</td>
    <td><label class="check-row"><input type="checkbox" data-active-of="${esc(u.username)}" ${u.active?'checked':''}><span>Active</span></label></td>
  </tr>`;

  /* Central Team can only add Site Investigators, so the other roles are shown but locked */
  const roleCards=renderRoleCards();

  return `
    <!-- Distinct Team 1: Central Monitoring Directorate -->
    <section class="card" style="margin-bottom:16px">
      <div class="card-head">
        <div>
          <h2>Central Monitoring Directorate</h2>
          <small>Study leadership &amp; data monitors ("The boss after super admin") · Read-only patient data with full export power</small>
        </div>
        <span class="tag info">${centralUsers.length} Monitors</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Member</th><th>Role</th><th>Scope &amp; Zones</th><th>Access</th></tr></thead>
          <tbody>${centralUsers.map(u=>userRow(u,false)).join('')||'<tr><td colspan="4" class="muted">No Central Team users configured.</td></tr>'}</tbody>
        </table>
      </div>
    </section>

    <!-- Distinct Team 2: Clinical Site Investigators -->
    <section class="card" style="margin-bottom:16px">
      <div class="card-head">
        <div>
          <h2>Site Investigators Team</h2>
          <small>Cardiologists &amp; clinical coordinators entering patient visits at assigned hospital sites</small>
        </div>
        <span class="tag good">${invUsers.length} Clinicians</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Investigator</th><th>Role</th><th>Assigned Sites</th><th>Access</th></tr></thead>
          <tbody>${invUsers.map(u=>userRow(u,true)).join('')||'<tr><td colspan="4" class="muted">No Site Investigators configured.</td></tr>'}</tbody>
        </table>
      </div>
    </section>

    <!-- Super Administrators -->
    <section class="card" style="margin-bottom:16px">
      <div class="card-head">
        <div>
          <h2>System Administrators</h2>
          <small>Full governance over users, sites, and system configuration</small>
        </div>
        <span class="tag" style="background:#1b1d22;color:#fff">${adminUsers.length} Admins</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Administrator</th><th>Role</th><th>Scope</th><th>Access</th></tr></thead>
          <tbody>${adminUsers.map(u=>userRow(u,false)).join('')}</tbody>
        </table>
      </div>
    </section>

    <!-- Central Team Export & Monitoring Audit Trail -->
    <section class="card" style="margin-bottom:16px">
      <div class="card-head">
        <div>
          <h2>Central Team Export &amp; Monitoring Audit Log</h2>
          <small>Governance trail of all research exports and data inspections performed by the Central Team</small>
        </div>
        <span class="tag" style="background:var(--soft);color:var(--ink)">${auditLogs.length} Events</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Timestamp</th><th>Central User</th><th>Action</th><th>Target Scope</th><th>Details</th></tr></thead>
          <tbody>
            ${auditLogs.slice(0, 15).map(a=>`<tr>
              <td style="font-size:12px;white-space:nowrap">${esc(a.t)}</td>
              <td><b>${esc(a.name)}</b> <span class="muted">(${esc(a.username)})</span></td>
              <td><span class="tag info" style="font-size:11px">${esc(a.action)}</span></td>
              <td><code>${esc(a.target)}</code></td>
              <td><span class="muted">${esc(a.details)}</span></td>
            </tr>`).join('') || '<tr><td colspan="5" class="muted">No Central Team export actions recorded yet.</td></tr>'}
          </tbody>
        </table>
      </div>
    </section>

    <!-- Add User Form -->
    <section class="card addcard">
      <div class="card-head">
        <div>
          <h2>Provision User Account</h2>
          <small>Enroll clinical site investigators or central monitoring officers. Fields marked <span class="req" aria-hidden="true">*</span> are required.</small>
        </div>
        <div class="form-head-badges" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="tag info"><i class="ms" style="font-size:14px;vertical-align:-2px">shield_person</i>Access Governance</span>
          <span class="tag"><i class="ms" style="font-size:14px;vertical-align:-2px">verified_user</i>Role Security</span>
        </div>
      </div>
      <form id="fUser" class="addform" novalidate>
        <div class="add-layout">
          <div class="form-steps-container">
            <!-- Step 1: Account & Credentials -->
            <div class="form-step">
              <div class="step-head">
                <span class="step-num">1</span>
                <div class="step-head-text">
                  <h3>Authentication &amp; System Credentials</h3>
                  <p>Core login identifier used for signing in and clinical audit trail attribution</p>
                </div>
              </div>
              <div class="fld-grid-2">
                <div class="fld">
                  <label for="uName">Full Name <span class="req" aria-hidden="true">*</span></label>
                  <div class="input-wrap">
                    <i class="ms input-icon">person</i>
                    <input id="uName" name="name" autocomplete="name" aria-required="true" placeholder="e.g. Dr. Sara Ahmed">
                  </div>
                  <span class="fmsg" data-for="uName"></span>
                </div>
                <div class="fld">
                  <label for="uUser">Username Handle <span class="req" aria-hidden="true">*</span></label>
                  <div class="input-wrap">
                    <i class="ms input-icon">alternate_email</i>
                    <input id="uUser" name="username" autocapitalize="off" spellcheck="false" autocomplete="off" aria-required="true" placeholder="e.g. sara.ahmed">
                    <span class="avail-badge" id="uAvailBadge"></span>
                  </div>
                  <span class="fmsg hint-txt" data-for="uUser">Auto-filled from name. Lowercase letters, numbers, dot or underscore.</span>
                </div>
              </div>
            </div>

            <!-- Step 2: Professional & Contact Details -->
            <div class="form-step">
              <div class="step-head">
                <span class="step-num">2</span>
                <div class="step-head-text">
                  <h3>Professional Background &amp; Contact Details</h3>
                  <p>Clinical qualifications, designation and contact channels (optional details)</p>
                </div>
              </div>
              <div class="fld-grid-2">
                <div class="fld">
                  <label for="uDesig">Clinical Designation</label>
                  <div class="input-wrap">
                    <i class="ms input-icon">medical_services</i>
                    <input id="uDesig" name="designation" autocomplete="organization-title" placeholder="e.g. Consultant Cardiologist">
                  </div>
                  <span class="fmsg" data-for="uDesig"></span>
                </div>
                <div class="fld">
                  <label for="uQual">Medical Qualification</label>
                  <div class="input-wrap">
                    <i class="ms input-icon">school</i>
                    <input id="uQual" name="qualification" autocomplete="off" placeholder="e.g. MBBS, FCPS (Cardiology)">
                  </div>
                  <span class="fmsg" data-for="uQual"></span>
                </div>
                <div class="fld">
                  <label for="uEmail">Official Email</label>
                  <div class="input-wrap">
                    <i class="ms input-icon">mail</i>
                    <input id="uEmail" name="email" type="email" inputmode="email" autocapitalize="off" spellcheck="false" autocomplete="email" placeholder="e.g. sara.ahmed@hospital.pk">
                  </div>
                  <span class="fmsg" data-for="uEmail"></span>
                </div>
                <div class="fld">
                  <label for="uPhone">Mobile Number</label>
                  <div class="input-wrap">
                    <i class="ms input-icon">call</i>
                    <input id="uPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="e.g. 0300 1234567">
                  </div>
                  <span class="fmsg hint-txt" data-for="uPhone">7 to 15 digits</span>
                </div>
              </div>
            </div>

            <!-- Step 3: Role & System Privileges -->
            <div class="form-step">
              <div class="step-head">
                <span class="step-num">3</span>
                <div class="step-head-text">
                  <h3>Role &amp; System Privileges <span class="req" aria-hidden="true">*</span></h3>
                  <p>Determines CRF data entry rights, multi-site scope and administrative capabilities</p>
                </div>
              </div>
              ${isCentral()?`<p class="np-lead" style="margin-bottom:12px">${esc(CENTRAL_MSG)}</p>`:''}
              <div class="role-cards-grid">${roleCards}</div>
            </div>

            <!-- Step 4: Medical Centres Assignment -->
            <div class="form-step" id="siteBlock">
              <div class="step-head">
                <span class="step-num">4</span>
                <div class="step-head-text" style="flex:1">
                  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                    <div>
                      <h3 id="siteBlockTitle">Assigned Medical Centres (Sites) <span class="req" aria-hidden="true">*</span></h3>
                      <p id="siteBlockDesc">Site Investigators require at least one hospital centre to enroll patients and enter clinical CRFs.</p>
                    </div>
                    <span class="site-selection-counter" id="sitesCount">0 centres selected</span>
                  </div>
                </div>
              </div>

              <!-- Interactive site grid for Site Investigators -->
              <div class="site-selection-container" id="siteSelectionArea">
                <div class="site-filter-bar">
                  <div class="site-zone-chips" id="zoneFilterChips">
                    <button type="button" class="zone-chip active" data-zone="all">All Centres (${s.sites.length})</button>
                    ${s.zones.map(z=>`<button type="button" class="zone-chip" data-zone="${esc(z)}">${esc(z)} (${s.sites.filter(x=>x.zone===z).length})</button>`).join('')}
                  </div>
                  <div class="site-quick-actions">
                    <button type="button" class="btn" id="allSites"><i class="ms">select_all</i>Select all</button>
                    <button type="button" class="btn" id="clearSites"><i class="ms">deselect</i>Clear</button>
                  </div>
                </div>
                <div class="site-cards-grid" id="siteCardsGrid">
                  ${renderSiteCards(s.sites)}
                </div>
                <span class="fmsg" data-for="sites"></span>
              </div>

              <!-- Scope Callout Banner for Central Directorate and Super Admin -->
              <div id="siteScopeBanner" hidden></div>
            </div>
          </div>

          <!-- Right Column: Live User Identity Profile Preview -->
          <aside class="add-summary" aria-label="Profile Identity Preview">
            <div class="add-summary-header">
              <div class="summary-badge-live">
                <span class="pulse-dot"></span>Live Profile Preview
              </div>
              <span class="summary-id-label">STAND-HF</span>
            </div>

            <div class="user-preview-card" id="userPreviewCard">
              <div class="user-preview-avatar-wrap">
                <div class="user-preview-avatar" id="sumAvatar">?</div>
                <div class="user-preview-status-dot"></div>
              </div>
              <div class="user-preview-name" id="sumName">New User Account</div>
              <div class="user-preview-handle" id="sumUser">@username</div>
              <div class="user-preview-role-tag">
                <span class="role-chip" id="sumRole">Site Investigator</span>
              </div>
              <div class="user-preview-meta">
                <span id="sumMetaText">Clinical Staff</span>
              </div>
            </div>

            <div class="preview-details-group">
              <div class="preview-item">
                <span class="preview-label"><i class="ms">contact_mail</i>Contact Channels</span>
                <div class="preview-val-chips">
                  <span class="chip muted" id="sumEmailChip"><i class="ms">mail</i>No email</span>
                  <span class="chip muted" id="sumPhoneChip"><i class="ms">call</i>No mobile</span>
                </div>
              </div>

              <div class="preview-item">
                <span class="preview-label"><i class="ms">local_hospital</i>Assigned Centres</span>
                <div class="sites-summary-text" id="sumSites">None selected (Required)</div>
                <div class="sites-summary-pills" id="sumSitesPills"></div>
              </div>
            </div>

            <div class="preview-readiness">
              <div class="readiness-bar"><div class="readiness-fill" id="readinessFill" style="width:25%"></div></div>
              <div class="readiness-text" id="readinessText"><i class="ms">pending</i> Enter full name</div>
            </div>

            <p class="muted add-summary-note" id="userPreview" aria-live="polite">Will sign in as <code>username</code></p>

            <div class="foot-actions">
              <button type="button" class="btn" id="uReset"><i class="ms">restart_alt</i>Clear Form</button>
              <button type="submit" class="pri" id="uSubmit"><i class="ms">person_add</i>Create User Account</button>
            </div>
          </aside>
        </div>
      </form>
    </section>`;
}

function sitesView(){
  const s=accessStore(),ps=patients();
  const rows=s.sites.map(x=>{
    const inv=s.users.filter(u=>u.role==='investigator'&&u.active&&u.sites.includes(x.code)).length;
    const n=ps.filter(p=>p.site===x.code).length;
    return `<tr><td><b>${esc(x.code)}</b></td><td><input value="${esc(x.name)}" data-site-name="${esc(x.code)}" aria-label="Name of site ${esc(x.code)}"></td><td class="num">${n}</td><td class="num">${inv}</td></tr>`;
  }).join('');
  return `<section class="card">
      <div class="card-head"><h2>Sites</h2><small>${s.sites.length} sites</small></div>
      <div class="table-wrap"><table><tr><th>Code</th><th>Name</th><th class="num">Patients</th><th class="num">Investigators</th></tr>${rows}</table></div>
    </section>
    <section class="card addcard">
      <div class="card-head"><h2>Add a site</h2><small>Sites group patients and decide who can see them. Fields marked <span class="req" aria-hidden="true">*</span> are required.</small></div>
      <form id="fSite" class="addform" novalidate>
        <div class="sec">Site details</div>
        <div class="g tint">
          <label for="sCode">Site code<span class="req" aria-hidden="true">*</span><input id="sCode" name="code" maxlength="5" autocapitalize="characters" autocomplete="off" aria-required="true" placeholder="e.g. RIC"><span class="fmsg hint-txt" data-for="sCode">2 to 5 letters or numbers. Used to number patients, for example RIC-001.</span></label>
          <label for="sName">Site name<span class="req" aria-hidden="true">*</span><input id="sName" name="name" autocomplete="off" aria-required="true" placeholder="e.g. Riverside Cardiac Centre"><span class="fmsg" data-for="sName"></span></label>
        </div>
        <div class="addform-foot">
          <span class="muted" id="sitePreview" aria-live="polite"></span>
          <div class="foot-actions">
            <button type="button" class="btn" id="sReset">Clear</button>
            <button type="submit" class="pri">Add site</button>
          </div>
        </div>
      </form>
    </section>`;
}

function permsView(){
  const s=accessStore(),roles=['investigator','central'];
  const head=`<tr><th>Permission</th>${roles.map(r=>`<th class="num">${ROLE_NAMES[r]}</th>`).join('')}<th class="num">${ROLE_NAMES[SUPER]}</th></tr>`;
  const rows=PERMS.map(([k,l])=>`<tr><td>${l}</td>
    ${roles.map(r=>`<td class="num"><input type="checkbox" data-perm-role="${r}" data-perm-key="${k}" ${s.perms[r]&&s.perms[r][k]?'checked':''} aria-label="${ROLE_NAMES[r]}: ${l}"></td>`).join('')}
    <td class="num"><input type="checkbox" ${SUPER_NO.includes(k)?'':'checked'} disabled aria-label="${ROLE_NAMES[SUPER]}: ${l}"></td></tr>`).join('');
  return `<section class="card">
    <div class="card-head"><h2>Role permissions</h2><small>Super Admin oversees all sites and does not enter patient data</small></div>
    <div class="table-wrap"><table>${head}${rows}</table></div>
  </section>`;
}

let query='';
function applySearch(){
  const q=query.trim().toLowerCase();
  document.querySelectorAll('#view table tr').forEach(r=>{
    if(!r.querySelector('td'))return;
    r.hidden=!!q&&!r.textContent.toLowerCase().includes(q);
  });
}
function render(){
  $('view').innerHTML=tab==='users'?usersView():tab==='sites'?sitesView():permsView();
  $('view').classList.remove('form-in');void $('view').offsetWidth;$('view').classList.add('form-in');
  applySearch();
  if(tab==='users'&&highlightUser){const hl=document.querySelector(`[data-user-row="${CSS.escape(highlightUser)}"]`);if(hl)hl.scrollIntoView({block:'center'})}
  userPreview();sitePreview();
}
$('search').addEventListener('input',()=>{query=$('search').value;applySearch()});

/* Sections follow the URL hash, set from the side nav */
window.addEventListener('hashchange',()=>{tab=tabFromHash();render()});

/* Edits in the tables */
$('view').addEventListener('change',e=>{
  const t=e.target,me=session().username;
  if(t.name==='role'){userPreview();return}
  if(t.name==='site'){userPreview();return}
  if(t.dataset.roleOf){
    const u=t.dataset.roleOf,role=t.value;
    commit(s=>{
      const user=s.users.find(x=>x.username===u);if(!user)return '';
      if(!centralMay(user,user.role))return CENTRAL_MSG;
      if(!centralMay(user,role))return CENTRAL_MSG;
      if(u===me&&role!==SUPER)return 'You cannot change your own role';
      if(user.role===SUPER&&role!==SUPER&&user.active&&activeSupers(s)<=1)return 'At least one active Super Admin is needed';
      user.role=role;if(role===SUPER)user.sites=[];
      return '';
    });
  }
  else if(t.dataset.siteOf){
    const u=t.dataset.siteOf,code=t.value;
    commit(s=>{
      const user=s.users.find(x=>x.username===u);if(!user)return '';
      if(!centralMay(user,user.role))return CENTRAL_MSG;
      const set=new Set(user.sites);t.checked?set.add(code):set.delete(code);
      user.sites=[...set];return '';
    });
  }
  else if(t.dataset.activeOf){
    const u=t.dataset.activeOf,on=t.checked;
    commit(s=>{
      const user=s.users.find(x=>x.username===u);if(!user)return '';
      if(!centralMay(user,user.role))return CENTRAL_MSG;
      if(u===me&&!on)return 'You cannot deactivate your own account';
      if(user.role===SUPER&&!on&&activeSupers(s)<=1)return 'At least one active Super Admin is needed';
      user.active=on;return '';
    });
  }
  else if(t.dataset.siteName){
    const code=t.dataset.siteName;
    commit(s=>{
      const site=s.sites.find(x=>x.code===code);if(!site)return '';
      const v=t.value.trim();if(!v)return 'Site name cannot be empty';
      site.name=v;return '';
    });
  }
  else if(t.dataset.permRole){
    const r=t.dataset.permRole,k=t.dataset.permKey,on=t.checked;
    commit(s=>{s.perms[r]=s.perms[r]||{};s.perms[r][k]=on;return ''});
  }
});

/* Live feedback while typing */
$('view').addEventListener('input',e=>{
  const x=e.target;
  if(x.id==='uName'){
    if(!userTouched)$('uUser').value=slug(x.value);
    setMsg('uName','',false);refreshUsernameMsg();userPreview();
  }
  else if(x.id==='uUser'){
    userTouched=true;
    refreshUsernameMsg();
    userPreview();
  }
  else if(x.id==='sCode'){
    x.value=x.value.toUpperCase();
    const c=x.value.trim(),used=accessStore().sites.some(y=>y.code===c);
    setMsg('sCode',used?'That code is already used':'2 to 5 letters or numbers. Used to number patients, for example RIC-001.',used);
    sitePreview();
  }
  else if(x.id==='sName')setMsg('sName','',false);
  else if(x.id==='uEmail'){
    const v=x.value.trim(),bad=!!v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    setMsg('uEmail',bad?'Enter a valid email address':'',bad);
    userPreview();
  }
  else if(x.id==='uPhone'){
    const d=x.value.replace(/\D/g,''),bad=!!x.value.trim()&&(d.length<7||d.length>15);
    setMsg('uPhone',bad?'Enter 7 to 15 digits':'7 to 15 digits',bad);
    userPreview();
  }
  else if(x.id==='uDesig'||x.id==='uQual'){
    userPreview();
  }
});

/* Name is checked when the field is left, not on every keystroke */
$('view').addEventListener('focusout',e=>{
  const x=e.target;
  if(x.id==='uName'&&x.value.trim()===''&&x.dataset.touched==='1')setMsg('uName','Enter the full name',true);
  if(x.id==='uName')x.dataset.touched='1';
});

/* Clear the new-user and new-site forms back to their defaults */
$('view').addEventListener('click',e=>{
  if(e.target.closest('#uReset')){
    userTouched=false;
    render();
    $('uName')?.focus();
  }
  else if(e.target.closest('#sReset')){
    render();
    $('sCode')?.focus();
  }
});

/* Select all / clear all sites and zone filtering in the new-user form */
$('view').addEventListener('click',e=>{
  const chip=e.target.closest('.zone-chip');
  if(chip){
    const zone=chip.dataset.zone;
    document.querySelectorAll('.zone-chip').forEach(c=>c.classList.toggle('active',c===chip));
    document.querySelectorAll('#siteCardsGrid .site-card-item').forEach(card=>{
      card.style.display=(zone==='all'||card.dataset.zone===zone)?'':'none';
    });
    return;
  }
  const clearBtn=e.target.closest('#clearSites');
  if(clearBtn){
    const boxes=[...document.querySelectorAll('#fUser input[name="site"]')];
    boxes.forEach(x=>{x.checked=false});
    const allBtn=$('allSites');
    if(allBtn) allBtn.innerHTML='<i class="ms">select_all</i>Select all';
    setMsg('sites','',false);
    userPreview();
    return;
  }
  const allBtn=e.target.closest('#allSites');
  if(allBtn){
    const visibleCards=[...document.querySelectorAll('#siteCardsGrid .site-card-item')].filter(c=>c.style.display!=='none');
    const boxes=visibleCards.map(c=>c.querySelector('input[name="site"]')).filter(Boolean);
    const anyUnchecked=boxes.some(x=>!x.checked);
    boxes.forEach(x=>{x.checked=anyUnchecked});
    allBtn.innerHTML=anyUnchecked?'<i class="ms">deselect</i>Clear all':'<i class="ms">select_all</i>Select all';
    setMsg('sites','',false);
    userPreview();
    return;
  }
});

/* Add user and add site */
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='fUser'){
    const name=$('uName').value.trim(),username=$('uUser').value.trim().toLowerCase();
    const role=isCentral()?'investigator':(f.querySelector('input[name="role"]:checked')||{}).value;
    const sites=[...f.querySelectorAll('input[name="site"]:checked')].map(x=>x.value);
    const users=accessStore().users;
    const uMsg=!username?'Enter a username':!/^[a-z0-9._]+$/.test(username)?'Use lowercase letters, numbers, dot or underscore':users.some(u=>u.username===username)?'That username is already used':'';
    const sMsg=role==='investigator'&&!sites.length?'Choose at least one medical centre for Site Investigator':'';
    /* Optional personal details: only validated when filled in */
    const email=$('uEmail').value.trim(),phone=$('uPhone').value.replace(/\D/g,''),desig=$('uDesig').value.trim(),qual=$('uQual').value.trim();
    const eMsg=email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'Enter a valid email address':'';
    const pMsg=$('uPhone').value.trim()&&(phone.length<7||phone.length>15)?'Enter 7 to 15 digits':'';
    setMsg('uName',name?'':'Enter the full name',!name);
    setMsg('uUser',uMsg||'Lowercase letters, numbers, dot or underscore',!!uMsg);
    setMsg('sites',sMsg,!!sMsg);
    setMsg('uEmail',eMsg,!!eMsg);
    setMsg('uPhone',pMsg||'7 to 15 digits',!!pMsg);
    if(!name||uMsg||sMsg||eMsg||pMsg){(f.querySelector('[aria-invalid="true"]')||$('uName')).focus();return}
    const personal={email,phone,designation:desig,qualification:qual};
    const saved=commit(s=>{
      if(s.users.some(u=>u.username===username))return 'That username was just taken. Choose another.';
      const userSites=role==='investigator'?sites:[];
      const userZones=role==='central'?['North','Central','South']:role===SUPER?[]:[...new Set(sites.map(c=>s.sites.find(st=>st.code===c)?.zone).filter(Boolean))];
      s.users.push({username,name,role,sites:userSites,zones:userZones,active:true,personal});
      return '';
    });
    if(!saved)return;
    userTouched=false;
    toast(`${name} added as ${ROLE_NAMES[role]}`);
    $('uName')?.focus();
  }
  else if(f.id==='fSite'){
    const code=$('sCode').value.trim().toUpperCase(),name=$('sName').value.trim();
    const cMsg=!code?'Enter a site code':!/^[A-Z0-9]{2,5}$/.test(code)?'Use 2 to 5 letters or numbers':accessStore().sites.some(x=>x.code===code)?'That code is already used':'';
    setMsg('sCode',cMsg||'2 to 5 letters or numbers. Used to number patients, for example RIC-001.',!!cMsg);
    setMsg('sName',name?'':'Enter the site name',!name);
    if(cMsg||!name){(f.querySelector('[aria-invalid="true"]')||$('sCode')).focus();return}
    commit(s=>{s.sites.push({code,name});return ''});
    toast(`Site ${code} added`);
    $('sCode')?.focus();
  }
});

/* Header */
const name=session().name;
$('userName').textContent=name||'Signed in';
$('userRole').textContent=ROLE_NAMES[session().role]||'';
$('welcome').textContent='System Administration';
$('avatar').textContent=initials(name);
$('bOut').onclick=()=>{try{sessionStorage.removeItem('standhf_auth')}catch(e){}location.replace(LOGIN)};

render();
</script>
</body>
</html>
